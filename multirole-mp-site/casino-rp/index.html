         mode ; sans elles, le raccourci rouvrirait simplement Safari. -->

      // Couleur de chaque type de face. Partagée par le tirage (qui l'envoie
      // avec le résultat) et par l'animation (qui fait défiler les faces).
      // Ce que fait une face, en une phrase. L'organisateur peut écrire la
      // sienne dans l'admin ; sinon on la déduit de la face elle-même, ce qui
      // marche aussi sur une partie enregistrée avant ce champ.
      const texteFace = (face) => {
        if (!face) return "";
        if (face.note) return face.note;
        const pct = nombreSur(face.pct, 0);
        if (face.type === "Rouge")
          return `L'attaque échoue : ${pct} % de votre solde passent à votre cible.`;
        if (face.type === "Vert")
          return `Attaque réussie : vous saisissez ${pct} % du solde de votre cible.`;
        if (face.type === "Don")
          return `Solidarité : ${pct} % de chacun des deux soldes partent aux plus démunis.`;
        return "";
      };

      // ---- Le temps de garde d'une carte ----
      // Une carte scannée ne part pas au quart de tour : le joueur doit la
      // garder un moment en main. Le délai se règle dans l'admin, et chaque
      // carte dit si elle l'observe — sinon elle est jouable tout de suite.
      const DELAI_CARTE_DEFAUT = 15;
      // En simulation on ne va pas attendre un quart d'heure pour essayer une
      // carte : dix secondes suffisent à voir le décompte tourner, et à
      // vérifier que le bouton revient bien ensuite.
      const DELAI_CARTE_SIMULATION_SEC = 10;

      const attenteCarte = (carte, cartes, cfg, simulation) => {
        // On lit le réglage sur la carte du jeu, pas sur la copie posée dans
        // le deck : décocher la case dans l'admin libère aussitôt les cartes
        // déjà distribuées.
        const modele =
          (cartes || []).find((x) => x.id === (carte || {}).id) || carte || {};
        // Une carte réglée sur « jouable dès le scan » le reste, même en
        // simulation : le raccourci ne rallonge jamais une attente.
        if (modele.delaiAvantUsage === false) return 0;
        if (simulation) return DELAI_CARTE_SIMULATION_SEC * 1000;
        return (
          Math.max(0, nombreSur((cfg || {}).delaiCarteMin, DELAI_CARTE_DEFAUT)) *
          60000
        );
      };

      // Ce qu'il reste à patienter, en millisecondes. Zéro = jouable.
      const resteAvantUsage = (carte, cartes, cfg, maintenant, simulation) => {
        const attente = attenteCarte(carte, cartes, cfg, simulation);
        if (!attente) return 0;
        const recu = nombreSur((carte || {}).recuLe, 0);
        // Une carte ramassée avant ce réglage n'a pas d'horodatage : on ne va
        // pas la bloquer pour autant.
        if (!recu) return 0;
        return Math.max(0, recu + attente - maintenant);
      };

      const compteARebours = (ms) => {
        const s = Math.ceil(Math.max(0, ms) / 1000);
        if (s < 60) return `${s} s`;
        const m = Math.floor(s / 60);
        const r = s % 60;
        return r ? `${m} min ${String(r).padStart(2, "0")} s` : `${m} min`;
      };

      const COULEURS_FACE = {

        Vert: "#4CAF50",
        Don: "#2196F3",
        Zéro: "#9C27B0"

      // Ce que fait chaque couleur, sans le pourcentage : c'est la règle du
      // jeu, la même pour toutes les faces de cette couleur. Le joueur la lit
      // à côté du dé, avant de lancer.

        {

      // Les casaques des chevaux. Franches et sombres : c'est ce qui ressort

        "#1565C0", // bleu roi

        },
        {
          id: "garde_du_corps",
          nom: "Garde du corps",

            "Il ne peut rien contre le fisc : le contrôle fiscal et l'impôt de fin de bloc passent outre. Ce sont des lois, pas des voleurs.\n\n" +

        },
        {

        },

          modeEmploi:
            "Activez-la depuis votre deck, puis allez jouer. Le premier pari ou investissement que vous PERDEZ chez le financier vous est remboursé, et la carte est consommée à ce moment-là.\n\n" +
            "Si vous gagnez, elle ne bouge pas : elle attend la prochaine perte. Vous pouvez la garder armée toute la soirée.",
          delaiAvantUsage: true,
          phraseAnim: "Un contrat vient d'être signé."
        },
        {
          id: "herbes_medicinales",
          nom: "Herbes médicinales",
          definition:
            "Un cheval qui court mieux : plus de chances de gagner, et la certitude de ne pas finir dernier.",
          modeEmploi:
            "Activez-la depuis votre deck AVANT de miser, puis allez parier chez le bookmaker : elle s'appliquera au cheval sur lequel vous misez, pour cette course-là.\n\n" +
            "Le cheval gagne plus souvent, et surtout il ne finit jamais dernier. La carte est consommée une fois la course courue.\n\n" +
            "Une seule fiole par course : si quelqu'un a déjà versé la sienne, il faut attendre la course suivante.",
          delaiAvantUsage: true,
          phraseAnim: "Un seau d'eau trouble à l'écurie..."
        }
      ];

      // ================= LE PLEIN ÉCRAN =================
      // Le navigateur n'accorde le plein écran que sur un geste de
      // l'utilisateur : impossible de le déclencher tout seul, d'où un bouton.
      // Safari a gardé ses préfixes, et l'iPhone ne le propose pas du tout
      // pour autre chose qu'une vidéo — sur ce matériel, le bouton le dit.
      const enPleinEcran = () =>
        !!(document.fullscreenElement || document.webkitFullscreenElement);

      const passerEnPleinEcran = () => {
        const e = document.documentElement;
        const f = e.requestFullscreen || e.webkitRequestFullscreen;
        if (!f) return Promise.reject(new Error("indisponible"));
        try {
          return Promise.resolve(f.call(e));
        } catch (err) {
          return Promise.reject(err);
        }
      };

      const quitterLePleinEcran = () => {
        const f = document.exitFullscreen || document.webkitExitFullscreen;
        // On peut demander la sortie alors qu'on n'y est déjà plus — après un
        // Échap, par exemple. Le navigateur rejette alors la promesse : on
        // l'attrape, ce n'est pas une erreur.
        if (!f || !enPleinEcran()) return;
        try {
          const sortie = f.call(document);
          if (sortie && sortie.catch) sortie.catch(() => {});
        } catch (err) {
          /* rien à faire : on n'y était déjà plus */
        }
      };

      // ================= OUTILS DU BOOKMAKER =================

      // Générateur pseudo-aléatoire semé. Toute la course en découle : à
      // partir du même numéro de course, chaque appareil calcule le même
      // vainqueur et le même déroulé, sans rien échanger sur le réseau.
      // C'est ce qui permet à la salle de voir la même course même si le
      // wifi lâche pendant la minute.
      const semer = (graine) => {
        let a = graine >>> 0;
        return () => {
          a += 0x6d2b79f5;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      };

      const nombreSur = (v, secours) => {
        const n = Number(v);
        return Number.isFinite(n) ? n : secours;
      };

      // ---- Le don de solidarité ----
      // Une face « Don » ne saupoudre pas : elle remonte le bas du classement.
      // La cagnotte va aux trois derniers — y compris l'attaquant ou sa cible
      // s'ils en font partie —, et sert d'abord à les mettre à hauteur, à dix
      // dollars près. Quand elle n'y suffit pas on se rabat sur les deux
      // derniers, et quand elle n'y suffit toujours pas le dernier prend
      // tout : il reste de toute façon derrière l'avant-dernier.
      const ECART_SOLIDAIRE = 10;

      // `comptes` : [{ id, solde }] avec les soldes D'APRÈS la saisie. Celui
      // qu'on vient de délester peut avoir rejoint les derniers, et c'est à sa
      // nouvelle place qu'il doit compter.
      // Renvoie { id: montant } — la somme des montants vaut exactement la
      // cagnotte, au dollar près.
      const repartirSolidarite = (cagnotte, comptes) => {
        const pot = Math.max(0, Math.round(nombreSur(cagnotte, 0)));
        if (pot <= 0 || !comptes || !comptes.length) return {};

        const classes = [...comptes].sort(
          (a, b) => nombreSur(a.solde, 0) - nombreSur(b.solde, 0)
        );
        const parts = {};
        const verser = (id, montant) => {
          if (montant > 0) parts[id] = (parts[id] || 0) + montant;
        };

        // Ce qu'il faut pour amener tout un groupe au niveau du plus riche
        // d'entre eux, à l'écart toléré près. Personne ne redescend.
        const niveauDe = (groupe) =>
          Math.max(
            0,
            nombreSur(groupe[groupe.length - 1].solde, 0) - ECART_SOLIDAIRE
          );
        const manqueDe = (groupe, niveau) =>
          groupe.reduce(
            (t, j) => t + Math.max(0, niveau - nombreSur(j.solde, 0)),
            0
          );
        // Le surplus se partage à parts égales ; les dollars indivisibles
        // vont aux plus bas, le groupe étant rangé du plus pauvre au moins
        // pauvre.
        const partagerLeReste = (groupe, reste) => {
          if (reste <= 0) return;
          const part = Math.floor(reste / groupe.length);
          let sup = reste - part * groupe.length;
          groupe.forEach((j) => {
            verser(j.id, part + (sup > 0 ? 1 : 0));
            if (sup > 0) sup -= 1;
          });
        };

        // 1. Les trois derniers à hauteur.
        // 2. Sinon les deux derniers.
        for (const combien of [3, 2]) {
          if (classes.length < combien) continue;
          const groupe = classes.slice(0, combien);
          const niveau = niveauDe(groupe);
          const manque = manqueDe(groupe, niveau);
          if (pot < manque) continue;
          groupe.forEach((j) =>
            verser(j.id, Math.max(0, niveau - nombreSur(j.solde, 0)))
          );
          partagerLeReste(groupe, pot - manque);
          return parts;
        }

        // 3. Sinon le dernier prend tout.
        verser(classes[0].id, pot);
        return parts;
      };

      // ---- L'impôt de fin de bloc ----
      // Les plus riches versent un pourcentage de leur fortune, redistribué
      // aux plus pauvres à chaque changement de bloc. La règle du jeu tient en
      // une phrase : le prélèvement resserre les écarts, il ne double
      // personne. C'est aux joueurs de se doubler ensuite.
      const IMPOT_DEFAUT = { pct: 1, payeurs: 5, beneficiaires: 10 };
      // Un dollar de marge partout, pour qu'on ne crée jamais d'égalité — deux
      // soldes identiques, et l'ordre affiché devient arbitraire.
      const MARGE_IMPOT = 1;

      // Combien de contribuables et de bénéficiaires sur une table de `n`
      // joueurs. Les deux groupes ne doivent jamais se toucher : sur une
      // petite table on les réduit proportionnellement plutôt que de renoncer.
      const groupesImpot = (n, cfg) => {
        let p = Math.max(0, Math.round(nombreSur(cfg.impotBlocPayeurs, IMPOT_DEFAUT.payeurs)));
        let b = Math.max(0, Math.round(nombreSur(cfg.impotBlocBeneficiaires, IMPOT_DEFAUT.beneficiaires)));
        if (p < 1 || b < 1 || n < 2) return null;
        if (p + b > n) {
          const facteur = n / (p + b);
          p = Math.max(1, Math.floor(p * facteur));
          b = Math.max(1, Math.floor(b * facteur));
          while (p + b > n && p > 1) p -= 1;
          while (p + b > n && b > 1) b -= 1;
        }
        return p + b <= n ? { payeurs: p, beneficiaires: b } : null;
      };

      // `comptes` : [{ id, fortune, solde }], déjà purgé des paradis fiscaux.
      // Renvoie { preleve: {id: montant}, verse: {id: montant}, total }, avec
      // toujours autant de versé que de prélevé.
      const impotDeBloc = (comptes, cfg) => {
        const vide = { preleve: {}, verse: {}, total: 0 };
        const pct = Math.max(0, nombreSur((cfg || {}).impotBlocPct, IMPOT_DEFAUT.pct));
        if (pct <= 0 || !comptes || comptes.length < 2) return vide;

        // Du plus riche au plus pauvre : c'est l'ordre qu'il faut préserver.
        const classes = [...comptes].sort(
          (a, b) => nombreSur(b.fortune, 0) - nombreSur(a.fortune, 0)
        );
        const n = classes.length;
        const tailles = groupesImpot(n, cfg || {});
        if (!tailles) return vide;
        const { payeurs: nbP, beneficiaires: nbB } = tailles;

        // ---- Ce que versent les riches ----
        const fortune = (j) => nombreSur(j.fortune, 0);
        const preleve = {};
        const paye = classes.map((j, i) =>
          i >= nbP
            ? 0
            : // On ne peut prendre que ce qui est sur le compte : le reste de
              // la fortune est en jetons sur une table.
              Math.max(
                0,
                Math.min(
                  Math.round((fortune(j) * pct) / 100),
                  Math.round(Math.max(0, nombreSur(j.solde, 0)))
                )
              )
        );
        // Un même pourcentage ne suffit pas à préserver l'ordre : celui dont
        // l'argent dort en jetons ne peut payer que son solde, donc il descend
        // moins que son voisin du dessus et lui passerait devant. On remonte
        // donc le groupe depuis le bas, chacun devant rester au-dessus de
        // celui qu'il précède une fois prélevé.
        for (let i = nbP - 1; i >= 0; i--) {
          const plancher =
            i + 1 < n
              ? fortune(classes[i + 1]) - paye[i + 1] + MARGE_IMPOT
              : 0;
          paye[i] = Math.max(0, Math.min(paye[i], fortune(classes[i]) - plancher));
        }

        // ---- Ce que le bas du classement peut absorber ----
        // Les bénéficiaires, du plus pauvre au moins pauvre.
        const groupe = classes.slice(n - nbB).reverse();
        const iAuDessus = n - nbB - 1;
        // Le joueur juste au-dessus du groupe est intouchable ; s'il vient de
        // payer, c'est sa fortune d'après le prélèvement qui fait plafond.
        const plafondHaut =
          iAuDessus >= 0
            ? fortune(classes[iAuDessus]) - paye[iAuDessus] - MARGE_IMPOT
            : Infinity;
        // Une échelle à un dollar d'écart sous ce plafond : le plus haut du
        // groupe peut monter au plafond, celui d'en dessous un cran plus bas,
        // et ainsi de suite. Personne ne double personne, personne n'égale
        // personne.
        const plafondDe = (k) =>
          plafondHaut === Infinity ? Infinity : plafondHaut - (groupe.length - 1 - k);
        const capacite = groupe.reduce(
          (t, j, k) => t + Math.max(0, plafondDe(k) - fortune(j)),
          0
        );

        // ---- La cagnotte se règle sur cette capacité ----
        const brut = paye.reduce((t, m) => t + m, 0);
        const total = Math.min(brut, capacite);
        if (total <= 0) return vide;
        if (total < brut) {
          // On prélève moins, au prorata. Les dollars indivisibles vont aux
          // plus gros contributeurs : plus grand reste.
          const exact = paye.map((m) => (m * total) / brut);
          const bas = exact.map(Math.floor);
          let manque = total - bas.reduce((t, m) => t + m, 0);
          exact
            .map((v, i) => ({ i, reste: v - Math.floor(v) }))
            .sort((a, b) => b.reste - a.reste)
            .forEach((x) => {
              if (manque > 0) {
                bas[x.i] += 1;
                manque -= 1;
              }
            });
          bas.forEach((m, i) => {
            if (m > 0) preleve[classes[i].id] = m;
          });
        } else {
          paye.forEach((m, i) => {
            if (m > 0) preleve[classes[i].id] = m;
          });
        }

        // ---- Et le bas remonte, en commençant par les plus bas ----
        // On cherche le niveau commun le plus haut que la cagnotte permet ;
        // chacun monte à ce niveau, sans dépasser son propre plafond, et en
        // gardant un dollar d'écart avec son voisin.
        const cible = (niveau, k) =>
          Math.max(
            fortune(groupe[k]),
            Math.min(niveau + k * MARGE_IMPOT, plafondDe(k))
          );
        const cout = (niveau) =>
          groupe.reduce((t, j, k) => t + (cible(niveau, k) - fortune(j)), 0);
        let bas = fortune(groupe[0]);
        let haut = bas + total + MARGE_IMPOT * groupe.length + 1;
        for (let tour = 0; tour < 64 && haut - bas > 1; tour++) {
          const milieu = Math.floor((bas + haut) / 2);
          if (cout(milieu) <= total) bas = milieu;
          else haut = milieu;
        }
        const verse = {};
        let reste = total;
        groupe.forEach((j, k) => {
          const part = Math.min(reste, cible(bas, k) - fortune(j));
          if (part > 0) {
            verse[j.id] = part;
            reste -= part;
          }
        });
        // Les quelques dollars que l'arrondi laisse de côté vont au HAUT du
        // groupe, jamais au bas : donnés au plus pauvre, ils lui feraient
        // rattraper son voisin, et l'échelle s'effondrerait.
        for (let k = groupe.length - 1; k >= 0 && reste > 0; k--) {
          const j = groupe[k];
          const mien = fortune(j) + (verse[j.id] || 0);
          // Ni au-dessus de son plafond, ni au-dessus de celui qui le
          // précède dans le groupe.
          const auDessus =
            k === groupe.length - 1
              ? plafondDe(k)
              : Math.min(
                  plafondDe(k),
                  fortune(groupe[k + 1]) +
                    (verse[groupe[k + 1].id] || 0) -
                    MARGE_IMPOT
                );
          const part = Math.min(reste, Math.max(0, auDessus - mien));
          if (part > 0) {
            verse[j.id] = (verse[j.id] || 0) + part;
            reste -= part;
          }
        }
        // S'il reste vraiment de quoi ne pas savoir où le mettre, on ne le
        // prélève pas : la cagnotte se réduit d'autant.
        if (reste > 0) {
          let aRendre = reste;
          Object.keys(preleve).forEach((id) => {
            if (aRendre <= 0) return;
            const rendu = Math.min(aRendre, preleve[id]);
            preleve[id] -= rendu;
            aRendre -= rendu;
            if (preleve[id] <= 0) delete preleve[id];
          });
        }
        return { preleve, verse, total: total - reste };
      };

      // Cote d'un pari sur un joueur. Proportionnelle aux jetons engagés par
      // la cible et au pourcentage visé : viser gros sur un gros stack paie
      // gros. Bornée pour que le bookmaker ne se retrouve jamais à devoir
      // dix fois la mise.
      const calculerCote = (jetons, pct, cfg) => {
        const refJ = nombreSur(cfg.refJetons, 2000) || 1;
        const refP = nombreSur(cfg.refPourcentage, 20) || 1;
        const facteur = nombreSur(cfg.facteurCote, 0.8);
        const plancher = nombreSur(cfg.cotePlancher, 1.1);
        const plafond = nombreSur(cfg.cotePlafond, 3);
        const brute =
          1 + (nombreSur(jetons, 0) / refJ) * (nombreSur(pct, 0) / refP) * facteur;
        return Math.round(Math.min(plafond, Math.max(plancher, brute)) * 100) / 100;
      };

      // Protection accordée à une cible visée par des paris. Dégressive : le
      // deuxième pari protège moins que le premier, le troisième encore
      // moins, et au-delà plus rien.
      const protectionCumulee = (nbParis, cfg) => {
        const pertes = cfg.protectionPertes || [];
        const gains = cfg.protectionGains || [];
        let perte = 0;
        let gain = 0;
        for (let i = 0; i < Math.min(nbParis, pertes.length); i++) {
          perte += nombreSur(pertes[i], 0);
        }
        for (let i = 0; i < Math.min(nbParis, gains.length); i++) {
          gain += nombreSur(gains[i], 0);
        }
        return { perte, gain };
      };

      // ---- Horloge des courses ----
      // Tout se déduit de l'heure de départ de la soirée : numéro de la
      // course en cours, phase, secondes restantes. Aucun appareil n'a
      // besoin d'être prévenu, ils lisent la même horloge.
      // À cinq secondes du départ, la piste apparaît et le décompte se pose
      // par-dessus : la salle a le temps de repérer son cheval avant que ça
      // parte. En dessous, c'est le décompte plein écran.
      const DECOMPTE_SUR_PISTE = 5000;

      const PHASES = {
        AUCUNE: "aucune",
        ANNONCE: "annonce",
        TOP: "top",
        COURSE: "course",
        RESULTAT: "resultat"
      };

      const infosCourse = (maintenant, debutSoiree, cfg, manuelle) => {
        const topSec = nombreSur(cfg.courseTopDepartSec, 15) * 1000;
        const dureeSec = nombreSur(cfg.courseDureeSec, 45) * 1000;
        const annonce = nombreSur(cfg.courseAnnonceMin, 10) * 60000;
        const apres = nombreSur(cfg.courseBlocageApresMin, 1) * 60000;
        // Combien de temps le vainqueur reste à l'écran, une fois la ligne
        // franchie. Réglable : c'est le temps que la salle commente.
        const resultat = nombreSur(cfg.courseResultatSec, 20) * 1000;

        // Une course préparée mais pas encore lancée : les paris sont ouverts
        // et rien ne court après. On y reste tant que le bookmaker n'a pas
        // donné le top, ce qui laisse tout le temps de saisir les paris.
        if (manuelle && !manuelle.depart) {
          return {
            active: true,
            manuelle: true,
            enPreparation: true,
            numero: manuelle.numero,
            depart: null,
            avantDepart: null,
            phase: PHASES.ANNONCE,
            avancement: 0,
            parisOuverts: true
          };
        }

        // Une course lancée à la main prime sur l'horaire : c'est elle qu'on
        // regarde, du top départ jusqu'à la fin du temps de résultat.
        if (manuelle && manuelle.depart) {
          const avantDepart = manuelle.depart - maintenant;
          const depuis = -avantDepart;
          if (depuis < dureeSec + resultat) {
            let phase;
            if (avantDepart > topSec) phase = PHASES.ANNONCE;
            else if (avantDepart > 0) phase = PHASES.TOP;
            else if (depuis < dureeSec) phase = PHASES.COURSE;
            else phase = PHASES.RESULTAT;
            return {
              active: true,
              manuelle: true,
              numero: manuelle.numero,
              depart: manuelle.depart,
              avantDepart,
              phase,
              avancement:
                phase === PHASES.COURSE
                  ? Math.min(1, Math.max(0, depuis / dureeSec))
                  : phase === PHASES.RESULTAT
                    ? 1
                    : 0,
              parisOuverts: avantDepart > topSec
            };
          }
        }

        // En simulation, aucune course ne part toute seule : on attend que
        // le bookmaker en lance une.
        if (cfg.modeSimulation) return { active: false, phase: PHASES.AUCUNE };

        if (!debutSoiree) return { active: false, phase: PHASES.AUCUNE };
        const intervalle = nombreSur(cfg.courseIntervalleMin, 30) * 60000;
        if (intervalle <= 0) return { active: false, phase: PHASES.AUCUNE };

        // Combien de temps après « Démarrer la soirée » part la première
        // course. Sans réglage, un intervalle entier — une demi-heure avec les
        // valeurs livrées, pendant laquelle il ne se passe rien et où l'on
        // croit que les courses ne se lancent pas. Une minute au minimum,
        // sinon la première serait déjà partie avant le premier pari.
        const premier = Math.max(
          60000,
          nombreSur(
            cfg.coursePremiereMin,
            Math.min(intervalle, 5 * 60000) / 60000
          ) * 60000
        );
        const departDe = (n) => debutSoiree + premier + (n - 1) * intervalle;

        const ecoule = maintenant - debutSoiree;
        const numeroSuivant =
          ecoule < premier ? 1 : Math.floor((ecoule - premier) / intervalle) + 2;

        // Tant que la course précédente n'est pas finie — course puis temps
        // de résultat — c'est elle qui compte. Sans ça, l'horloge annoncerait
        // la course suivante alors que les chevaux sont encore en piste.
        const numeroPrecedent = numeroSuivant - 1;
        const departPrecedent = departDe(numeroPrecedent);
        const depuisPrecedent = maintenant - departPrecedent;
        if (numeroPrecedent >= 1 && depuisPrecedent < dureeSec + resultat) {
          const enCourse = depuisPrecedent < dureeSec;
          return {
            active: true,
            numero: numeroPrecedent,
            depart: departPrecedent,
            avantDepart: -depuisPrecedent,
            phase: enCourse ? PHASES.COURSE : PHASES.RESULTAT,
            avancement: enCourse
              ? Math.min(1, Math.max(0, depuisPrecedent / dureeSec))
              : 1,
            parisOuverts: false
          };
        }

        const depart = departDe(numeroSuivant);
        const avantDepart = depart - maintenant;
        let phase = PHASES.AUCUNE;
        if (avantDepart <= topSec) phase = PHASES.TOP;
        else if (avantDepart <= annonce) phase = PHASES.ANNONCE;

        return {
          active: true,
          numero: numeroSuivant,
          depart,
          avantDepart,
          phase,
          avancement: 0,
          // Les paris ferment au top départ.
          parisOuverts: avantDepart > topSec
        };
      };

      // Le vainqueur est tiré à partir du numéro de course : identique
      // partout, sans échange réseau.
      //
      // On modélise la VITESSE de chaque cheval, pas sa position. La position
      // est ensuite la distance parcourue, c'est-à-dire l'intégrale de cette
      // vitesse : elle ne peut donc que croître. Un cheval ne recule jamais,
      // et comme la vitesse reste bornée autour de sa moyenne, il ne part pas
      // non plus en sprint ni ne s'arrête pour attendre les autres.
      const PAS_COURSE = 240;

      // Avantage à la corde : sur un demi-tour, le cheval qui tient le virage
      // serré grignote sur celui qui court à l'extérieur — puis lui rend tout
      // dans le virage suivant, puisqu'ils échangent de couloir au milieu de
      // la ligne droite. L'écart est nul à chaque passage devant les tribunes,
      // et on l'éteint dans la dernière ligne droite : ce sont les derniers
      // mètres qui donnent l'ordre d'arrivée tiré au sort, pas un avantage de
      // couloir.
      // Deux secondes de surlignage : assez pour que l'œil accroche la
      // ligne qui vient de doubler, pas assez pour brouiller la suivante.
      const DUREE_SURLIGNE_COURSE = 2000;
      // Hauteur d'une ligne de classement, d'un bord à l'autre. C'est elle qui
      // sert à faire glisser les lignes plutôt qu'à les réordonner d'un coup.
      const PAS_CLASSEMENT = 66;
      const PAS_CLASSEMENT_COURSE = 44;

      /*
       * L'IDENTITÉ DE CET APPAREIL, ET LE VERROU DU POSTE
       *
       * Le poste du bookmaker n'est pas un écran comme les autres : c'est lui
       * qui solde les courses et paie les gains. Ouvert sur deux appareils, il
       * payait deux fois — chacun voyait les mêmes paris « ouverts » et
       * créditait de son côté.
       *
       * On le réserve donc, comme on réserve une caisse. L'appareil qui tient
       * le poste signe un jeton partagé et le rafraîchit régulièrement ; un
       * second appareil voit le jeton et refuse d'ouvrir. Si le premier
       * disparaît — onglet fermé, téléphone à plat —, le jeton se périme tout
       * seul et le poste redevient libre.
       *
       * L'identité tient à la page : recharger, c'est devenir un autre
       * appareil, ce qui n'a aucune importance puisque le jeton se reprend.
       */
      const ID_APPAREIL =
        Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      // Toutes les combien on signe, et au bout de combien un jeton non
      // rafraîchi est considéré abandonné. Large, pour qu'un réseau qui
      // hoquette ne libère pas le poste sous les pieds du bookmaker.
      const BATTEMENT_POSTE_MS = 8000;
      const PEREMPTION_POSTE_MS = 30000;
      // Le temps que met une ligne du classement à glisser d'un rang. Il sert
      // deux fois : à l'animation, et à la cadence de rafraîchissement de
      // l'ordre — les deux doivent rester d'accord, sans quoi une ligne
      // repart avant d'être arrivée.
      const GLISSE_CLASSEMENT_MS = 450;

      const AVANTAGE_CORDE = 0.014;
      const FIN_SANS_CORDE = 0.14;

      // Avancement d'un cheval à l'instant t (0 à 1) de la course, entre 0 et
      // sa position d'arrivée. Toujours croissant.
      /*
       * LE MODE BLAGUE
       *
       * Un cheval tiré au sort s'arrête boire au bord de la piste, se fait
       * doubler, puis repart ventre à terre et rattrape tout son retard.
       *
       * C'est un gag, pas un handicap. La pause est intégralement rendue
       * avant la ligne, et surtout l'ordre d'arrivée ne passe pas par ici :
       * ordreArrivee lit `profil.arrivee`, que la gorgée ne touche pas. Les
       * gains, le tuyau du délit d'initié et les herbes ne peuvent donc pas
       * en être affectés — seul le dessin change.
       *
       * Le cheval et l'instant sont tirés du numéro de la course : tous les
       * écrans de la soirée voient la même bête boire au même moment, sans
       * rien s'échanger.
       */
      // Part de la course passée le nez dans l'abreuvoir, puis part passée à
      // rattraper. À durées égales, le rattrapage se fait à double vitesse.
      const BOISSON_DUREE = 0.16;
      const BOISSON_RATTRAPAGE = 0.16;

      const blagueDeCourse = (numero, n, actif) => {
        if (!actif || !numero || n < 2) return null;
        const alea = semer(numero * 104729 + 71);
        const cheval = Math.floor(alea() * n);
        // Ni au départ ni dans les derniers mètres : la salle doit avoir le
        // temps de le voir s'arrêter, et lui celui de revenir.
        const debut = 0.20 + alea() * 0.32;
        const fin = debut + BOISSON_DUREE;
        return { cheval, debut, fin, retour: fin + BOISSON_RATTRAPAGE };
      };

      // Le temps que voit le cheval qui boit. Il se fige le temps de la
      // gorgée, puis file deux fois plus vite jusqu'à rattraper la pendule.
      //
      // C'est le TEMPS qu'on déforme, jamais la position : le cheval ne peut
      // donc pas reculer d'un pouce — reculer, ce serait un bug, pas un gag —
      // et passé le rattrapage il est exactement là où il aurait été sans
      // s'arrêter. Rien à corriger ensuite, rien à atténuer près du poteau.
      const tempsBoisson = (boisson, t) => {
        if (!boisson || t <= boisson.debut || t >= boisson.retour) return t;
        if (t < boisson.fin) return boisson.debut;
        return (
          boisson.debut +
          ((t - boisson.fin) * (boisson.retour - boisson.debut)) /
            (boisson.retour - boisson.fin)
        );
      };

      const avancementCheval = (profil, t, boisson) => {
        const u = Math.max(0, Math.min(1, tempsBoisson(boisson, t)));
        const x = u * PAS_COURSE;
        const k = Math.min(PAS_COURSE - 1, Math.floor(x));
        const f = x - k;
        const c = profil.cumul;
        const parcouru = c[k] + (c[k + 1] - c[k]) * f;
        // La distance est la même pour tous ; c'est l'instant où chacun la
        // boucle qui change. Au-delà, la valeur dépasse 1 : elle sert encore
        // au classement, mais le dessin s'arrête au poteau.
        const finit = profil.finit || 1;
        const base = parcouru / profil.total / finit;
        // Le sinus vaut zéro au poteau et repasse par zéro à chaque tour : le
        // gain pris dans un virage est rendu dans le suivant. On l'éteint sur
        // les derniers mètres de CE cheval, pas de la fenêtre : sinon un
        // avantage de couloir pourrait renverser l'ordre d'arrivée.
        const attenuation = Math.min(
          1,
          Math.max(0, finit - u) / (FIN_SANS_CORDE * finit)
        );
        return Math.max(
          0,
          base +
            AVANTAGE_CORDE *
              (profil.corde || 0) *
              attenuation *
              Math.sin(2 * Math.PI * (profil.tours || 3) * base)
        );
      };

      // Une course doit se regarder. Deux promesses : aucun cheval ne reste au
      // fond du peloton d'un bout à l'autre — chacun est premier ou deuxième
      // au moins une fois — et personne ne mène de la première à la dernière
      // seconde. On note donc chaque tirage sur ces deux points.
      const PALIERS_CONTROLE = 60;
      const noteCourse = (profils) => {
        const n = profils.length;
        const meilleurRang = new Array(n).fill(n + 1);
        const meneurs = new Set();
        // On saute le départ : tout le monde y est à égalité.
        for (let k = 3; k <= PALIERS_CONTROLE; k++) {
          const ordre = profils
            .map((pr, i) => [avancementCheval(pr, k / PALIERS_CONTROLE), i])
            .sort((a, b) => b[0] - a[0]);
          ordre.forEach((e, rang) => {
            if (rang + 1 < meilleurRang[e[1]]) meilleurRang[e[1]] = rang + 1;
          });
          meneurs.add(ordre[0][1]);
        }
        const devant = meilleurRang.filter((r) => r <= 2).length;
        return {
          bonne: devant === n && (n < 2 || meneurs.size >= 2),
          note: devant + (meneurs.size >= 2 ? 1 : 0)
        };
      };

      // Le tirage coûte quelques millisecondes — il retente jusqu'à tomber sur
      // une belle course. On le garde donc sous le coude : sinon on le
      // referait à chaque battement d'horloge pendant toute la course.
      const trameEnMemoire = new Map();

      // `herbes` : { index, pct } quand une fiole a été versée sur un cheval
      // de cette course. Elle lui donne des chances en plus de gagner, et la
      // certitude de ne pas finir dernier.
      const tirerTrame = (numero, n, tours, herbes) => {
        const alea = semer(numero * 7919 + 13);
        let gagnant = Math.floor(alea() * n);
        // Le dé des herbes est toujours lancé, fiole ou pas : la suite du
        // tirage reste identique, et un appareil qui n'aurait pas encore reçu
        // la fiole ne verrait pas une tout autre course.
        const deHerbes = alea();
        const iHerbes =
          herbes && Number.isFinite(Number(herbes.index)) ? Number(herbes.index) : -1;
        const aLesHerbes = iHerbes >= 0 && iHerbes < n;
        if (aLesHerbes) {
          const part =
            Math.max(0, Math.min(100, nombreSur((herbes || {}).pct, 20))) / 100;
          // Le réglage dit « tant de chances EN PLUS ». Or le cheval gagnait
          // déjà une course sur n tout seul : forcer la victoire une fois sur
          // cinq ne lui rapporterait que quinze points, pas vingt. On force
          // donc un peu plus souvent, pour que le compte y soit.
          const naturel = 1 / n;
          const force = naturel >= 1 ? 1 : Math.min(1, part / (1 - naturel));
          if (deHerbes < force) gagnant = iHerbes;
        }

        const tirerProfils = () => {
          const bruts = Array.from({ length: n }, (rien, i) => {
            // La dérive donne son tempérament au cheval : négative, il part
            // vite et s'essouffle ; positive, il finit fort. C'est ce qui
            // produit les remontées, sans à-coup.
            const derive = (alea() - 0.5) * 0.5;
            const a1 = 0.04 + alea() * 0.06;
            const a2 = 0.02 + alea() * 0.04;
            const f1 = 0.7 + alea() * 0.8;
            const f2 = 1.5 + alea() * 1.0;
            const p1 = alea() * Math.PI * 2;
            const p2 = alea() * Math.PI * 2;
            // Écart à l'arrivée : quelques longueurs, pas la moitié de la piste.
            const ecart = i === gagnant ? 0 : 0.012 + alea() * 0.05;

            const vitesse = (t) =>
              1 +
              derive * (t - 0.5) +
              a1 * Math.sin(f1 * Math.PI * 2 * t + p1) +
              a2 * Math.sin(f2 * Math.PI * 2 * t + p2);

            // Intégration au trapèze, une fois pour toute la course.
            const cumul = [0];
            for (let k = 1; k <= PAS_COURSE; k++) {
              const t0 = (k - 1) / PAS_COURSE;
              const t1 = k / PAS_COURSE;
              const moyenne =
                (Math.max(0.1, vitesse(t0)) + Math.max(0.1, vitesse(t1))) / 2;
              cumul.push(cumul[k - 1] + moyenne / PAS_COURSE);
            }

            return {
              cumul,
              total: cumul[PAS_COURSE] || 1,
              ecart,
              arrivee: 1 - ecart,
              // -1 pour celui qui prend le virage de droite au plus large,
              // +1 pour celui qui le prend à la corde.
              corde: n > 1 ? (2 * i) / (n - 1) - 1 : 0,
              tours
            };
          });
          // Tous les chevaux couvrent la même distance et coupent tous la
          // ligne : ce qui les départage, c'est le moment où ils la coupent.
          // Le vainqueur arrive avant la fin de l'animation, le dernier pile à
          // la fin — la course s'arrête donc quand le dernier est rentré.
          // Le cheval aux herbes ne finit jamais dernier : s'il l'était, on
          // échange son écart avec celui qui le précédait — les deux se
          // doublent, personne d'autre ne bouge.
          if (aLesHerbes && n > 1) {
            const parEcart = bruts
              .map((pr, i) => ({ i, ecart: pr.ecart }))
              .sort((a, b) => a.ecart - b.ecart);
            const dernier = parEcart[parEcart.length - 1];
            if (dernier.i === iHerbes) {
              const avant = parEcart[parEcart.length - 2];
              const garde = bruts[iHerbes].ecart;
              bruts[iHerbes].ecart = bruts[avant.i].ecart;
              bruts[avant.i].ecart = garde;
              bruts[iHerbes].arrivee = 1 - bruts[iHerbes].ecart;
              bruts[avant.i].arrivee = 1 - bruts[avant.i].ecart;
            }
          }
          const retardMax = Math.max(0, ...bruts.map((pr) => pr.ecart));
          return bruts.map((pr) => ({
            ...pr,
            finit: Math.max(0.2, 1 - retardMax + pr.ecart)
          }));
        };

        // On retire jusqu'à tomber sur une course qui tient ses promesses. Le
        // générateur est semé, donc tous les appareils s'arrêtent sur le même
        // tirage sans rien échanger. À défaut, on garde le meilleur essai.
        let meilleursProfils = null;
        let meilleureNote = -1;
        for (let essai = 0; essai < 80; essai++) {
          const profils = tirerProfils();
          const bilan = noteCourse(profils);
          if (bilan.bonne) return { gagnant, profils };
          if (bilan.note > meilleureNote) {
            meilleureNote = bilan.note;
            meilleursProfils = profils;
          }
        }
        return { gagnant, profils: meilleursProfils };
      };

      // L'ordre d'arrivée complet, du vainqueur au dernier. C'est l'écart à
      // l'arrivée tiré au sort qui le décide, pas le déroulé de la course.
      const ordreArrivee = (numero, chevaux, cfg, herbes) => {
        const { profils } = trameCourse(numero, chevaux, cfg, herbes);
        return profils
          .map((pr, i) => ({ i, arrivee: pr.arrivee }))
          .sort((a, b) => b.arrivee - a.arrivee)
          .map((e) => chevaux[e.i])
          .filter(Boolean);
      };

      // Ce que rapporte une mise selon la place du cheval : trois fois la mise
      // au vainqueur, une fois et demie au deuxième, la moitié au troisième,
      // rien ensuite. Une partie enregistrée avant ce barème n'a que son
      // ancienne cote : on la garde pour le vainqueur et on complète.
      const RAPPORTS_DEFAUT = [3, 1.5, 0.5, 0];
      const rapportsCourse = (cfg) => {
        const bruts = cfg && cfg.courseRapports;
        const liste = Array.isArray(bruts)
          ? bruts
          : typeof bruts === "string"
            ? bruts.split(",")
            : null;
        if (liste && liste.length) return liste.map((x) => nombreSur(x, 0));
        const complet = RAPPORTS_DEFAUT.slice();
        complet[0] = nombreSur((cfg || {}).courseCote, RAPPORTS_DEFAUT[0]);
        return complet;
      };

      const rapportPourRang = (cfg, rang) => {
        const r = rapportsCourse(cfg);
        return rang >= 0 && rang < r.length ? r[rang] : 0;
      };

      // La couleur d'un rapport dit une seule chose : est-ce que le joueur
      // récupère au moins sa mise ? ×3 et ×1.5 rapportent, ×1 rend la mise,
      // mais ×0.5 n'en rend que la moitié — c'est une perte, donc du rouge,
      // au même titre que ×0.
      const COULEUR_GAIN = "#4CAF50";
      const COULEUR_PERTE = "#EF5350";
      const gagnantPour = (rapport) => nombreSur(rapport, 0) >= 1;
      const couleurRapport = (rapport) =>
        gagnantPour(rapport) ? COULEUR_GAIN : COULEUR_PERTE;

      // ---- Les places d'un projet d'investissement ----
      // Un projet n'est plus une cagnotte où chacun verse ce qu'il veut :
      // c'est une liste de places numérotées. La place du premier
      // investisseur coûte tant et rapporte tant, celle du deuxième moins
      // cher et moins rapporté, et ainsi de suite. Le joueur ne choisit pas
      // son montant, il choisit sa place.
      const MISE_PLACE_DEFAUT = 200;
      const placesProjet = (projet) => {
        if (!projet) return [];
        const gains = Array.isArray(projet.gains) ? projet.gains : [];
        const mises = Array.isArray(projet.mises) ? projet.mises : [];
        const nb = Math.max(
          1,
          Math.round(nombreSur(projet.investisseursMax, gains.length || 5))
        );
        // Une partie enregistrée avant les mises fixes n'en a aucune : on
        // répartit le montant à réunir à parts égales entre les places, le
        // projet reste finançable et rien ne casse.
        const secours = mises.length
          ? nombreSur(mises[mises.length - 1], MISE_PLACE_DEFAUT)
          : Math.round(nombreSur(projet.montantRequis, 0) / nb) ||
            MISE_PLACE_DEFAUT;
        const places = [];
        for (let i = 0; i < nb; i++)
          places.push({
            rang: i,
            mise: Math.max(0, Math.round(nombreSur(mises[i], secours))),
            gain: nombreSur(gains[i], nombreSur(gains[gains.length - 1], 0))
          });
        return places;
      };

      const placeDe = (projet, rang) =>
        placesProjet(projet)[rang] || { rang, mise: 0, gain: 0 };

      // Le rang d'une entrée. Les investissements enregistrés avant les
      // places fixes n'en portent pas : c'est alors l'ordre d'arrivée, comme
      // avant.
      const rangEntree = (entree, i) =>
        Number.isFinite(Number(entree && entree.rang)) ? Number(entree.rang) : i;

      const rangsPris = (inst) => {
        const pris = {};
        ((inst && inst.investisseurs) || []).forEach((x, i) => {
          pris[rangEntree(x, i)] = x;
        });
        return pris;
      };

      const libelleRang = (rang) => `${rang + 1}${rang === 0 ? "er" : "e"}`;

      const trameCourse = (numero, chevaux, cfg, herbes) => {
        const n = chevaux.length || 1;
        const tours = Math.max(1, nombreSur(cfg.courseTours, 3));
        // La fiole fait partie de la clé : verser les herbes doit changer la
        // course, pas ressortir celle déjà en mémoire.
        const cle =
          numero +
          "|" +
          n +
          "|" +
          tours +
          "|" +
          (herbes && Number.isFinite(Number(herbes.index))
            ? `${herbes.index}@${nombreSur(herbes.pct, 20)}`
            : "-");
        let trame = trameEnMemoire.get(cle);
        if (!trame) {
          trame = tirerTrame(numero, n, tours, herbes);
          // Une soirée n'aligne pas cent courses : on repart de zéro plutôt
          // que de laisser la mémoire enfler.
          if (trameEnMemoire.size > 40) trameEnMemoire.clear();
          trameEnMemoire.set(cle, trame);
        }
        // Les noms et les couleurs peuvent changer dans les réglages d'un
        // instant à l'autre : on rattache toujours les chevaux du moment.
        return {
          gagnant: trame.gagnant,
          profils: trame.profils.map((pr, i) => ({ ...pr, cheval: chevaux[i] }))
        };
      };

      // ---- Horloge des blocs d'investissement ----
      const blocActuel = (maintenant, debutSoiree, cfg) => {
        if (!debutSoiree) return 0;
        const duree = nombreSur(cfg.blocDureeMin, 45) * 60000;
        if (duree <= 0) return 0;
        return Math.floor((maintenant - debutSoiree) / duree) + 1;
      };

      // ================= L'HIPPODROME =================
      // Toutes les lignes doivent faire la meme distance. Un couloir tient
      // donc son rayon pour un virage, puis celui de son partenaire pour
      // l'autre : le plus large devient le plus serre, et reciproquement.
      // Comme les rayons sont regulierement espaces, chaque paire echangee a
      // la meme somme de rayons -- les deux virages pesent donc exactement
      // pareil pour tout le monde. Seules les rampes de croisement coutent
      // quelques pixels de plus a celles qui changent le plus de place (2 %
      // du tour), ce qui ne se voit pas et ne change rien a la course : les
      // chevaux sont cales sur la ligne moyenne, pas sur leur propre couloir.
      //
      // Les echanges se font sur les lignes droites, et surtout PAS tous au
      // meme endroit : sinon les quatre couloirs se rejoindraient en un seul
      // point et l'on ne saurait plus lequel va ou. Chaque paire a donc sa
      // propre fenetre de croisement, l'une apres l'autre le long de la
      // droite. Deux couloirs ne se croisent ainsi jamais au meme endroit, on
      // suit chaque ligne du regard, et partout ailleurs elles restent bien
      // ecartees.
      // Les couleurs de l'hippodrome : du sable, pas du gazon. Le sable est
      // clair, alors les couleurs des chevaux sont franches et sombres --
      // c'est ce qui les detache le mieux du fond.
      // Le domaine, vu du ciel : du gazon partout, un anneau de sable damé
      // cerné de lisses blanches, un rond central avec sa pièce d'eau et ses
      // bosquets, et une haie d'arbres tout autour de la propriété.
      const DOMAINE = {
        gazon: "#7CB342", // l'herbe autour de la piste
        gazonCentre: "#6BA436", // le rond central, un ton plus soutenu
        tonte: "#8BC34A", // la trace de tonte, plus claire
        sable: "#E3C89C", // la piste
        sableOmbre: "#CBA877", // le bord de piste, tassé
        lisse: "#FFFFFF", // les barrières
        bordure: "#7A5A33", // le bord sombre qui détache chaque couloir
        eau: "#4FC3F7",
        eauBord: "#039BE5",
        arbreFond: "#3E7522", // le fond, pour qu'aucun trou ne perce
        arbreSombre: "#3B6E22",
        arbre: "#4E8C2B",
        arbreClair: "#7CB342",
        ombre: "rgba(27, 68, 20, 0.3)",
        tribuneMur: "#ECEFF1",
        tribuneToit: "#E65100"
      };

      const PISTE = {
        demiDroite: 186, // demi-longueur d'une ligne droite
        rayonMin: 106, // rayon du couloir le plus serré
        etendue: 78, // écart total entre le plus serré et le plus large
        ecartMax: 26, // écart maximum entre deux couloirs voisins
        zoneCroisement: 0.82, // part de la droite ouverte aux croisements
        partUtile: 0.88 // part de son creneau qu'une paire utilise vraiment
      };

      // Combien de points par morceau de piste. Tous les couloirs sont
      // echantillonnes de la meme facon : le point numero k d'un couloir
      // repond au point numero k de tous les autres.
      const decoupePiste = (rayonMoyen) => {
        const points = (longueur) => Math.max(2, Math.round(longueur / 5));
        return {
          quart: points((Math.PI / 2) * rayonMoyen),
          droite: points(2 * PISTE.demiDroite)
        };
      };

      // La fenetre de croisement de la paire numero k (0 = la paire la plus
      // exterieure), en abscisses et dans le sens de la marche.
      const fenetreCroisement = (k, paires) => {
        const bande = PISTE.demiDroite * PISTE.zoneCroisement;
        const creneau = (2 * bande) / Math.max(1, paires);
        const centre = bande - (k + 0.5) * creneau;
        const demi = (creneau * PISTE.partUtile) / 2;
        return { depart: centre + demi, large: 2 * demi || 1 };
      };

      // rDroite : le rayon tenu dans le virage de droite (celui du poteau
      // d'arrivee) ; rGauche : celui tenu dans le virage de gauche. On tourne
      // dans le sens inverse des aiguilles d'une montre, comme sur un vrai
      // hippodrome.
      const traceCouloir = (rDroite, rGauche, fenetre, d) => {
        const Sx = PISTE.demiDroite;
        const pts = [{ x: Sx + rDroite, y: 0 }];
        const arc = (cx, r, a0, a1, n) => {
          for (let k = 1; k <= n; k++) {
            const a = a0 + ((a1 - a0) * k) / n;
            pts.push({ x: cx + r * Math.cos(a), y: r * Math.sin(a) });
          }
        };
        // Le glissement d'un rayon a l'autre, adouci aux deux bouts, pour que
        // le couloir quitte et rejoigne sa ligne droite sans casser.
        const glisser = (avance) => {
          const u = Math.max(0, Math.min(1, avance));
          return u * u * (3 - 2 * u);
        };
        // sens = 1 pour la droite du haut (on va de +Sx vers -Sx), -1 pour
        // celle du bas. Les deux fenetres sont symetriques par rotation.
        const droite = (rDepart, rArrivee, sens, n) => {
          for (let k = 1; k <= n; k++) {
            const x = sens * (Sx - (2 * Sx * k) / n);
            const e = glisser((fenetre.depart - sens * x) / fenetre.large);
            pts.push({ x, y: -sens * (rDepart + (rArrivee - rDepart) * e) });
          }
        };
        arc(Sx, rDroite, 0, -Math.PI / 2, d.quart); // quart haut du virage droit
        droite(rDroite, rGauche, 1, d.droite); // ligne droite du haut
        arc(-Sx, rGauche, -Math.PI / 2, -Math.PI, d.quart); // quart haut gauche
        arc(-Sx, rGauche, Math.PI, Math.PI / 2, d.quart); // quart bas gauche
        droite(rGauche, rDroite, -1, d.droite); // ligne droite du bas
        arc(Sx, rDroite, Math.PI / 2, 0, d.quart); // retour au poteau
        const cumul = [0];
        for (let k = 1; k < pts.length; k++)
          cumul.push(
            cumul[k - 1] +
              Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y)
          );
        return {
          pts,
          cumul,
          L: cumul[cumul.length - 1] || 1,
          d:
            "M " +
            pts.map((p) => p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" L ")
        };
      };

      // Les couloirs sont numerotes du plus large (0) au plus serre ; le
      // couloir i echange sa place avec le couloir (n - 1 - i).
      const geometriePiste = (nb) => {
        const n = Math.max(1, nb);
        const ecart =
          n > 1 ? Math.min(PISTE.ecartMax, PISTE.etendue / (n - 1)) : 0;
        const rayon = (i) => PISTE.rayonMin + (n - 1 - i) * ecart;
        const rInterieur = rayon(n - 1);
        const rExterieur = rayon(0);
        const rMoyen = (rInterieur + rExterieur) / 2;
        const paires = Math.max(1, Math.floor(n / 2));
        const decoupe = decoupePiste(rMoyen);
        const couloirs = [];
        for (let i = 0; i < n; i++)
          couloirs.push(
            traceCouloir(
              rayon(i),
              rayon(n - 1 - i),
              fenetreCroisement(Math.min(i, n - 1 - i), paires),
              decoupe
            )
          );
        return {
          couloirs,
          // La ligne moyenne sert d'horloge : c'est elle qui avance a vitesse
          // constante, et chaque couloir se lit a la meme phase qu'elle.
          reference: traceCouloir(
            rMoyen,
            rMoyen,
            fenetreCroisement(0, paires),
            decoupe
          ),
          ecart,
          largeur: Math.max(5, Math.min(10, ecart * 0.42 || 10)),
          rayonInterieur: rInterieur,
          rayonExterieur: rExterieur
        };
      };

      // On convertit l'avancement (0 a 1) en une phase commune a tous les
      // couloirs. Deux chevaux a egalite restent ainsi epaule contre epaule :
      // celui de l'exterieur couvre simplement plus de terrain dans le virage,
      // exactement comme sur une vraie piste. Et la phase progresse a vitesse
      // constante sur la ligne moyenne, sans acceleration dans les virages.
      const phasePiste = (piste, avancement) => {
        const ref = piste.reference;
        const cible = (((avancement % 1) + 1) % 1) * ref.L;
        const c = ref.cumul;
        let lo = 0;
        let hi = c.length - 1;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (c[mid] < cible) lo = mid;
          else hi = mid;
        }
        const f = c[hi] === c[lo] ? 0 : (cible - c[lo]) / (c[hi] - c[lo]);
        return lo + f;
      };

      // Un contour fermé et lisse qui passe par tous les points donnés
      // (Catmull-Rom converti en Béziers). C'est ce qui donne au plan d'eau
      // une berge naturelle plutôt qu'une ellipse.
      const contourFerme = (pts, decimales) => {
        const n = pts.length;
        const d10 = decimales === undefined ? 1 : decimales;
        const v = (p) => p[0].toFixed(d10) + " " + p[1].toFixed(d10);
        let d = "M " + v(pts[0]);
        for (let i = 0; i < n; i++) {
          const p0 = pts[(i - 1 + n) % n];
          const p1 = pts[i];
          const p2 = pts[(i + 1) % n];
          const p3 = pts[(i + 2) % n];
          const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
          const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
          d += " C " + v(c1) + ", " + v(c2) + ", " + v(p2);
        }
        return d + " Z";
      };

      // Un buisson taillé, vu du ciel : une masse de petites feuilles posées
      // en couronnes, du bord vers le cœur. Celles du bord dépassent, ce qui
      // donne la silhouette hérissée ; celles qui font face au soleil — en
      // haut à gauche — sont plus claires.
      //
      // Le buisson est dessiné une seule fois, pour un rayon de 1, et déposé
      // dans les <defs> : chaque massif du domaine n'est ensuite qu'une copie
      // translatée et tournée. Sinon ce seraient plusieurs milliers
      // d'ellipses dans la page.
      const dessinerBuisson = () => {
        // Un tirage semé : le buisson est toujours le même, mais ses feuilles
        // ne sont pas alignées au cordeau.
        const alea = semer(20240817);
        const couronnes = [
          [1, 26], [0.87, 23], [0.74, 20], [0.61, 17],
          [0.48, 14], [0.35, 11], [0.22, 8], [0.08, 4]
        ];
        const feuilles = [];
        couronnes.forEach(([rayon, nb], k) => {
          for (let i = 0; i < nb; i++) {
            const angle = ((i + alea() * 0.8) / nb) * 360 + k * 13;
            const rad = (angle * Math.PI) / 180;
            const r = Math.max(0, rayon + (alea() - 0.5) * 0.09);
            // Face au soleil — en haut à gauche — le feuillage est plus
            // clair. Une feuille sur trois tranche quand même, sinon la
            // masse est trop lisse pour ressembler à des feuilles.
            const lumiere = -(Math.cos(rad) + Math.sin(rad)) / 2;
            const tirage = alea();
            let teinte = lumiere > 0.3 ? 2 : lumiere > -0.25 ? 1 : 0;
            if (tirage < 0.22) teinte = Math.max(0, teinte - 1);
            else if (tirage > 0.86) teinte = Math.min(2, teinte + 1);
            feuilles.push({
              cle: k + "-" + i,
              rayon: r,
              angle,
              // La feuille n'est pas plantée droit dans l'axe : c'est ce
              // désordre qui fait une touffe et non un oursin.
              biais: (alea() - 0.5) * 110,
              teinte
            });
          }
        });
        return feuilles;
      };
      const FEUILLES = dessinerBuisson();
      // Toutes les touffes du domaine ont la même taille : c'est ce qui fait
      // un pourtour régulier plutôt qu'un semis d'arbres dépareillés.
      const RAYON_BUISSON = 19;

      // Sème des points régulièrement espacés le long d'un tracé : c'est ce
      // qui plante la haie d'arbres autour de la propriété.
      const semerLeLong = (trace, pas) => {
        const nb = Math.max(4, Math.round(trace.L / pas));
        const points = [];
        let k = 1;
        for (let i = 0; i < nb; i++) {
          const cible = (i / nb) * trace.L;
          while (k < trace.cumul.length - 1 && trace.cumul[k] < cible) k++;
          points.push(trace.pts[k]);
        }
        return points;
      };

      // Le décor : la haie qui ceinture le domaine, la pièce d'eau et les
      // bosquets du rond central. Tout est calé sur les dimensions de la
      // piste, donc cela suit si l'on change le nombre de chevaux.
      const decorPiste = (piste) => {
        const rHaie = piste.rayonExterieur + 62;
        const haie = traceCouloir(
          rHaie,
          rHaie,
          { depart: 0, large: 1 },
          decoupePiste(rHaie)
        );
        const h = Math.max(20, piste.rayonInterieur - 26);
        const l = PISTE.demiDroite + h;
        // Distance d'un point à l'axe de la piste : sert à vérifier que rien
        // du rond central ne vient mordre sur le sable.
        const rayonLocal = (x, y) =>
          Math.abs(x) <= PISTE.demiDroite
            ? Math.abs(y)
            : Math.hypot(Math.abs(x) - PISTE.demiDroite, y);
        // Les bosquets se tiennent aux deux bouts du rond central et autour de
        // la pièce d'eau : le milieu reste dégagé, sinon le regard ne suit
        // plus les chevaux.
        // On plante par bouquets serrés plutôt qu'arbre par arbre : isolés,
        // ils faisaient des taches sur la pelouse. Les emplacements sont
        // choisis assez à l'intérieur pour qu'aucun arbre ne morde sur le
        // sable — et un rognage au bord du rond central le garantit.
        const bosquets = [
          [-0.855, -0.2, "a"], [-0.79, 0.34, "b"], [-0.7, -0.5, "c"],
          [-0.735, 0.56, "d"], [-0.2, -0.56, "e"], [-0.06, 0.58, "f"],
          [0.235, -0.58, "g"], [0.5, 0.56, "h"], [0.79, -0.34, "i"],
          [0.84, 0.26, "j"], [0.715, 0.55, "k"], [0.735, -0.56, "l"]
        ];
        // La tonte : des bandes alternées, comme sur une pelouse entretenue.
        const largeurBande = 52;
        const bandes = [];
        for (let x = -l; x < l; x += largeurBande)
          bandes.push({ cle: String(Math.round(x)), x, w: largeurBande });
        return {
          // Le pourtour complet du domaine, massif contre massif.
          arbresHaie: semerLeLong(haie, RAYON_BUISSON * 1.7).map((a, i) => ({
            x: a.x,
            y: a.y,
            tour: (i * 47) % 360
          })),
          rayonHaie: rHaie,
          // Le plan d'eau : une berge irrégulière mais lisse, pas une ellipse.
          bassin: (() => {
            const cx = -l * 0.5;
            const cy = h * 0.06;
            const rx = l * 0.19;
            const ry = h * 0.31;
            // Des rayons franchement inégaux : une berge régulière, ça fait
            // bassin de jardin, pas plan d'eau.
            const galbe = [1.12, 1.05, 0.92, 0.84, 0.9, 1.02, 1.1, 1.04, 0.9, 1.0];
            const surLaBerge = (k, i, echelle, dx, dy) => {
              const a = (i / galbe.length) * Math.PI * 2;
              return [
                cx + dx + rx * k * echelle * Math.cos(a),
                cy + dy + ry * k * echelle * Math.sin(a)
              ];
            };
            const pts = galbe.map((k, i) => surLaBerge(k, i, 1, 0, 0));
            // Le haut-fond : une frange claire près de la berge, pas une
            // cuvette qui mangerait toute l'eau profonde.
            const hautFond = galbe.map((k, i) =>
              surLaBerge(k, i, 0.6, -rx * 0.16, -ry * 0.1)
            );
            return { berge: contourFerme(pts), hautFond: contourFerme(hautFond) };
          })(),
          bandes,
          bosquets: bosquets
            .map(([fx, fy, cle], i) => ({
              cle,
              x: l * fx,
              y: h * fy,
              tour: (i * 61) % 360
            }))
            // Ceinture et bretelles : si un massif venait malgré tout à mordre
            // sur la piste, on ne le plante pas du tout.
            .filter((a) => rayonLocal(a.x, a.y) + RAYON_BUISSON <= h - 2),
          demiHauteurCentre: h,
          demiLargeurCentre: l
        };
      };

      const pointCouloir = (couloir, phase) => {
        const i = Math.max(0, Math.min(couloir.pts.length - 2, Math.floor(phase)));
        const f = phase - i;
        const a = couloir.pts[i];
        const b = couloir.pts[i + 1];
        return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
      };

      // Le patron du buisson, à déposer une fois dans les <defs>.
      const PatronBuisson = ({ id }) => (
        <g id={id}>
          <circle r="0.9" fill={DOMAINE.arbreFond} />
          {FEUILLES.map((f) => (
            <ellipse
              key={f.cle}
              rx="0.185"
              ry="0.125"
              fill={
                f.teinte === 2
                  ? DOMAINE.arbreClair
                  : f.teinte === 1
                    ? DOMAINE.arbre
                    : DOMAINE.arbreSombre
              }
              transform={
                `rotate(${f.angle.toFixed(1)}) translate(${f.rayon.toFixed(3)} 0)` +
                ` rotate(${f.biais.toFixed(1)})`
              }
            />
          ))}
        </g>
      );

      // Un massif : l'ombre qu'il porte sur l'herbe, puis une copie du patron.
      // On le fait tourner d'un massif à l'autre pour qu'ils ne se ressemblent
      // pas tous, sans changer leur taille.
      const Buisson = ({ id, x, y, tour }) => (
        <g transform={`translate(${x} ${y})`}>
          <ellipse
            cx={RAYON_BUISSON * 0.13}
            cy={RAYON_BUISSON * 0.2}
            rx={RAYON_BUISSON * 0.88}
            ry={RAYON_BUISSON * 0.82}
            fill={DOMAINE.ombre}
          />
          <use
            href={`#${id}`}
            transform={`rotate(${tour}) scale(${RAYON_BUISSON})`}
          />
        </g>
      );

      function PisteCourse({ numero, chevaux, cfg, depart, compact, herbes }) {
        const [t, setT] = React.useState(0);
        const [changements, setChangements] = React.useState({});
        const ordrePrecedent = React.useRef(null);
        // L'ordre effectivement affiché, et l'instant où on l'a adopté.
        const ordreAffiche = React.useRef(null);
        const derniereBascule = React.useRef(0);

        const duree = (Number(cfg.courseDureeSec) || 45) * 1000;
        const tours = Number(cfg.courseTours) || 3;
        const cleHerbes =
          herbes && Number.isFinite(Number(herbes.index))
            ? `${herbes.index}@${herbes.pct}`
            : "-";
        const trame = React.useMemo(
          () => trameCourse(numero, chevaux, cfg, herbes),
          // La fiole passe par sa clé : l'objet change d'identité à chaque
          // rendu, son contenu non.
          [numero, chevaux, cfg, cleHerbes]
        );

        // Boucle d'animation propre : l'horloge du jeu bat à la seconde, bien
        // trop lentement pour une course.
        React.useEffect(() => {
          let brut;
          const pas = () => {
            const avance = Math.min(1, Math.max(0, (Date.now() - depart) / duree));
            setT(avance);
            if (avance < 1) brut = requestAnimationFrame(pas);
          };
          pas();
          return () => cancelAnimationFrame(brut);
        }, [depart, duree]);

        // Tiré du seul numéro de la course : tous les écrans voient la même
        // bête boire au même moment.
        const blague = React.useMemo(
          () => blagueDeCourse(numero, chevaux.length, cfg.modeBlague),
          [numero, chevaux.length, cfg.modeBlague]
        );

        const positions = trame.profils.map((pr, i) => {
          const boisson = blague && blague.cheval === i ? blague : null;
          // Le brut sert au classement — il continue de croître après la
          // ligne, ce qui garde l'ordre d'arrivée. Le dessin, lui, s'arrête
          // au poteau : le cheval rentré ne repart pas pour un tour.
          const brut = avancementCheval(pr, t, boisson);
          const avance = Math.min(1, brut);
          return {
            index: i,
            cheval: pr.cheval,
            brut,
            avance,
            arrive: brut >= 1,
            boit: !!boisson && t > boisson.debut && t < boisson.fin,
            galope: !!boisson && t >= boisson.fin && t < boisson.retour,
            // Au dernier mètre on est encore dans le dernier tour, pas dans
            // un tour de plus : d'où le plafond.
            tour: Math.min(tours, Math.floor(avance * tours) + 1)
          };
        });
        /*
         * Deux chevaux au coude à coude échangent leur rang plusieurs fois par
         * seconde — mesuré : jusqu'à 67 ms entre deux bascules. La ligne, elle,
         * met 450 ms à glisser : elle repartait donc en arrière avant d'être
         * arrivée, et le classement tressautait dès qu'un cheval prenait la
         * tête.
         *
         * On ne touche pas à l'ordre, seulement à sa cadence : l'ordre affiché
         * tient le temps qu'une ligne finisse de glisser, puis on prend le vrai.
         * Et toujours le vrai au poteau, pour que le classement colle à
         * l'arrivée. Les pions sur la piste ne sont pas concernés : eux
         * bougent à chaque image.
         */
        const ordreVrai = [...positions]
          .sort((a, b) => b.brut - a.brut)
          .map((p) => p.index);
        const instant = Date.now();
        if (
          ordreAffiche.current === null ||
          ordreAffiche.current.length !== ordreVrai.length ||
          t >= 1 ||
          instant - derniereBascule.current >= GLISSE_CLASSEMENT_MS
        ) {
          ordreAffiche.current = ordreVrai;
          derniereBascule.current = instant;
        }
        const parIndex = new Map(positions.map((p) => [p.index, p]));
        const classement = ordreAffiche.current
          .map((i) => parIndex.get(i))
          .filter(Boolean);

        // Dépassement : la ligne qui gagne une place passe au vert, celle qui
        // en perd une au rouge, une seconde durant.
        React.useEffect(() => {
          const ordre = classement.map((p) => p.index).join(",");
          const avant = ordrePrecedent.current;
          if (avant && avant !== ordre) {
            const rangAvant = {};
            avant.split(",").forEach((id, r) => (rangAvant[id] = r));
            const nouveaux = {};
            classement.forEach((p, r) => {
              const ra = rangAvant[String(p.index)];
              if (ra === undefined || ra === r) return;
              nouveaux[p.index] = r < ra ? "gagne" : "perd";
            });
            if (Object.keys(nouveaux).length) {
              setChangements((c) => ({ ...c, ...nouveaux }));
              const cles = Object.keys(nouveaux);
              setTimeout(() => {
                setChangements((c) => {
                  const copie = { ...c };
                  cles.forEach((k) => delete copie[k]);
                  return copie;
                });
              }, DUREE_SURLIGNE_COURSE);
            }
          }
          ordrePrecedent.current = ordre;
        }, [classement.map((p) => p.index).join(",")]);

        const piste = React.useMemo(
          () => geometriePiste(chevaux.length),
          [chevaux.length]
        );
        // La bande d'arrivee : un damier pose en travers de tous les couloirs,
        // a l'endroit exact ou ils s'elancent.
        const damier = React.useMemo(() => {
          const demi = piste.largeur / 2 + 3;
          const x0 = PISTE.demiDroite + piste.rayonInterieur - demi;
          const x1 = PISTE.demiDroite + piste.rayonExterieur + demi;
          const colonnes = Math.max(3, Math.round((x1 - x0) / 13));
          const pas = (x1 - x0) / colonnes;
          const rangees = 3;
          const cases = [];
          for (let c = 0; c < colonnes; c++)
            for (let l = 0; l < rangees; l++)
              cases.push({
                cle: c + "-" + l,
                x: x0 + c * pas,
                y: (-rangees / 2 + l) * pas,
                w: pas,
                sombre: (c + l) % 2 === 0
              });
          return { cases, x0, largeur: x1 - x0, hauteur: rangees * pas };
        }, [piste]);
        // Le pion se cale sur l'écart entre couloirs, pas sur la largeur du
        // trait : c'est ce qui le rend lisible de loin sans qu'il avale ses
        // voisins.
        const rayonPion = Math.max(11, piste.ecart * 0.62);
        const decor = React.useMemo(() => decorPiste(piste), [piste]);

        // Tout ce qui ne bouge pas — le domaine, la piste, les couloirs et
        // la ligne d'arrivée — est figé une fois pour toutes. Sans ça, React
        // rebâtirait quelque quatre cents formes à chaque image de
        // l'animation, soixante fois par seconde.
        const fond = React.useMemo(
          () => (
            <g>
                  <defs>
                    <PatronBuisson id={`buisson-${numero}`} />
                    <clipPath id={`rond-central-${numero}`}>
                      <rect
                        x={-decor.demiLargeurCentre}
                        y={-decor.demiHauteurCentre}
                        width={2 * decor.demiLargeurCentre}
                        height={2 * decor.demiHauteurCentre}
                        rx={decor.demiHauteurCentre}
                      />
                    </clipPath>
                  </defs>

                  {/* Le rideau d'arbres qui ceinture le domaine */}
                  <rect
                    x={-(PISTE.demiDroite + decor.rayonHaie)}
                    y={-decor.rayonHaie}
                    width={2 * (PISTE.demiDroite + decor.rayonHaie)}
                    height={2 * decor.rayonHaie}
                    rx={decor.rayonHaie}
                    fill="none"
                    stroke={DOMAINE.arbre}
                    strokeWidth="20"
                    strokeOpacity="0.55"
                  />
                  {decor.arbresHaie.map((a, i) => (
                    <Buisson
                      key={`haie-${i}`}
                      id={`buisson-${numero}`}
                      x={a.x}
                      y={a.y}
                      tour={a.tour}
                    />
                  ))}

                  {/* L'anneau de sable, cerné de ses deux lisses blanches */}
                  <rect
                    x={-(PISTE.demiDroite + piste.rayonExterieur + 24)}
                    y={-(piste.rayonExterieur + 24)}
                    width={2 * (PISTE.demiDroite + piste.rayonExterieur + 24)}
                    height={2 * (piste.rayonExterieur + 24)}
                    rx={piste.rayonExterieur + 24}
                    fill={DOMAINE.sableOmbre}
                  />
                  <rect
                    x={-(PISTE.demiDroite + piste.rayonExterieur + 20)}
                    y={-(piste.rayonExterieur + 20)}
                    width={2 * (PISTE.demiDroite + piste.rayonExterieur + 20)}
                    height={2 * (piste.rayonExterieur + 20)}
                    rx={piste.rayonExterieur + 20}
                    fill={DOMAINE.sable}
                    stroke={DOMAINE.lisse}
                    strokeWidth="3"
                  />

                  {/* Le rond central : gazon, trace de tonte, pièce d'eau */}
                  <rect
                    x={-decor.demiLargeurCentre}
                    y={-decor.demiHauteurCentre}
                    width={2 * decor.demiLargeurCentre}
                    height={2 * decor.demiHauteurCentre}
                    rx={decor.demiHauteurCentre}
                    fill={DOMAINE.gazonCentre}
                    stroke={DOMAINE.lisse}
                    strokeWidth="3"
                  />
                  <g clipPath={`url(#rond-central-${numero})`}>
                    {decor.bandes.map((b, i) =>
                      i % 2 === 0 ? (
                        <rect
                          key={`tonte-${b.cle}`}
                          x={b.x}
                          y={-decor.demiHauteurCentre}
                          width={b.w}
                          height={2 * decor.demiHauteurCentre}
                          fill={DOMAINE.tonte}
                          fillOpacity="0.45"
                        />
                      ) : null
                    )}
                  </g>
                  {/* Tout ce qui pousse au centre est rogné au bord du rond
                      central : rien ne peut mordre sur le sable. */}
                  <g clipPath={`url(#rond-central-${numero})`}>
                    <path
                      d={decor.bassin.berge}
                      fill={DOMAINE.eau}
                      stroke={DOMAINE.eauBord}
                      strokeWidth="2.5"
                    />
                    <path
                      d={decor.bassin.hautFond}
                      fill="#81D4FA"
                      fillOpacity="0.5"
                    />
                    {decor.bosquets.map((b) => (
                      <Buisson
                        key={`bosquet-${b.cle}`}
                        id={`buisson-${numero}`}
                        x={b.x}
                        y={b.y}
                        tour={b.tour}
                      />
                    ))}
                  </g>
                  {/* Chaque couloir est double d'un liere sombre : aux
                      croisements, on voit franchement une ligne passer sur
                      l'autre au lieu de deux couleurs qui se melangent. */}
                  {chevaux.map((c, i) =>
                    piste.couloirs[i] ? (
                      <g key={`piste-${c.id}`}>
                        <path
                          d={piste.couloirs[i].d}
                          fill="none"
                          stroke={DOMAINE.bordure}
                          strokeWidth={piste.largeur + 6}
                          strokeLinejoin="round"
                          strokeLinecap="round"
                        />
                        <path
                          d={piste.couloirs[i].d}
                          fill="none"
                          stroke={c.couleur}
                          strokeOpacity="0.92"
                          strokeWidth={piste.largeur}
                          strokeLinejoin="round"
                          strokeLinecap="round"
                        />
                      </g>
                    ) : null
                  )}
                  {/* Ligne d'arrivee : la bande a damier */}
                  <g>
                    {damier.cases.map((c) => (
                      <rect
                        key={`damier-${c.cle}`}
                        x={c.x}
                        y={c.y}
                        width={c.w}
                        height={c.w}
                        fill={c.sombre ? "#101010" : "#ffffff"}
                      />
                    ))}
                    <rect
                      x={damier.x0}
                      y={-damier.hauteur / 2}
                      width={damier.largeur}
                      height={damier.hauteur}
                      fill="none"
                      stroke={DOMAINE.bordure}
                      strokeWidth="1.5"
                    />
                  </g>
            </g>
          ),
          [piste, decor, damier, chevaux, numero]
        );

        return (
          <div
            style={{
              display: "flex",
              gap: compact ? "12px" : "24px",
              alignItems: "center",
              justifyContent: "center",
              flexWrap: "wrap"
            }}
          >
            <div
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: "8px"
              }}
            >
              <div
                style={{
                  fontSize: compact ? "1rem" : "1.4rem",
                  fontWeight: "bold",
                  letterSpacing: "1px",
                  color: "#FFC107"
                }}
              >
                TOUR {classement.length ? classement[0].tour : 1} / {tours}
              </div>
              <svg
                viewBox="-458 -272 916 544"
                style={{
                  width: compact ? "min(92vw, 560px)" : "min(78vw, 1080px)",
                  maxWidth: "100%",
                  // Sur un écran peu haut, c'est la hauteur qui commande :
                  // sans ça, la piste déborderait par le bas.
                  maxHeight: compact ? "44vh" : "70vh",
                  background: DOMAINE.gazon,
                  borderRadius: "16px"
                }}
              >
                {fond}
                {positions.map((p) => {
                  const couloir = piste.couloirs[p.index];
                  if (!couloir) return null;
                  const pt = pointCouloir(
                    couloir,
                    phasePiste(piste, p.avance * tours)
                  );
                  return (
                    <g key={`cheval-${p.cheval.id}`}>
                      <circle
                        cx={pt.x}
                        cy={pt.y}
                        r={rayonPion}
                        fill={p.cheval.couleur}
                        stroke="#000"
                        strokeWidth="1.5"
                      />
                      <text
                        x={pt.x}
                        y={pt.y}
                        textAnchor="middle"
                        dominantBaseline="central"
                        style={{ fontSize: `${(rayonPion * 1.55).toFixed(0)}px` }}
                      >
                        🏇
                      </text>
                      {/* L'abreuvoir, le temps de la gorgée. */}
                      {p.boit && (
                        <text
                          x={pt.x}
                          y={pt.y - rayonPion * 1.5}
                          textAnchor="middle"
                          dominantBaseline="central"
                          style={{ fontSize: `${(rayonPion * 1.5).toFixed(0)}px` }}
                        >
                          🪣
                        </text>
                      )}
                    </g>
                  );
                })}
              </svg>
            </div>

            {/* Comme au classement général : les lignes gardent leur place
                dans la page et c'est leur position qui glisse. */}
            <div
              style={{
                minWidth: compact ? "200px" : "260px",
                // Bornée quand même : un nom à rallonge ne doit pas manger
                // la piste. Au-delà, l'ellipse de la ligne prend le relais.
                maxWidth: compact ? "60vw" : "34vw",
                position: "relative",
                height: `${classement.length * PAS_CLASSEMENT_COURSE}px`
              }}
            >
              {/* Un gabarit invisible, en flux normal. Les lignes du
                  classement sont en position absolue : elles ne donnent
                  aucune largeur au panneau, qui resterait donc à son minimum
                  et rognerait le nom le plus long. On mesure ici la pire
                  ligne possible — le nom le plus long, en gras comme l'est
                  le premier, mention du mode blague comprise — et le
