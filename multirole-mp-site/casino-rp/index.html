                  panneau s'y ajuste. */}
              <div
                aria-hidden="true"
                style={{
                  visibility: "hidden",
                  height: 0,
                  overflow: "hidden",
                  display: "flex",
                  gap: "8px",
                  padding: "0 10px",
                  fontWeight: "bold",
                  whiteSpace: "nowrap"
                }}
              >
                <span style={{ width: "22px" }}>0.</span>
                <span>
                  {chevaux.reduce(
                    (long, c) =>
                      String((c || {}).nom || "").length > long.length
                        ? String(c.nom)
                        : long,
                    ""
                  )}
                  {blague ? " 💨 il rattrape" : ""}
                </span>
                <span style={{ fontSize: "0.78rem" }}>tour {tours}</span>
              </div>
              {[...classement]
                .sort((a, b) => a.index - b.index)
                .map((p) => {
                  const rang = classement.findIndex(
                    (x) => x.index === p.index
                  );
                  const etat = changements[p.index];
                  const boit = p.boit;
                  const galope = p.galope;
                  return (
                  <div
                    key={`rang-${p.cheval.id}`}
                    style={{
                      position: "absolute",
                      left: 0,
                      right: 0,
                      top: 0,
                      transform: `translateY(${rang * PAS_CLASSEMENT_COURSE}px)`,
                      boxSizing: "border-box",
                      height: `${PAS_CLASSEMENT_COURSE - 6}px`,
                      display: "flex",
                      alignItems: "center",
                      gap: "8px",
                      padding: "0 10px",
                      borderRadius: "8px",
                      background:
                        etat === "gagne"
                          ? "#1B5E20"
                          : etat === "perd"
                            ? "#7f1d1d"
                            : "#1a1a1a",
                      transition:
                        `transform ${GLISSE_CLASSEMENT_MS}ms cubic-bezier(.4,0,.2,1), ` +
                        "background 300ms",
                      borderLeft: `6px solid ${p.cheval.couleur}`,
                      fontWeight: rang === 0 ? "bold" : "normal"
                    }}
                  >
                    {/* Le rang garde sa colonne même en gras. */}
                    <span style={{ width: "22px", flexShrink: 0 }}>
                      {rang + 1}.
                    </span>
                    {/* minWidth:0 laisse la case rétrécir sous la taille du
                        texte — sans lui, un nom long pousserait le tour hors
                        de la ligne au lieu de se laisser rogner. */}
                    <span
                      style={{
                        flex: 1,
                        minWidth: 0,
                        whiteSpace: "nowrap",
                        overflow: "hidden",
                        textOverflow: "ellipsis"
                      }}
                    >
                      {p.cheval.nom}
                      {boit && (
                        <span style={{ color: "#4FC3F7" }}> 🪣 il boit</span>
                      )}
                      {galope && (
                        <span style={{ color: "#FFC107" }}> 💨 il rattrape</span>
                      )}
                    </span>
                    <span
                      style={{
                        color: "#888",
                        fontSize: "0.78rem",
                        flexShrink: 0
                      }}
                    >
                      tour {p.tour}
                    </span>
                  </div>
                  );
                })}
            </div>
          </div>
        );
      }

      function App() {
        const [interfaceActive, setInterfaceActive] = React.useState("menu");
        const [supabaseConnected, setSupabaseConnected] = React.useState(false);
        const [codeManuel, setCodeManuel] = React.useState("");

        // Vérifier la connexion Supabase
        React.useEffect(() => {
          if (typeof supabase !== "undefined" && supabase) {
            setSupabaseConnected(true);
          } else {
            setSupabaseConnected(false);
          }

          );
          ligne("Jeu", "", joueursExport.map((j) => j.totalJeux));
          ligne("Missions", "", joueursExport.map((j) => j.totalMissions));
          ligne("Achats boutique", "", joueursExport.map((j) => j.achatsBoutique));
          ligne("", "", []);

          // Les trois catégories, chacune avec ses cases à cocher
          const sections = [
            ["MISSIONS (à cocher = crédit)", missions, "missionsFaites"],
            ["PRODUITS (à cocher = débit)", produits, "produitsAchetes"],
            ["PÉNALITÉS (à cocher = débit)", penalites, "penalitesSubies"]
          ];
          const plages = [];

          sections.forEach(([titre, elements, champ]) => {
            ligne(titre, "", []);
            const premiere = lignes.length + 1;
            elements.forEach((el) => {
              ligne(
                el.nom,
                el.montant,
                joueursExport.map((j) => (j[champ] || []).includes(el.id))
              );
            });
            const derniere = lignes.length;
            if (derniere >= premiere) plages.push([premiere, derniere]);
            ligne("", "", []);
          });

          // Ce que les cases déjà cochées représentent : ces éléments ont
          // déjà été portés au compte du joueur dans le jeu. Sans cette
          // soustraction, le total les compterait une seconde fois.
          const dejaApplique = (j) => {
            const somme = (elements, champ, signe) =>
              elements.reduce(
                (t, el) =>
                  (j[champ] || []).includes(el.id) ? t + signe * el.montant : t,
                0
              );
            return (
              somme(missions, "missionsFaites", 1) +
              somme(produits, "produitsAchetes", -1) +
              somme(penalites, "penalitesSubies", -1)
            );
          };

          const ligneDeja = ligne(
            "Déjà porté au compte",
            "",
            joueursExport.map(dejaApplique)
          );

          // Total : tout ce qui est coché, moins ce qui l'était déjà. Au
          // moment de l'export il vaut donc zéro, et il grandit à mesure que
          // de nouvelles cases sont cochées.
          const [mis, pro, pen] = plages;
          const totalPour = (i) => {
            const c = colonne(i);
            const M = XLSX.utils.encode_col(COL_MONTANT);
            const bloc = (p, signe) =>
              p
                ? `${signe}SUMPRODUCT(--${c}${p[0]}:${c}${p[1]},${M}${p[0]}:${M}${p[1]})`
                : "";
            const coche = (bloc(mis, "") + bloc(pro, "-") + bloc(pen, "-"))
              .replace(/^\+/, "");
            return `${coche}-${c}${ligneDeja}`;
          };

          const ligneTotal = lignes.length + 1;
          const l = ["TOTAL À APPLIQUER (nouvelles coches)", ""];
          joueursExport.forEach((_, i) => l.push({ f: totalPour(i) }));
          lignes.push(l);

          const l2 = ["Solde après application", ""];
          joueursExport.forEach((_, i) => {
            const c = colonne(i);
            l2.push({ f: `${c}${ligneSolde}+${c}${ligneTotal}` });
          });
          lignes.push(l2);

          const feuille = XLSX.utils.aoa_to_sheet(lignes);
          feuille["!cols"] = [{ wch: 34 }, { wch: 10 }].concat(
            joueursExport.map(() => ({ wch: 11 }))
          );

          const classeur = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(classeur, feuille, "Suivi");
          const horodatage = new Date()
            .toISOString()
            .slice(0, 16)
            .replace(/[:T]/g, "-");
          XLSX.writeFile(classeur, `casino-rp-suivi-${horodatage}.xlsx`);
        };

        const validerCodeAdmin = () => {
          if (saisieCodeAdmin !== configGlobale.codeAdmin) {
            setErreurCodeAdmin("Code incorrect.");
            return;
          }
          setInterfaceActive("menu");
          setModalAdminOuvert(false);
          setSaisieCodeAdmin("");
          setErreurCodeAdmin("");
          fermerSessionJoueur();
        };

        // Ferme la session du joueur et efface toute trace de sa saisie :
        // la borne suivante ne doit rien conserver de lui.
        const fermerSessionJoueur = React.useCallback(() => {
          setJoueurConnecteId(null);
          setSousMenuBanque("accueil");
          setIdSaisi("");
          setCodeSaisi("");
        }, []);

        // ================= DÉCONNEXION AUTOMATIQUE =================
        // Les 3 bornes sont partagées par tous les joueurs : un joueur qui
        // s'éloigne sans se déconnecter laisserait son compte ouvert au
        // suivant. On revient donc à l'écran de connexion après un silence.
        React.useEffect(() => {
          if (!joueurConnecteId) return;
          const delai =
            (Number(configGlobale.dureeInactiviteSec) > 0
              ? Number(configGlobale.dureeInactiviteSec)
              : 120) * 1000;

          let minuteur;
          const relancer = () => {
            clearTimeout(minuteur);
            minuteur = setTimeout(fermerSessionJoueur, delai);
          };

          const evenements = ["pointerdown", "keydown", "wheel", "touchstart"];
          evenements.forEach((e) =>
            window.addEventListener(e, relancer, { passive: true })
          );
          relancer();

          return () => {
            clearTimeout(minuteur);
            evenements.forEach((e) => window.removeEventListener(e, relancer));
          };
        }, [joueurConnecteId, configGlobale.dureeInactiviteSec, fermerSessionJoueur]);

        // ================= SAUVEGARDE & RESTAURATION =================
        // Filet de sécurité indépendant de la base : la partie entière peut
        // être exportée dans un fichier, et rechargée depuis n'importe quel
        // appareil. Une copie automatique est gardée sur chaque appareil.

        const CLE_SAUVEGARDE_LOCALE = "casino-rp-sauvegarde";

        const donneesPartie = () => ({
          version: 1,
          date: new Date().toISOString(),
          configGlobale,
          missions,
          produits,
          penalites,
          cartesJeu,
          desConfig,
          joueurs,
          codesRegistre,
          historiqueFiscal,
          historiqueAffichage
        });

        // Copie automatique sur l'appareil, toutes les 30 secondes. Chaque
        // appareil garde ainsi de quoi relancer la partie si la base devient
        // inaccessible.
        const [dateSauvegardeLocale, setDateSauvegardeLocale] =
          React.useState(null);

        const refDonnees = React.useRef(donneesPartie);
        refDonnees.current = donneesPartie;

        React.useEffect(() => {
          const enregistrer = () => {
            try {
              const donnees = refDonnees.current();
              localStorage.setItem(
                CLE_SAUVEGARDE_LOCALE,
                JSON.stringify(donnees)
              );
              setDateSauvegardeLocale(donnees.date);
            } catch (e) {
              // Stockage plein ou navigation privée : la sauvegarde manuelle
              // reste disponible, on ne bloque pas la partie pour autant.
            }
          };
          enregistrer();
          const minuteur = setInterval(enregistrer, 30000);
          return () => clearInterval(minuteur);
        }, []);

        React.useEffect(() => {
          try {
            const brut = localStorage.getItem(CLE_SAUVEGARDE_LOCALE);
            if (brut) setDateSauvegardeLocale(JSON.parse(brut).date);
          } catch (e) {}
        }, []);

        const telechargerSauvegarde = () => {
          const contenu = JSON.stringify(donneesPartie(), null, 2);
          const horodatage = new Date()
            .toISOString()
            .slice(0, 16)
            .replace(/[:T]/g, "-");
          const lien = document.createElement("a");
          lien.href = URL.createObjectURL(
            new Blob([contenu], { type: "application/json" })
          );
          lien.download = `casino-rp-${horodatage}.json`;
          document.body.appendChild(lien);
          lien.click();
          document.body.removeChild(lien);
          URL.revokeObjectURL(lien.href);
        };

        // Remet à zéro tout ce qui appartient à la partie jouée, et rien de
        // ce qui a été réglé pour la soirée : missions, produits, pénalités,
        // Un compte remis à neuf : le joueur garde son identité — nom,
        // identifiant, code, ordre d'affichage — et perd tout le reste. Une
        // seule définition, pour que « Nouvelle Partie » et « comptes à zéro »
        // ne divergent jamais.
        const compteVierge = (j) => ({
          id: j.id,
          code: j.code,
          nom: j.nom,
          ordre: j.ordre,
          solde: 0,
          totalMissions: 0,
          totalJeux: 0,
          nbPenalites: 0,
          totalPenalites: 0,
          jetonsEnJeu: 0,
          croupierVendeur: null,
          jeuEnCours: null,
          veinardActif: false,
          fontaineActive: false,
          gardeDuCorpsActif: false,
          assuranceActive: false,
          fondsDispo: 0,
          achatsBoutique: 0,
          argentVole: 0,
          argentGagneCarte: 0,
          paradisFiscal: false,
          finParadis: 0,
          tuyau: null,
          deck: [],
          historique: [],
          avisBookmaker: [],
          codesUtilises: [],
          missionsFaites: [],
          produitsAchetes: [],
          penalitesSubies: []
        });

        // Vide la partie. Les deux boutons de remise à zéro passent par ici :
        // sans ça, celui qui garde les joueurs oublierait l'historique de la
        // salle, les paris et les investissements, et la « nouvelle » partie
        // repartirait avec les traces de l'ancienne.
        const viderLaPartie = (garderLesJoueurs) => {
          setJoueurs((prev) => (garderLesJoueurs ? prev.map(compteVierge) : []));
          setChequesImprimerie([]);
          setCodesRegistre([]);
          // Le bookmaker : paris en cours, argent engagé dans les projets, et
          // l'horloge de la soirée qui cadence courses et blocs.
          setParisJoueurs([]);
          setParisCourse([]);
          setInvestissements([]);
          setDernierBlocImpose(0);
          setPauseSoiree(null);
          setFioles([]);
          setSoireeDebut(0);
          // Sans ça, la course lancée à la main pendant la partie précédente
          // survivrait à la remise à zéro, avec son numéro.
          setCourseManuelle(null);
          setVitrine({ mode: "accueil" });
          // Les traces de la partie précédente.
          setHistoriqueFiscal([]);
          setHistoriqueAffichage([configGlobale.phraseAucunHistorique]);
        };

        // cartes, dés, chevaux, croupiers et surtout les projets
        // d'investissement restent en place. On efface les parties d'argent
        // en cours, pas le travail de préparation.
        // Reprendre après une pause : tout ce qui était daté en absolu doit
        // reculer d'autant, sinon une pause de dix minutes ferait passer trois
        // courses et expirer les paradis fiscaux dans le vide.
        const reprendreLaSoiree = () => {
          if (!pauseSoiree) return;
          const ecart = Math.max(
            0,
            Date.now() - nombreSur(pauseSoiree.depuis, Date.now())
          );
          if (ecart > 0) {
            if (soireeDebut) setSoireeDebut(soireeDebut + ecart);
            setCourseManuelle((c) =>
              c && c.depart ? { ...c, depart: c.depart + ecart } : c
            );
            setInvestissements((prev) =>
              prev.map((i) =>
                i.premierTs ? { ...i, premierTs: i.premierTs + ecart } : i
              )
            );
            setJoueurs((prev) =>
              prev.map((j) => ({
                ...j,
                finParadis: j.finParadis ? j.finParadis + ecart : j.finParadis,
                deck: (j.deck || []).map((c) =>
                  c.recuLe ? { ...c, recuLe: c.recuLe + ecart } : c
                ),
                tuyau:
                  j.tuyau && j.tuyau.depart
                    ? { ...j.tuyau, depart: j.tuyau.depart + ecart }
                    : j.tuyau
              }))
            );
          }
          setPauseSoiree(null);
        };

        // Vingt-cinq joueurs de test, soldes tirés entre 0 et 1000 : de quoi
        // voir l'impôt, le classement et les cartes se comporter sur une vraie
        // table plutôt que sur quatre lignes.
        const tableDEssai = () => {
          const prenoms = [
            "Alice", "Bruno", "Chloé", "Damien", "Elsa", "Farid", "Gaëlle",
            "Hugo", "Inès", "Jonas", "Katia", "Louis", "Maya", "Nadir",
            "Olivia", "Pierre", "Quentin", "Rania", "Samuel", "Théa",
            "Ulysse", "Vera", "Willem", "Xénia", "Yanis"
          ];
          return prenoms.map((nom, i) => ({
            id: `test${i + 1}`,
            code: String(1000 + i + 1),
            nom,
            ordre: i + 1,
            solde: Math.floor(Math.random() * 1001),
            totalMissions: 0,
            totalJeux: 0,
            nbPenalites: 0,
            totalPenalites: 0,
            jetonsEnJeu: 0,
            croupierVendeur: null,
            veinardActif: false,
            fontaineActive: false,
            gardeDuCorpsActif: false,
            assuranceActive: false,
            fondsDispo: 0,
            achatsBoutique: 0,
            argentVole: 0,
            argentGagneCarte: 0,
            paradisFiscal: false,
            finParadis: 0,
            tuyau: null,
            deck: [],
            historique: [],
            avisBookmaker: [],
            codesUtilises: [],
            missionsFaites: [],
            produitsAchetes: [],
            penalitesSubies: []
          }));
        };

        const nouvellePartie = () => {
          if (
            !window.confirm(
              "Nouvelle partie ?\n\n" +
                "Seront effacés : les joueurs et leurs soldes, les paris en cours, " +
                "les investissements engagés, les chèques imprimés, l'historique " +
                "et l'heure de début de soirée.\n\n" +
                "Seront conservés : vos réglages — missions, produits, pénalités, " +
                "cartes, dés, chevaux, croupiers et vos projets d'investissement."
            )
          ) {
            return;
          }
          viderLaPartie(false);
          setInterfaceActive("menu");
          alert(
            "Nouvelle partie initialisée !\n\n" +
              "Pensez à appuyer sur « Démarrer la soirée » pour relancer les " +
              "courses et les blocs d'investissement."
          );
        };

        const appliquerSauvegarde = (donnees) => {
          // Les setters passent par useEtatPartage : en mode synchronisé, la
          // restauration se propage d'elle-même à tous les appareils.
          if (donnees.configGlobale) setConfigGlobale(donnees.configGlobale);
          if (donnees.missions) setMissions(donnees.missions);
          if (donnees.produits) setProduits(donnees.produits);
          if (donnees.penalites) setPenalites(donnees.penalites);
          if (donnees.cartesJeu) setCartesJeu(donnees.cartesJeu);
          if (donnees.desConfig) setDesConfig(donnees.desConfig);
          if (donnees.joueurs) setJoueurs(donnees.joueurs);
          if (donnees.codesRegistre)
            setCodesRegistre(donnees.codesRegistre);
          if (donnees.historiqueFiscal)
            setHistoriqueFiscal(donnees.historiqueFiscal);
          if (donnees.historiqueAffichage)
            setHistoriqueAffichage(donnees.historiqueAffichage);
        };

        // La confirmation s'affiche dans la page : une fenêtre du navigateur
        // peut être bloquée, et la restauration serait alors annulée sans que
        // rien ne l'indique.
        const [restaurationEnAttente, setRestaurationEnAttente] =
          React.useState(null);

        const restaurerDepuisFichier = (fichier) => {
          if (!fichier) return;
          const lecteur = new FileReader();
          lecteur.onload = () => {
            try {
              const donnees = JSON.parse(lecteur.result);
              if (!donnees.joueurs) {
                setRestaurationEnAttente({
                  erreur: "Ce fichier ne contient pas de partie."
                });
                return;
              }
              setRestaurationEnAttente({
                donnees,
                source: "le fichier " + fichier.name,
                quand: donnees.date
                  ? new Date(donnees.date).toLocaleString()
                  : "date inconnue"
              });
            } catch (e) {
              setRestaurationEnAttente({
                erreur: "Fichier illisible : " + e.message
              });
            }
          };
          lecteur.readAsText(fichier);
        };

        const restaurerDepuisAppareil = () => {
          try {
            const brut = localStorage.getItem(CLE_SAUVEGARDE_LOCALE);
            if (!brut) {
              setRestaurationEnAttente({
                erreur: "Aucune copie automatique sur cet appareil."
              });
              return;
            }
            const donnees = JSON.parse(brut);
            setRestaurationEnAttente({
              donnees,
              source: "la copie automatique de cet appareil",
              quand: new Date(donnees.date).toLocaleString()
            });
          } catch (e) {
            setRestaurationEnAttente({
              erreur: "Copie automatique illisible : " + e.message
            });
          }
        };

        // ================= HORLOGE ET ÉTAT DU BOOKMAKER =================
        // Un battement par seconde suffit aux décomptes. Toutes les échéances
        // — courses, blocs d'investissement, délais des projets — se lisent
        // sur cette horloge, elle-même calée sur l'heure de début de soirée
        // partagée par tous les appareils.
        const [horloge, setHorloge] = React.useState(Date.now());
        React.useEffect(() => {
          const t = setInterval(() => setHorloge(Date.now()), 1000);
          return () => clearInterval(t);
        }, []);
        // En pause, l'heure du jeu se fige à l'instant où l'on a appuyé :
        // courses, blocs, échéances de projets, durée du paradis fiscal et
        // temps de garde des cartes s'arrêtent tous d'un coup, puisqu'ils
        // lisent tous cette horloge-là.
        const maintenant = pauseSoiree
          ? nombreSur(pauseSoiree.depuis, horloge)
          : horloge;

        // ---- Plein écran ----
        // Le verrou sert à la borne : Échap fait toujours sortir du plein
        // écran — aucun navigateur ne laisse le bloquer, c'est une garantie
        // faite à l'utilisateur. On rattrape donc la sortie : dès qu'elle
        // arrive, un panneau couvre la borne tant que le code n'est pas donné.
        const [pleinEcran, setPleinEcran] = React.useState(false);
        const [verrouEcran, setVerrouEcran] = React.useState(false);
        const [demandeSortie, setDemandeSortie] = React.useState(false);
        const [codeSortie, setCodeSortie] = React.useState("");

        React.useEffect(() => {
          const suivre = () => {
            const actif = enPleinEcran();
            setPleinEcran(actif);
            if (!actif && verrouEcran) setDemandeSortie(true);
          };
          suivre();
          document.addEventListener("fullscreenchange", suivre);
          document.addEventListener("webkitfullscreenchange", suivre);
          return () => {
            document.removeEventListener("fullscreenchange", suivre);
            document.removeEventListener("webkitfullscreenchange", suivre);
          };
        }, [verrouEcran]);

        const basculerPleinEcran = (verrouiller) => {
          if (!enPleinEcran()) {
            passerEnPleinEcran()
              .then(() => {
                if (verrouiller) setVerrouEcran(true);
              })
              .catch(() =>
                alert(
                  "Cet appareil ne propose pas le plein écran.\n\n" +
                    "Sur iPad et iPhone, Safari le réserve aux vidéos. La " +
                    "solution : bouton Partager, puis « Ajouter à l'écran " +
                    "d'accueil ». Le site s'ouvre alors en application, sans " +
                    "barre d'adresse ni onglets — et sans touche Échap."
                )
              );
            return;
          }
          if (verrouiller && verrouEcran) {
            setDemandeSortie(true);
            return;
          }
          quitterLePleinEcran();
        };

        const boutonPleinEcran = (verrouiller) => (
          <button
            onClick={() => basculerPleinEcran(verrouiller)}
            className="bouton-plein-ecran no-print"
            title={pleinEcran ? "Quitter le plein écran" : "Passer en plein écran"}
            style={{
              background: "rgba(0,0,0,0.45)",
              color: "#fff",
              border: "1px solid #555",
              borderRadius: "8px",
              padding: "6px 10px",
              fontSize: "1rem",
              lineHeight: 1,
              cursor: "pointer"
            }}
          >
            {pleinEcran ? "⛶✕" : "⛶"}
          </button>
        );

        const validerSortie = () => {
          if (String(codeSortie) !== String(configGlobale.codeAdmin)) {
            alert("Code incorrect.");
            return;
          }
          setVerrouEcran(false);
          setDemandeSortie(false);
          setCodeSortie("");
          quitterLePleinEcran();
        };

        // Le panneau de déverrouillage de la borne. Il couvre tout : tant que
        // le code n'est pas donné, il n'y a rien d'autre à faire que revenir
        // en plein écran.
        const panneauVerrou = () =>
          demandeSortie ? (
            <div
              style={{
                position: "fixed",
                inset: 0,
                zIndex: 9999,
                background: "#0b0b0b",
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
                gap: "16px",
                padding: "24px",
                textAlign: "center"
              }}
            >
              <div style={{ fontSize: "3rem" }}>🔒</div>
              <h2 style={{ margin: 0, color: "#FFC107" }}>Borne verrouillée</h2>
              <p style={{ color: "#aaa", maxWidth: "420px", margin: 0 }}>
                Le code administrateur est demandé pour quitter le plein écran.
              </p>
              <input
                type="password"
                inputMode="numeric"
                value={codeSortie}
                onChange={(e) => setCodeSortie(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") validerSortie();
                }}
                placeholder="Code administrateur"
                style={{
                  padding: "12px",
                  fontSize: "1.2rem",
                  textAlign: "center",
                  width: "220px",
                  borderRadius: "8px",
                  border: "1px solid #555"
                }}
              />
              <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
                <button
                  onClick={validerSortie}
                  style={{
                    padding: "12px 18px",
                    background: "#F44336",
                    color: "#fff",
                    border: "none",
                    borderRadius: "8px",
                    fontWeight: "bold",
                    cursor: "pointer"
                  }}
                >
                  Déverrouiller
                </button>
                <button
                  onClick={() => {
                    setDemandeSortie(false);
                    setCodeSortie("");
                    passerEnPleinEcran().catch(() => {});
                  }}
                  style={{
                    padding: "12px 18px",
                    background: "#333",
                    color: "#ddd",
                    border: "none",
                    borderRadius: "8px",
                    cursor: "pointer"
                  }}
                >
                  Revenir en plein écran
                </button>
              </div>
            </div>
          ) : null;

        const course = infosCourse(
          maintenant,
          soireeDebut,
          configBookmaker,
          courseManuelle
        );
        const blocInvest = blocActuel(maintenant, soireeDebut, configBookmaker);

        // Le contrôle fiscal est interdit autour de la course : on veut la
        // salle devant l'hippodrome, pas devant deux animations qui se
        // disputent l'écran. Renvoie les secondes restantes, ou 0.
        const secondesBlocageFiscal = (() => {
          if (!course.active || !course.numero) return 0;
          const avant =
            nombreSur(configBookmaker.courseBlocageAvantMin, 2) * 60000;
          const duree = nombreSur(configBookmaker.courseDureeSec, 45) * 1000;
          const apres =
            nombreSur(configBookmaker.courseBlocageApresMin, 1) * 60000;
          const fin = course.depart + duree + apres;
          if (course.avantDepart > avant) return 0;
          if (maintenant >= fin) return 0;
          return Math.ceil((fin - maintenant) / 1000);
        })();

        // ================= JETONS EN JEU : GARDE-FOU =================
        // Un joueur assis à une table ne touche plus à ses cartes : ni
        // ramassage, ni activation. Sans cette règle, il pourrait se faire
        // parier dessus puis sortir un Veinard pour fausser le pari.
        const MESSAGE_JETONS_EN_JEU =
          "Vous avez des jetons en jeu, veuillez régulariser votre situation avant de continuer à jouer.";

        const bloqueParJetons = (joueur) =>
          !!(joueur && nombreSur(joueur.jetonsEnJeu, 0) > 0);

        // Annonce sur l'écran de la salle. Sans elle, un joueur ne saurait
        // jamais qu'il a gagné : ses gains se dénouent quand il n'est pas là
        // — au retour des jetons d'un autre, à l'arrivée d'une course, à
        // l'échéance d'un projet. Les montants restent privés, ils ne
        // figurent que dans l'avis personnel sur la borne.
        const annoncerSalle = React.useCallback(
          (lignes) => {
            const nouvelles = (Array.isArray(lignes) ? lignes : [lignes]).filter(
              Boolean
            );
            if (!nouvelles.length) return;
            setHistoriqueAffichage((prev) =>
              [
                ...nouvelles,
                ...(prev || []).filter(
                  (x) => x && x !== configGlobale.phraseAucunHistorique
                )
              ].slice(0, 4)
            );
          },
          [setHistoriqueAffichage, configGlobale.phraseAucunHistorique]
        );

        // ================= PARIS SUR UN JOUEUR =================
        const parisOuvertsSur = (joueurId) =>
          parisJoueurs.filter(
            (p) => p.statut === "ouvert" && p.cibleId === joueurId
          );

        // Un joueur est « pariable » tant qu'il est à table sans Veinard.
        const raisonRefusPari = (cible) => {
          if (!cible) return "Aucun joueur sélectionné.";
          if (!(cible.jetonsEnJeu > 0))
            return `${cible.nom} n'a pas de jetons en jeu : aucune cote n'est calculable.`;
          if ((cible.deck || []).some((c) => c.id === "veinard"))
            return `${cible.nom} détient une carte Veinard : les paris sur ce joueur sont interdits.`;
          // Certaines tables se jouent entre joueurs : parier sur le résultat
          // de quelqu'un qui y est assis, c'est parier sur une partie qui
          // peut s'arranger.
          const jeu = jeuNomme(cible.jeuEnCours);
          if (jeu && jeu.parisAutorises === false)
            return `${cible.nom} est à la table de ${jeu.nom} : les paris y sont interdits.`;
          return null;
        };

        const libelleSeuil = (seuil) =>
          seuil.sens === "gain"
            ? `ressort avec +${seuil.pct} % de bénéfice`
            : `ressort avec −${seuil.pct} % de perte`;

        const placerPariJoueur = (parieurId, cibleId, seuilId, mise, surLeFonds) => {
          const cfg = configBookmaker;
          const parieur = joueurs.find((j) => j.id === parieurId);
          const cible = joueurs.find((j) => j.id === cibleId);
          const seuil = (cfg.seuilsPari || []).find(
            (x) => String(x.id) === String(seuilId)
          );
          if (!parieur || !cible || !seuil) {
            alert("Sélection incomplète.");
            return;
          }
          if (parieur.id === cible.id) {
            alert("Un joueur ne peut pas parier sur lui-même.");
            return;
          }
          const refus = raisonRefusPari(cible);
          if (refus) {
            alert(refus);
            return;
          }
          const m = Number(mise);
          if (!(m > 0)) {
            alert("Montant invalide.");
            return;
          }
          const plafond = nombreSur(cfg.misePlafondPari, 100);
          if (m > plafond) {
            alert(`La mise ne peut pas dépasser ${plafond} par pari.`);
            return;
          }
          const cumulMax = nombreSur(cfg.misePlafondCumul, 0);
          if (cumulMax > 0) {
            const deja = parisJoueurs
              .filter(
                (p) =>
                  p.statut === "ouvert" &&
                  p.parieurId === parieurId &&
                  p.cibleId === cibleId
              )
              .reduce((t, p) => t + nombreSur(p.mise, 0), 0);
            if (deja + m > cumulMax) {
              alert(
                `Plafond cumulé de ${cumulMax} sur ce joueur : ${deja} déjà misés.`
              );
              return;
            }
          }
          const part = partageDuPaiement(parieur, m, surLeFonds);
          if (part.manque > 0) {
            alert(refusDePaiement(parieur, part));
            return;
          }

          const cote = calculerCote(cible.jetonsEnJeu, seuil.pct, cfg);
          const pari = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            parieurId,
            cibleId,
            sens: seuil.sens,
            pct: nombreSur(seuil.pct, 0),
            mise: m,
            cote,
            statut: "ouvert",
            ts: Date.now()
          };
          setParisJoueurs((prev) => [...prev, pari]);
          setJoueurs((prev) =>
            prev.map((j) =>
              j.id === parieurId
                ? {
                    ...j,
                    solde: Math.max(0, j.solde - part.surSolde),
                    fondsDispo: Math.max(
                      0,
                      nombreSur(j.fondsDispo, 0) - part.surFonds
                    ),
                    historique: [
                      `Pari ${m}$ sur ${cible.nom} (${libelleSeuil(seuil)}) — cote ${cote}` +
                        part.mention,
                      ...j.historique
                    ]
                  }
                : j
            )
          );
          alert(
            `Pari enregistré : ${parieur.nom} mise ${m}$ sur ${cible.nom}\n` +
              `${libelleSeuil(seuil)} — cote ${cote}, gain possible ${Math.round(m * cote)}$`
          );
        };

        // ================= PARIS SUR LA COURSE =================
        const chevauxCourse = configBookmaker.chevaux || [];

        // L'assurance tous risques : elle rembourse une part de ce qu'un
        // joueur vient de perdre chez le financier, puis se consomme. Un
        // règlement gagnant ne la touche pas.
        // Renvoie { montant, ligne } ou null.
        const rembourserAssurance = (joueur, perte) => {
          if (!joueur || !joueur.assuranceActive) return null;
          const p = Math.max(0, Math.round(nombreSur(perte, 0)));
          if (p <= 0) return null;
          const pct = Math.max(0, nombreSur(configGlobale.pctAssurance, 75));
          const montant = Math.round((p * pct) / 100);
          if (montant <= 0) return null;
          return {
            montant,
            ligne: `Assurance tous risques : ${pct} % de ${p}$ perdus remboursés, +${montant}$`
          };
        };

        // La fiole de cette course-là, traduite en indice de cheval : c'est
        // ce que le tirage attend.
        const herbesDe = (numero) => {
          const fiole = fioleDeCourse(numero);
          if (!fiole || !fiole.chevalId) return null;
          const index = chevauxCourse.findIndex(
            (c) => String(c.id) === String(fiole.chevalId)
          );
          if (index < 0) return null;
          return {
            index,
            pct: Math.max(0, nombreSur(configGlobale.herbesPctPremier, 20))
          };
        };

        const chevalGagnant = (numero) => {
          if (!numero || !chevauxCourse.length) return null;
          const { gagnant } = trameCourse(
            numero,
            chevauxCourse,
            configBookmaker,
            herbesDe(numero)
          );
          return chevauxCourse[gagnant] || null;
        };

        // Le délit d'initié révèle le vainqueur d'une course sur laquelle on
        // peut encore parier — sinon le tuyau ne vaut rien. Si les paris de la
        // course en cours sont clos, on donne celui de la suivante.
        // Les chiffres d'une carte, tels qu'ils sont réglés à l'instant. Ils
        // ne sont pas écrits dans les textes : l'organisateur peut changer un
        // pourcentage en pleine soirée, et la carte doit dire vrai.
        const chiffresCarte = (id) => {
          const n = (cle, secours) =>
            Math.max(0, Math.round(nombreSur(configGlobale[cle], secours)));
          if (id === "veinard")
            return (
              `Perte réduite de ${n("bonusVeinardPertes", 50)} %, ` +
              `gain majoré de ${n("bonusVeinardGain", 5)} %.`
            );
          if (id === "fontaine_jouvence")
            return `Bonus sur la mission : +${n("bonusFontainePct", 20)} %.`;
          if (id === "argent_poche" || id === "heritage")
            return `Versement : ${versementDe(id)}$.`;
          if (id === "fonds_investissement")
            return `Enveloppe : ${n("montantFonds", 70)}$ à dépenser chez le financier.`;
          if (id === "assurance")
            return `Remboursement : ${n("pctAssurance", 75)} % de la perte.`;
          if (id === "herbes_medicinales")
            return (
              `+${n("herbesPctPremier", 20)} % de chances de gagner, ` +
              "et jamais dernier."
            );
          if (id === "paradis_fiscal")
            return `Durée : ${n("dureeParadisFiscalMin", 15)} minutes.`;
          return null;
        };

        // Ce que verse une carte à versement simple.
        const versementDe = (id) =>
          Math.max(
            0,
            Math.round(
              id === "heritage"
                ? nombreSur(configGlobale.montantHeritage, 100)
                : nombreSur(configGlobale.montantArgentPoche, 50)
            )
          );

        // La fiole d'herbes se verse sur la course encore ouverte aux paris :
        // c'est celle sur laquelle le joueur pourra miser. Elle attend son
        // cheval — le bookmaker l'y rattachera au moment du pari.
        const verserLesHerbes = (carte) => {
          const mienne = fioleDe(joueurActuel.id);
          if (mienne) {
            alert(
              `Votre fiole est déjà versée pour la course n°${mienne.numero}.\n\n` +
                "Allez miser chez le bookmaker : elle s'appliquera au cheval " +
                "que vous choisirez."
            );
            return;
          }
          const cible = courseAParier();
          if (!cible) {
            alert(
              "Aucune course n'est ouverte aux paris pour l'instant.\n\n" +
                (soireeDebut
                  ? ""
                  : "La soirée n'a pas démarré : l'organisateur doit appuyer " +
                    "sur « Démarrer la soirée ».\n\n") +
                "Gardez votre carte : elle ne se consomme pas."
            );
            return;
          }
          // Deux fioles sur la même course, ce serait deux dopages sur un
          // seul tirage : le second est refusé, et il sait pourquoi. Sa carte
          // lui reste — c'est la course suivante qu'elle servira.
          const dejaServie = fioleDeCourse(cible.numero);
          if (dejaServie) {
            alert(
              `Une fiole a déjà été versée sur la course n°${cible.numero}.\n\n` +
                "Une seule par course. Gardez la vôtre : elle ne se consomme " +
                "pas, et vous pourrez la verser sur la prochaine."
            );
            return;
          }
          // Un délit d'initié a déjà nommé le vainqueur de cette course :
          // verser les herbes dessus ferait mentir un tuyau déjà lu, et son
          // porteur n'y pourrait rien. La fiole part donc sur la première
          // course encore vierge de tuyau. Rien ne le dit à personne : le
          // joueur lit juste un autre numéro, et le porteur du tuyau ignore
          // qu'on a failli le souffler.
          const tuyauPose = (n) =>
            joueurs.some(
              (j) =>
                j.id !== joueurActuel.id &&
                j.tuyau &&
                Number(j.tuyau.numero) === Number(n)
            );
          let numeroFiole = Number(cible.numero);
          // Bornée : au-delà de quelques courses d'avance, on s'arrête là. On
          // saute aussi les courses déjà servies, pour ne pas en doubler une
          // en cherchant à en épargner une autre.
          const occupee = (n) => tuyauPose(n) || !!fioleDeCourse(n);
          for (let saut = 0; saut < 8 && occupee(numeroFiole); saut++)
            numeroFiole += 1;
          setFioles((prev) => [
            ...(prev || []),
            { joueurId: joueurActuel.id, numero: numeroFiole, chevalId: null }
          ]);
          annoncerSalle([carte.phraseAnim]);
          alert(
            `Fiole versée pour la course n°${numeroFiole}.\n\n` +
              "Allez miser chez le bookmaker : elle s'appliquera au cheval que " +
              "vous choisirez. La carte partira une fois la course courue."
          );
          setSousMenuBanque("accueil");
        };

        // Le bouton de la fiole a trois choses à dire : elle est versée, la
        // course est déjà servie par quelqu'un d'autre, ou elle est libre. Le
        // deuxième cas grise le bouton et dit pourquoi — le joueur ne se
        // demande pas si sa carte est cassée.
        const boutonDeLaFiole = (carte) => {
          const mienne = fioleDe(joueurActuel && joueurActuel.id);
          const cible = mienne ? null : courseAParier();
          const prise = cible ? fioleDeCourse(cible.numero) : null;
          const bloquee = !!prise;
          const libelle = mienne
            ? `🌿 Versée — course n°${mienne.numero}`
            : prise
              ? `🌿 Course n°${cible.numero} déjà servie`
              : "🌿 Verser la fiole";
          return (
            <div>
              <button
                onClick={() => verserLesHerbes(carte)}
                disabled={bloquee}
                style={{
                  padding: "8px",
                  background: bloquee ? "#555" : "#558B2F",
                  color: bloquee ? "#999" : "#fff",
                  border: "none",
                  borderRadius: "4px",
                  cursor: bloquee ? "not-allowed" : "pointer",
                  fontWeight: "bold",
                  width: "100%"
                }}
              >
                {libelle}
              </button>
              {bloquee && (
                <div
                  style={{
                    marginTop: "6px",
                    fontSize: "0.8rem",
                    color: "#AED581",
                    lineHeight: 1.35
                  }}
                >
                  Une seule fiole par course. Gardez la vôtre : elle ne se
                  consomme pas, et vous pourrez la verser sur la prochaine.
                </div>
              )}
            </div>
          );
        };

        // Qui paie quoi. Le fonds d'investissement se dépense en premier,
        // le solde complète : une mise de 100 $ sur un fonds de 70 $ prend
        // les 70 $ du fonds et 30 $ sur le compte. Refuser tout, comme avant,
        // laissait le joueur croire qu'il n'avait pas assez alors que son
        // compte était plein.
        const partageDuPaiement = (joueur, montant, surLeFonds) => {
          const m = Math.max(0, Math.round(nombreSur(montant, 0)));
          const fonds = Math.max(0, nombreSur((joueur || {}).fondsDispo, 0));
          const surFonds = surLeFonds ? Math.min(m, fonds) : 0;
          const surSolde = m - surFonds;
          const solde = Math.max(0, nombreSur((joueur || {}).solde, 0));
          return {
            surFonds,
            surSolde,
            manque: Math.max(0, surSolde - solde),
            // De quoi écrire une ligne d'historique juste.
            mention:
              surFonds > 0 && surSolde > 0
                ? ` — ${surFonds}$ du fonds, ${surSolde}$ du solde`
                : surFonds > 0
                  ? " — payé sur le fonds"
                  : ""
          };
        };

        const refusDePaiement = (joueur, part) =>
          part.surFonds > 0
            ? `Il manque ${part.manque}$.\n\n` +
              `Le fonds couvre ${part.surFonds}$, et le solde de ${joueur.nom} ` +
              `n'a que ${Math.max(0, nombreSur(joueur.solde, 0))}$.`
            : `Solde insuffisant : il manque ${part.manque}$.`;

        // La case « payer sur le fonds », proposée au financier dès que le
        // joueur choisi en a un d'ouvert. Elle se décoche dès qu'on change de
        // joueur : un fonds ne se prête pas.
        const caseFonds = (joueurId) => {
          const j = joueurs.find((x) => x.id === joueurId);
          const dispo = nombreSur((j || {}).fondsDispo, 0);
          if (!j || dispo <= 0) return null;
          return (
            <label
              style={{
                display: "flex",
                alignItems: "center",
                gap: "8px",
                background: "#00352e",
                border: "1px solid #00695C",
                borderRadius: "8px",
                padding: "10px 12px",
                margin: "4px 0 10px",
                fontSize: "0.9rem",
                color: "#80CBC4"
              }}
            >
              <input
                type="checkbox"
                checked={bkSurLeFonds}
                onChange={(e) => setBkSurLeFonds(e.target.checked)}
              />
              📈 Payer sur le fonds d'investissement de {j.nom} —{" "}
              <strong>{dispo}$ disponibles</strong>. Au-delà, la différence est
              prise sur son solde.
            </label>
          );
        };

        // ================= LE PICKPOCKET =================
        // On désigne une victime, pas une carte : le tirage décide de ce qui
        // change de mains, et le voleur ne le découvre qu'après coup. Les deux
        // cartes arrivent avec leur temps de garde à purger, comme si on
        // venait de les ramasser.
        /*
         * Une carte activée ne se vole pas : son effet est déjà en route, et
         * le voleur n'a plus rien à prendre. Cinq cartes restent en main une
         * fois jouées, et sont donc à l'abri :
         *
         *   Le Veinard, la Fontaine et l'Assurance une fois armés ;
         *   les herbes une fois la fiole versée.
         *
         * Les autres se consomment à l'activation — le paradis fiscal, le
         * contrôle fiscal, le délit d'initié, le fonds, les versements — donc
         * elles ne sont plus là pour être prises.
         *
         * Le garde du corps en poste est l'exception volontaire : il n'est
         * pas écarté ici, alors qu'il est bel et bien intouchable. C'est
         * qu'il se défend tout seul — il repousse le voleur et lui coûte son
         * coup. L'écarter ferait disparaître de la liste un joueur qui n'a
         * que lui en main, et trahirait justement ce qu'on veut cacher : qui
         * est gardé.
         */
        const carteActivee = (joueur, carte) => {
          const id = (carte || {}).id;
          if (id === "veinard") return !!joueur.veinardActif;
          if (id === "fontaine_jouvence") return !!joueur.fontaineActive;
          if (id === "assurance") return !!joueur.assuranceActive;
          if (id === "herbes_medicinales") return !!fioleDe(joueur.id);
          return false;
        };

        const cartesVolables = (joueur) =>
          ((joueur || {}).deck || []).filter((c) => !carteActivee(joueur, c));

        // Ceux qu'on peut détrousser : encore dans la salle, et quelque
        // chose de prenable en poche. On ne détrousse pas quelqu'un parti au paradis
        // fiscal — il n'est plus là, même règle que le contrôle fiscal. Un
        // joueur protégé par un garde du corps reste dans la liste : le
        // voleur ne doit pas savoir qui est gardé, c'est tout l'intérêt — il
        // perd son coup en le découvrant.
        const ciblesPickpocket = () =>
          joueursActifs.filter(
            (j) =>
              joueurActuel &&
              j.id !== joueurActuel.id &&
              !j.paradisActif &&
              cartesVolables(j).length > 0
          );

        // On ouvre l'écran de choix plutôt qu'une boîte du navigateur : la
        // liste tenait dans un prompt système, hors du thème, et ne disait
        // pas combien de cartes chacun avait en poche.
        const ouvrirLesPoches = (carte) => {
          if (bloqueParJetons(joueurActuel)) {
            alert(MESSAGE_JETONS_EN_JEU);
            return;
          }
          if (!ciblesPickpocket().length) {
            alert(
              "Personne n'a de carte en main pour l'instant.\n\n" +
                "Gardez la vôtre : elle ne se consomme pas."
            );
            return;
          }
          setCarteVol(carte);
          setSousMenuBanque("pickpocket");
        };

        const detrousser = (carte, cibleId) => {
          if (bloqueParJetons(joueurActuel)) {
            alert(MESSAGE_JETONS_EN_JEU);
            return;
          }
          // La liste a pu bouger pendant qu'on choisissait : quelqu'un s'est
          // mis à l'abri, ou s'est fait vider les poches avant nous.
          const choix = ciblesPickpocket().find((j) => j.id === cibleId);
          if (!choix) {
            alert(
              "Cette poche n'est plus à portée.\n\n" +
                "Votre carte vous reste."
            );
            setSousMenuBanque("accueil");
            return;
          }
          // Le tirage se fait ici, une fois, et le résultat sert aux deux
          // decks : impossible qu'ils divergent. Il ne porte que sur les
          // cartes prenables : celles qui sont déjà en train d'agir restent
          // à leur propriétaire.
          const prenables = cartesVolables(choix);
          const volee = prenables[Math.floor(Math.random() * prenables.length)];
          if (!volee) {
            alert(
              `${choix.nom} n'a plus rien de prenable en poche.\n\n` +
                "Votre carte vous reste."
            );
            return;
          }
          const maintenantLa = Date.now();

          // Un garde du corps en poste renvoie le voleur d'où il vient. La
          // carte lui reste en main, mais son temps de garde repart à zéro :
          // il faudra patienter avant de retenter le coup.
          if (choix.gardeDuCorpsActif) {
            setJoueurs((prev) =>
              prev.map((j) => {
                if (j.id === joueurActuel.id)
                  return {
                    ...j,
                    deck: j.deck.map((x) =>
                      x.id === carte.id ? { ...x, recuLe: maintenantLa } : x
                    ),
                    historique: [
                      `Pickpocket sur ${choix.nom} : un garde du corps vous a repoussé`,
                      ...j.historique
                    ]
                  };
                if (j.id === choix.id) {
                  const ligne =
                    "Votre garde du corps a repoussé un pickpocket";
                  return {
                    ...j,
                    historique: [ligne, ...j.historique],
                    avisBookmaker: [ligne, ...(j.avisBookmaker || [])]
                  };
                }
                return j;
              })
            );
            alert(
              `${choix.nom} a un garde du corps : vous vous êtes fait ` +
                "repousser.\n\n" +
                "Votre carte vous reste, mais il va falloir laisser passer le " +
                "temps de garde avant de retenter votre chance."
            );
            setSousMenuBanque("accueil");
            return;
          }
          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id === joueurActuel.id) {
                return {
                  ...j,
                  deck: [
                    ...j.deck.filter((x) => x.id !== carte.id),
                    { ...volee, recuLe: maintenantLa }
                  ],
                  historique: [
                    `Pickpocket sur ${choix.nom} : carte [${volee.nom}] dérobée`,
                    ...j.historique
                  ]
                };
              }
              if (j.id === choix.id) {
                // Une seule copie part, même si la victime en avait deux.
                let retiree = false;
                const restant = (j.deck || []).filter((x) => {
                  if (!retiree && x.id === volee.id) {
                    retiree = true;
                    return false;
                  }
                  return true;
                });
                const ligne = `On vous a fait les poches : carte [${volee.nom}] dérobée`;
                return {
                  ...j,
                  deck: [...restant, { ...carte, recuLe: maintenantLa }],
                  // La victime n'est pas devant sa borne : l'avis l'attend.
                  historique: [ligne, ...j.historique],
                  avisBookmaker: [
                    `${ligne} — le Pickpocket est passé dans votre main.`,
                    ...(j.avisBookmaker || [])
                  ]
                  // Rien à désarmer ici : une carte en train d'agir n'est
                  // jamais tirée, cartesVolables l'a écartée en amont.
                };
              }
              return j;
            })
          );
          // La salle apprend qu'une poche a été vidée, sans savoir laquelle.
          annoncerSalle([carte.phraseAnim]);
          alert(
            `Vous avez dérobé [${volee.nom}] à ${choix.nom}.\n\n` +
              "Elle arrive dans votre deck avec son temps de garde à purger.\n" +
              "Le Pickpocket, lui, est passé dans sa poche."
          );
          setSousMenuBanque("accueil");
        };

        const courseAParier = () => {
          // En simulation, tant que le bookmaker n'a rien préparé, il n'y a
          // aucune course « active » — et les cartes qui en dépendent, le
          // délit d'initié et les herbes, refusaient de se jouer. Or le
          // vainqueur ne dépend que du numéro de la course : on peut donc
          // viser celle qui sera préparée ensuite, sans rien attendre.
          if (!course.active || !course.numero) {
            if (!configBookmaker.modeSimulation) return null;
            const numeroAVenir = prochainNumeroManuel();
            const chevalAVenir = chevalGagnant(numeroAVenir);
            if (!chevalAVenir) return null;
            return { numero: numeroAVenir, cheval: chevalAVenir, depart: null };
          }
          const ouvert = course.parisOuverts;
          const numero = ouvert ? course.numero : course.numero + 1;
          const gagnant = chevalGagnant(numero);
          if (!gagnant) return null;
          // L'heure du départ, quand elle est connue : celle de la course en
          // cours, ou celle-là plus un intervalle si l'on donne la suivante.
          // En simulation, une course préparée n'a pas encore d'heure — c'est
          // le bookmaker qui donne le top quand il veut.
          const intervalle =
            nombreSur(configBookmaker.courseIntervalleMin, 30) * 60000;
          const depart = !course.depart
            ? null
            : ouvert
              ? course.depart
              : course.depart + intervalle;
          return { numero, cheval: gagnant, depart };
        };

        const majuscule = (t) => t.charAt(0).toUpperCase() + t.slice(1);

        // « dans 12 min », « dans 45 s », ou l'aveu qu'on n'en sait rien.
        const delaiAvantDepart = (depart) => {
          if (!depart) return "le bookmaker donne le top quand il veut";
          const reste = depart - maintenant;
          if (reste <= 0) return "c'est parti !";
          if (reste < 60000) return `départ dans ${Math.ceil(reste / 1000)} s`;
          return `départ dans ${Math.ceil(reste / 60000)} min`;
        };

        // Lance une course tout de suite, sans attendre l'horaire. Le top
        // départ est conservé pour que l'écran de la salle ait le temps
        // d'afficher le décompte et que les paris se ferment proprement.
        // En deux temps : on prépare la course — les paris s'ouvrent et rien
        // ne part —, puis on donne le top quand tout le monde a misé. Une
        // fenêtre minutée aurait obligé à courir après le chronomètre.
        // Le numéro qu'aura la prochaine course lancée à la main. Il ne
        // dépend que de la précédente, donc on peut le connaître avant même
        // qu'elle soit préparée — et c'est ce qui permet de jouer les cartes
        // liées aux courses en simulation, sans rien avoir lancé.
        const prochainNumeroManuel = () =>
          Math.max(1, (courseManuelle ? nombreSur(courseManuelle.numero, 0) : 0) + 1);

        const preparerCourse = () => {
          // On numérote à partir de 1, comme les courses à l'horaire. Aucun
          // risque de confusion : le lancement à la main n'existe qu'en
          // simulation, et la simulation ne programme aucune course.
          setCourseManuelle({ numero: prochainNumeroManuel(), depart: null });
        };

        const donnerLeTopDepart = () => {
          if (!courseManuelle) return;
          const top = nombreSur(configBookmaker.courseTopDepartSec, 15) * 1000;
          setCourseManuelle({ ...courseManuelle, depart: Date.now() + top });
        };

        // Repartir à la course n°1 sans toucher au reste de la partie.
        const remettreLeCompteurDeCourses = () => {
          if (
            !window.confirm(
              "Repartir à la course n°1 ?\n\n" +
                "La course en cours ou préparée est annulée, et les tuyaux " +
                "des délits d'initié avec elle. Les paris déjà réglés et le " +
                "reste de la partie ne bougent pas."
            )
          )
            return;
          setCourseManuelle(null);
          setFioles([]);
          // Les tuyaux désignent des courses qui n'existeront plus : gardés,
          // ils réapparaîtraient au joueur dès que la numérotation les
          // rattraperait.
          setJoueurs((prev) =>
            prev.map((j) => (j.tuyau ? { ...j, tuyau: null } : j))
          );
        };

        // L'autre ordre : une fiole versée AVANT qu'un délit d'initié ne
        // soit lu. Le tuyau est alors calculé sans les herbes — elles n'ont
        // pas encore de cheval — et la fiole ne se rattache qu'au moment où
        // son porteur mise. Le tuyau, lui, est déjà figé sur un nom.
        // Plutôt que de le laisser mentir, on lui rend sa carte : il ne saura
        // jamais ni pourquoi, ni qui.
        const rendreLesTuyauxSouffles = (numero, chevalHerbes, porteurFiole) => {
          const index = chevauxCourse.findIndex(
            (c) => String(c.id) === String(chevalHerbes)
          );
          if (index < 0) return;
          const gagnantDe = (herbes) =>
            (chevauxCourse[
              trameCourse(numero, chevauxCourse, configBookmaker, herbes).gagnant
            ] || {}).nom;
          const avant = gagnantDe(null);
          const apres = gagnantDe({
            index,
            pct: Math.max(0, nombreSur(configGlobale.herbesPctPremier, 20))
          });
          // Les herbes n'ont rien changé au vainqueur : tous les tuyaux
          // tiennent encore.
          if (!apres || avant === apres) return;
          const modele = cartesJeu.find((c) => c.id === "delit_initie");
          const rendue = Date.now();
          setJoueurs((prev) =>
            prev.map((j) => {
              const souffle =
                j.id !== porteurFiole &&
                j.tuyau &&
                Number(j.tuyau.numero) === Number(numero) &&
                j.tuyau.cheval !== apres;
              if (!souffle) return j;
              const ligne =
                `Tuyau soufflé sur la course n°${numero} : votre informateur ` +
                "s'est trompé";
              return {
                ...j,
                tuyau: null,
                deck: modele
                  ? [...(j.deck || []), { ...modele, recuLe: rendue }]
                  : j.deck,
                historique: [
                  `${ligne} — carte [${modele ? modele.nom : "Délit d'initié"}] rendue`,
                  ...j.historique
                ],
                // Il n'est pas devant sa borne : l'avis l'y attend.
                avisBookmaker: [
                  `${ligne}.\n\nVotre carte vous est rendue : elle repart avec ` +
                    "son temps de garde à purger.",
                  ...(j.avisBookmaker || [])
                ]
              };
            })
          );
        };

        const placerPariCourse = (joueurId, chevalId, mise, surLeFonds) => {
          const joueur = joueurs.find((j) => j.id === joueurId);
          const cheval = chevauxCourse.find(
            (c) => String(c.id) === String(chevalId)
          );
          if (!joueur || !cheval) {
            alert("Sélection incomplète.");
            return;
          }
          // Ce qui compte, c'est qu'une course soit là et ouverte aux paris.
          // En simulation il n'y a pas de soirée mais bien une course lancée à
          // la main : on doit pouvoir parier dessus pour l'essayer.
          if (!course.active) {
            alert("Aucune course n'est programmée pour l'instant.");
            return;
          }
          if (!course.parisOuverts) {
            alert("Les paris sont fermés : la course est imminente ou en cours.");
            return;
          }
          const m = Number(mise);
          if (!(m > 0)) {
            alert("Montant invalide.");
            return;
          }
          const plafond = nombreSur(configBookmaker.courseMisePlafond, 100);
          if (m > plafond) {
            alert(`La mise ne peut pas dépasser ${plafond} par pari.`);
            return;
          }
          const part = partageDuPaiement(joueur, m, surLeFonds);
          if (part.manque > 0) {
            alert(refusDePaiement(joueur, part));
            return;
          }
          const bareme = rapportsCourse(configBookmaker);
          const cote = bareme[0] || 0;
          setParisCourse((prev) => [
            ...prev,
            {
              id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
              numero: course.numero,
              joueurId,
              chevalId: cheval.id,
              mise: m,
              cote,
              // On fige le barème sur le pari : celui qui a misé sous un
              // barème ne doit pas être payé sous un autre.
              rapports: bareme,
              statut: "ouvert",
              ts: Date.now()
            }
          ]);
          // La fiole d'herbes attendait un cheval : c'est celui-ci. Elle ne
          // s'attache qu'au premier pari de son porteur sur cette course.
          const saFiole = (fioles || []).some(
            (f) =>
              f.joueurId === joueurId &&
              !f.chevalId &&
              Number(f.numero) === Number(course.numero)
          );
          if (saFiole) {
            setFioles((prev) =>
              (prev || []).map((f) =>
                f.joueurId === joueurId &&
                !f.chevalId &&
                Number(f.numero) === Number(course.numero)
                  ? { ...f, chevalId: cheval.id }
                  : f
              )
            );
            rendreLesTuyauxSouffles(course.numero, cheval.id, joueurId);
          }

          setJoueurs((prev) =>
            prev.map((j) =>
              j.id === joueurId
                ? {
                    ...j,
                    solde: Math.max(0, j.solde - part.surSolde),
                    fondsDispo: Math.max(
                      0,
                      nombreSur(j.fondsDispo, 0) - part.surFonds
                    ),
                    historique: [
                      `Pari course n°${course.numero} : ${m}$ sur ${cheval.nom} (cote ${cote})` +
                        part.mention +
                        (saFiole ? " — vos herbes sont pour lui" : ""),
                      ...j.historique
                    ]
                  }
                : j
            )
          );
          alert(
            `Pari enregistré : ${joueur.nom}, ${m}$ sur ${cheval.nom}\n` +
              `Course n°${course.numero} — ` +
              bareme
                .map((r, i) => `${i + 1}${i ? "e" : "er"} : ${Math.round(m * r)}$`)
                .join(", ")
          );
        };

        // Règle les paris d'une course terminée. Un seul appareil s'en charge
        // — celui du bookmaker — sinon deux écrans paieraient le même gain.
        const reglerCourse = React.useCallback(
          (numero) => {
            const aRegler = parisCourse.filter(
              (p) => p.numero === numero && p.statut === "ouvert"
            );
            if (!aRegler.length) return;
            const gagnant = chevalGagnant(numero);
            if (!gagnant) return;
            // Toutes les places paient, pas seulement la première.
            const arrivee = ordreArrivee(
              numero,
              chevauxCourse,
              configBookmaker,
              herbesDe(numero)
            );
            const placeDe = (chevalId) =>
              arrivee.findIndex((c) => String(c.id) === String(chevalId));

            const gains = {};
            const pertes = {};
            const lignes = {};
            const gagnantsSalle = new Set();
            // La salle veut savoir combien, pas seulement qui.
            aRegler.forEach((p) => {
              const place = placeDe(p.chevalId);
              // Le barème figé au moment du pari fait foi.
              const bareme = Array.isArray(p.rapports) && p.rapports.length
                ? p.rapports
                : rapportsCourse(configBookmaker);
              const rapport =
                place >= 0 && place < bareme.length
                  ? nombreSur(bareme[place], 0)
                  : 0;
              const gain = Math.round(nombreSur(p.mise, 0) * rapport);
              const cheval = arrivee[place];
              const rang = place + 1;
              if (gain > 0) gains[p.joueurId] = (gains[p.joueurId] || 0) + gain;
              // Ce que la mise n'a pas rendu : c'est là-dessus que
              // l'assurance travaille.
              const perte = Math.max(0, nombreSur(p.mise, 0) - gain);
              if (perte > 0)
                pertes[p.joueurId] = (pertes[p.joueurId] || 0) + perte;
              lignes[p.joueurId] = [
                gain > 0
                  ? `Course n°${numero} : ${(cheval || {}).nom || "?"} ${rang}${rang === 1 ? "er" : "e"} (×${rapport}) : +${gain}$`
                  : `Course n°${numero} : ${(cheval || {}).nom || "?"} ${rang}${rang === 1 ? "er" : "e"}, rien : −${p.mise}$`,
                ...(lignes[p.joueurId] || [])
              ];
              if (gain > 0) gagnantsSalle.add(p.joueurId);
            });

            const ids = new Set(aRegler.map((p) => p.id));
            setParisCourse((prev) =>
              prev.map((p) =>
                ids.has(p.id)
                  ? {
                      ...p,
                      statut:
                        rapportPourRang(
                          configBookmaker,
                          arrivee.findIndex(
                            (c) => String(c.id) === String(p.chevalId)
                          )
                        ) > 0
                          ? "gagne"
                          : "perdu",
                      regleTs: Date.now()
                    }
                  : p
              )
            );
            setJoueurs((prev) =>
              prev.map((j) => {
                const gain = gains[j.id] || 0;
                const rembourse = rembourserAssurance(j, pertes[j.id] || 0);
                const l = [...(lignes[j.id] || [])];
                if (rembourse) l.unshift(rembourse.ligne);
                if (!gain && !l.length && !rembourse) return j;
                return {
                  ...j,
                  solde: j.solde + gain + (rembourse ? rembourse.montant : 0),
                  assuranceActive: rembourse ? false : j.assuranceActive,
                  historique: [...l, ...j.historique],
                  avisBookmaker: [...l, ...(j.avisBookmaker || [])]
                };
              })
            );
            annoncerSalle(
              [...gagnantsSalle].map((id) => {
                const j = joueurs.find((x) => x.id === id);
                return `🏇 ${(j || {}).nom || "Un joueur"} touche ${gains[id] || 0}$ sur la course n°${numero}`;
              })
            );
          },
          [parisCourse, chevauxCourse, configBookmaker, setParisCourse, setJoueurs, joueurs, annoncerSalle]
        );

        // ================= INVESTISSEMENTS =================
        // En simulation on montre tous les projets, sans attendre que leur
        // bloc de 45 min arrive : c'est tout l'intérêt d'un mode d'essai.
        const projetsDuBloc = configBookmaker.modeSimulation
          ? configBookmaker.projets || []
          : (configBookmaker.projets || []).filter(
              (pr) => Number(pr.bloc) === Number(blocInvest)
            );

        const instanceProjet = (projetId) => {
          const memeProjet = investissements.filter(
            (i) => String(i.projetId) === String(projetId)
          );
          if (configBookmaker.modeSimulation) {
            // Hors des blocs : on suit celui qui est ouvert, sinon le dernier.
            return (
              memeProjet.find((i) => i.statut === "ouvert") ||
              memeProjet[memeProjet.length - 1]
            );
          }
          return memeProjet.find((i) => Number(i.bloc) === Number(blocInvest));
        };

        const totalInvesti = (inst) =>
          (inst && inst.investisseurs ? inst.investisseurs : []).reduce(
            (t, x) => t + nombreSur(x.montant, 0),
            0
          );

        // Navigation d'un projet à l'autre : le bookmaker fait défiler ce que
        // la vitrine présente, sans repasser par la liste.
        const indexProjetPresente = () =>
          projetsDuBloc.findIndex(
            (pr) => String(pr.id) === String(vitrine.projetId)
          );

        const presenterProjetVoisin = (pas) => {
          if (!projetsDuBloc.length) return;
          const courant = indexProjetPresente();
          const i =
            courant < 0
              ? 0
              : (courant + pas + projetsDuBloc.length) % projetsDuBloc.length;
          setVitrine({
            mode: "projet",
            projetId: projetsDuBloc[i].id,
            placeRang: null
          });
        };

        // Le joueur prend une place précise : la mise et le bénéfice de
        // cette place sont fixés d'avance, il ne reste qu'à savoir laquelle
        // il veut — et si elle est libre.
        const investir = (joueurId, projetId, rang, surLeFonds) => {
          const projet = (configBookmaker.projets || []).find(
            (pr) => String(pr.id) === String(projetId)
          );
          const joueur = joueurs.find((j) => j.id === joueurId);
          // Attention à la chaîne vide : Number("") vaut 0, et l'on
          // inscrirait quelqu'un en première place sans qu'il l'ait
          // demandé. Aucune place choisie, aucun investissement.
          const r = rang === "" || rang === null || rang === undefined
            ? NaN
            : Number(rang);
          if (!projet || !joueur || !Number.isFinite(r)) {
            alert(
              !projet || !joueur
                ? "Sélection incomplète."
                : "Choisissez la place que le joueur veut prendre."
            );
            return;
          }
          const places = placesProjet(projet);
          const place = places[r];
          if (!place) {
            alert("Cette place n'existe pas sur ce projet.");
            return;
          }
          const m = place.mise;
          const part = partageDuPaiement(joueur, m, surLeFonds);
          if (part.manque > 0) {
            alert(refusDePaiement(joueur, part));
            return;
          }
          const inst = instanceProjet(projetId);
          if (inst && inst.statut !== "ouvert") {
            alert("Ce projet est clos.");
            return;
          }
          const dejaLa = inst
            ? (inst.investisseurs || []).some((x) => x.joueurId === joueurId)
            : false;
          if (dejaLa) {
            alert(`${joueur.nom} a déjà investi dans ce projet.`);
            return;
          }
          const pris = rangsPris(inst);
          if (pris[r]) {
            const autre = joueurs.find((j) => j.id === pris[r].joueurId);
            alert(
              `La place de ${libelleRang(r)} investisseur est déjà prise` +
                (autre ? ` par ${autre.nom}` : "") +
                "."
            );
            return;
          }
          const entree = { joueurId, montant: m, rang: r, ts: Date.now() };
          if (inst) {
            setInvestissements((prev) =>
              prev.map((i) =>
                i.id === inst.id
                  ? { ...i, investisseurs: [...(i.investisseurs || []), entree] }
                  : i
              )
            );
          } else {
            // Le délai ne court qu'à partir du premier investisseur.
            setInvestissements((prev) => [
              ...prev,
              {
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                projetId: projet.id,
                bloc: blocInvest,
                premierTs: Date.now(),
                statut: "ouvert",
                investisseurs: [entree]
              }
            ]);
          }
          setJoueurs((prev) =>
            prev.map((j) =>
              j.id === joueurId
                ? {
                    ...j,
                    solde: Math.max(0, j.solde - part.surSolde),
                    fondsDispo: Math.max(
                      0,
                      nombreSur(j.fondsDispo, 0) - part.surFonds
                    ),
                    historique: [
                      `Investissement ${m}$${part.mention} dans « ${projet.titre} » — place de ` +
                        `${libelleRang(r)} investisseur (+${place.gain} % si ça réussit)`,
                      ...j.historique
                    ]
                  }
                : j
            )
          );
          alert(
            `${joueur.nom} prend la place de ${libelleRang(r)} investisseur ` +
              `dans « ${projet.titre} » : ${m}$ misés, +${place.gain} % si ça réussit.`
          );
        };

        // Solde un projet : réussite, échec, remboursement. Comme pour la
        // course, un seul appareil s'en charge.
        const reglerProjet = React.useCallback(
          (inst, projet, reussi) => {
            const gains = projet.gains || [];
            const remb = nombreSur(projet.remboursement, 0);
            const mouvements = {};
            const lignes = {};
            const assures = new Set();
            (inst.investisseurs || []).forEach((x, i) => {
              // Le rang n'est plus l'ordre d'arrivée : c'est la place que le
              // joueur a choisie, et c'est elle qui décide du bénéfice.
              const rang = rangEntree(x, i);
              const mise = nombreSur(x.montant, 0);
              if (reussi) {
                const pct = nombreSur(gains[rang], 0);
                const total = mise + Math.round((mise * pct) / 100);
                mouvements[x.joueurId] = (mouvements[x.joueurId] || 0) + total;
                lignes[x.joueurId] = [
                  `« ${projet.titre} » a réussi — ${libelleRang(rang)} investisseur, ` +
                    `+${pct} % sur ${mise}$ : +${total}$`,
                  ...(lignes[x.joueurId] || [])
                ];
              } else {
                const rendu = Math.round((mise * remb) / 100);
                if (rendu > 0)
                  mouvements[x.joueurId] = (mouvements[x.joueurId] || 0) + rendu;
                // Ce qui n'est pas revenu est une perte chez le financier :
                // l'assurance la couvre.
                const joueurPerdant = joueurs.find((y) => y.id === x.joueurId);
                const couvert = rembourserAssurance(
                  joueurPerdant,
                  Math.max(0, mise - rendu)
                );
                if (couvert) {
                  mouvements[x.joueurId] =
                    (mouvements[x.joueurId] || 0) + couvert.montant;
                  assures.add(x.joueurId);
                  lignes[x.joueurId] = [
                    couvert.ligne,
                    ...(lignes[x.joueurId] || [])
                  ];
                }
                lignes[x.joueurId] = [
                  remb > 0
                    ? `« ${projet.titre} » a échoué — ${remb} % remboursés : +${rendu}$`
                    : `« ${projet.titre} » a échoué — mise perdue : −${mise}$`,
                  ...(lignes[x.joueurId] || [])
                ];
              }
            });

            setInvestissements((prev) =>
              prev.map((i) =>
                i.id === inst.id
                  ? { ...i, statut: reussi ? "reussi" : "echoue", regleTs: Date.now() }
                  : i
              )
            );
            setJoueurs((prev) =>
              prev.map((j) => {
                const gain = mouvements[j.id] || 0;
                const l = lignes[j.id];
                if (!gain && !l) return j;
                return {
                  ...j,
                  solde: j.solde + gain,
                  assuranceActive: assures.has(j.id) ? false : j.assuranceActive,
                  historique: [...(l || []), ...j.historique],
                  avisBookmaker: [...(l || []), ...(j.avisBookmaker || [])]
