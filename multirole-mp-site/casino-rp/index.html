                                    border: "none",
                                    borderRadius: "5px",
                                    cursor: "pointer",
                                    fontSize: "0.8rem"
                                  }}
                                >
                                  ✅ Forcer la réussite
                                </button>
                                <button
                                  onClick={() => reglerProjet(inst, pr, false)}
                                  style={{
                                    padding: "6px 10px",
                                    background: "#7f1d1d",
                                    color: "#fff",
                                    border: "none",
                                    borderRadius: "5px",
                                    cursor: "pointer",
                                    fontSize: "0.8rem"
                                  }}
                                >
                                  ❌ Forcer l'échec
                                </button>
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}

                  <label>L'investisseur</label>
                  <select
                    value={bkInvJoueurId}
                    onChange={(e) => {
                      setBkInvJoueurId(e.target.value);
                      setBkSurLeFonds(false);
                    }}
                    style={champ}
                  >
                    <option value="">-- Choisir --</option>
                    {joueurs.map((j) => (
                      <option key={j.id} value={j.id}>
                        {j.nom} ({j.solde}$)
                      </option>
                    ))}
                  </select>

                  <label>Le projet</label>
                  <select
                    value={bkInvProjetId}
                    onChange={(e) => {
                      setBkInvProjetId(e.target.value);
                      // Changer de projet remet le choix à zéro : la place
                      // n°2 d'un projet n'est pas celle d'un autre.
                      setBkInvRang("");
                      // Le joueur est en face : ce que le bookmaker regarde,
                      // la vitrine le montre. Sans ça il faut penser à
                      // cliquer « Présenter ce projet » à chaque fois.
                      if (e.target.value)
                        setVitrine({
                          mode: "projet",
                          projetId: e.target.value,
                          placeRang: null
                        });
                    }}
                    style={champ}
                  >
                    <option value="">-- Choisir --</option>
                    {projetsDuBloc.map((pr) => (
                      <option key={pr.id} value={pr.id}>
                        {pr.titre}
                      </option>
                    ))}
                  </select>

                  {/* La mise n'est plus libre : le joueur choisit sa place,
                      et la place dit ce qu'elle coûte et ce qu'elle
                      rapporte. Celles qui sont prises ne se cliquent pas. */}
                  <label>La place</label>
                  {(() => {
                    const projetChoisi = projetsDuBloc.find(
                      (pr) => String(pr.id) === String(bkInvProjetId)
                    );
                    if (!projetChoisi)
                      return (
                        <p style={{ color: "#888", margin: "4px 0 10px" }}>
                          Choisissez d'abord un projet.
                        </p>
                      );
                    const instChoisi = instanceProjet(projetChoisi.id);
                    const pris = rangsPris(instChoisi);
                    const investisseur = joueurs.find(
                      (j) => j.id === bkInvJoueurId
                    );
                    return (
                      <div
                        style={{
                          display: "flex",
                          gap: "8px",
                          flexWrap: "wrap",
                          margin: "4px 0 12px"
                        }}
                      >
                        {placesProjet(projetChoisi).map((pl) => {
                          const occupe = pris[pl.rang];
                          const nomOccupant = occupe
                            ? (
                                joueurs.find((j) => j.id === occupe.joueurId) ||
                                {}
                              ).nom || "quelqu'un"
                            : null;
                          const tropCher =
                            investisseur && investisseur.solde < pl.mise;
                          const choisie = String(bkInvRang) === String(pl.rang);
                          return (
                            <button
                              key={pl.rang}
                              onClick={() => {
                                setBkInvRang(String(pl.rang));
                                // Et la vitrine désigne la même place : le
                                // joueur voit celle dont on lui parle.
                                setVitrine({
                                  mode: "projet",
                                  projetId: projetChoisi.id,
                                  placeRang: pl.rang
                                });
                              }}
                              disabled={!!occupe}
                              style={{
                                background: occupe
                                  ? "#2a2a2a"
                                  : choisie
                                    ? "#6A1B9A"
                                    : "#1a1a1a",
                                color: occupe ? "#777" : "#fff",
                                border: `2px solid ${
                                  choisie
                                    ? "#CE93D8"
                                    : occupe
                                      ? "#333"
                                      : tropCher
                                        ? "#7f1d1d"
                                        : "#4A148C"
                                }`,
                                borderRadius: "10px",
                                padding: "10px 14px",
                                minWidth: "130px",
                                textAlign: "center",
                                cursor: occupe ? "not-allowed" : "pointer"
                              }}
                            >
                              <div style={{ fontSize: "0.78rem", color: "#bbb" }}>
                                {libelleRang(pl.rang)} investisseur
                              </div>
                              <div
                                style={{ fontSize: "1.2rem", fontWeight: "bold" }}
                              >
                                {pl.mise}$
                              </div>
                              <div
                                style={{ fontSize: "0.85rem", color: "#81C784" }}
                              >
                                +{pl.gain} %
                              </div>
                              {occupe ? (
                                <div style={{ fontSize: "0.72rem" }}>
                                  prise — {nomOccupant}
                                </div>
                              ) : tropCher ? (
                                <div
                                  style={{ fontSize: "0.72rem", color: "#EF5350" }}
                                >
                                  solde insuffisant
                                </div>
                              ) : null}
                            </button>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {caseFonds(bkInvJoueurId)}

                  <button
                    onClick={() => {
                      investir(
                        bkInvJoueurId,
                        bkInvProjetId,
                        bkInvRang,
                        bkSurLeFonds
                      );
                      setBkInvRang("");
                      setBkSurLeFonds(false);
                      // La place devient « prise » : plus rien à désigner,
                      // mais le projet reste à l'écran pour le suivant.
                      if (bkInvProjetId)
                        setVitrine({
                          mode: "projet",
                          projetId: bkInvProjetId,
                          placeRang: null
                        });
                    }}
                    className="checkbox-btn"
                    style={{ background: "#9C27B0" }}
                  >
                    ✓ Enregistrer l'investissement
                  </button>
                </div>
              )}
            </div>
          );
        }

        // --- VITRINE BOOKMAKER ---
        // L'écran retourné vers les joueurs. Il suit ce que le bookmaker
        // présente, et ne montre jamais les affaires des autres : ni mises,
        // ni soldes, ni paris déjà pris.
        if (interfaceActive === "vitrine") {
          const enCourse =
            course.active &&
            (course.phase === PHASES.COURSE || course.phase === PHASES.TOP);
          const projetPresente = (configBookmaker.projets || []).find(
            (pr) => String(pr.id) === String(vitrine.projetId)
          );
          const joueurPresente = joueurs.find((j) => j.id === vitrine.joueurId);

          const carte = {
            background: "#111",
            border: "2px solid #00838F",
            borderRadius: "16px",
            padding: "28px",
            maxWidth: "900px",
            margin: "0 auto"
          };

          return (
            <div style={{ padding: "26px", minHeight: "100vh" }}>
              <div
                style={{
                  position: "fixed",
                  top: "10px",
                  left: "10px",
                  zIndex: 40
                }}
              >
                {boutonPleinEcran(false)}
              </div>
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: "18px"
                }}
              >
                <h1 style={{ color: "#00838F", margin: 0 }}>🎩 Le Bookmaker</h1>
                <button
                  onClick={() => setInterfaceActive("menu")}
                  className="no-print"
                  style={{
                    padding: "6px 12px",
                    background: "#333",
                    color: "#777",
                    border: "none",
                    borderRadius: "6px",
                    cursor: "pointer",
                    fontSize: "0.75rem"
                  }}
                >
                  quitter
                </button>
              </div>

              {/* La course prend le dessus dès le top départ : c'est le moment
                  fort, tout le monde doit avoir les yeux dessus. */}
              {enCourse ? (
                <div style={carte}>
                  {course.phase === PHASES.TOP &&
                  course.avantDepart > DECOMPTE_SUR_PISTE ? (
                    <div style={{ textAlign: "center" }}>
                      <h2 style={{ color: "#FFC107" }}>🏇 Course n°{course.numero}</h2>
                      <div style={{ fontSize: "5rem", fontWeight: "bold" }}>
                        {Math.max(0, Math.ceil(course.avantDepart / 1000))}
                      </div>
                      <p style={{ color: "#aaa" }}>Les paris sont clos !</p>
                    </div>
                  ) : (
                    <>
                      <h2 style={{ color: "#FFC107", textAlign: "center" }}>
                        🏇 Course n°{course.numero}
                      </h2>
                      <div style={{ position: "relative" }}>
                        <PisteCourse
                          numero={course.numero}
                          chevaux={chevauxCourse}
                          cfg={configBookmaker}
                          herbes={herbesDe(course.numero)}
                          depart={course.depart}
                        />
                        {course.phase === PHASES.TOP && (
                          <div
                            style={{
                              position: "absolute",
                              inset: 0,
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "center",
                              pointerEvents: "none"
                            }}
                          >
                            <div
                              style={{
                                fontSize: "11rem",
                                fontWeight: "bold",
                                color: "#fff",
                                lineHeight: 1,
                                textShadow: "0 0 24px rgba(0,0,0,0.85)"
                              }}
                            >
                              {Math.max(0, Math.ceil(course.avantDepart / 1000))}
                            </div>
                          </div>
                        )}
                      </div>
                    </>
                  )}
                </div>
              ) : vitrine.mode === "projet" && projetPresente ? (
                (() => {
                  // Petites flèches en haut de la fiche, uniquement pour les
                  // projets : c'est le seul écran où il y a plusieurs choses
                  // à faire défiler.
                  const fleche = (pas, libelle) => (
                    <button
                      onClick={() => presenterProjetVoisin(pas)}
                      title={libelle}
                      style={{
                        background: "#1a1a1a",
                        border: "1px solid #00838F",
                        color: "#4DD0E1",
                        borderRadius: "6px",
                        padding: "2px 12px",
                        fontSize: "1.1rem",
                        lineHeight: 1.4,
                        cursor: "pointer"
                      }}
                    >
                      {pas < 0 ? "‹" : "›"}
                    </button>
                  );
                  const inst = instanceProjet(projetPresente.id);
                  const total = totalInvesti(inst);
                  const nb = inst ? (inst.investisseurs || []).length : 0;
                  const prisVitrine = rangsPris(inst);
                  return (
                    <div style={carte}>
                      {projetsDuBloc.length > 1 && (
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "flex-end",
                            gap: "8px",
                            marginBottom: "10px"
                          }}
                        >
                          {fleche(-1, "Projet précédent")}
                          <span style={{ color: "#888", fontSize: "0.9rem" }}>
                            Projet {Math.max(1, indexProjetPresente() + 1)} sur{" "}
                            {projetsDuBloc.length}
                          </span>
                          {fleche(1, "Projet suivant")}
                        </div>
                      )}
                      <h2 style={{ color: "#CE93D8", marginTop: 0 }}>
                        💼 {projetPresente.titre}
                      </h2>
                      <div style={{ fontSize: "1.15rem", lineHeight: 1.9 }}>
                        <div>
                          <strong>Montant à réunir :</strong>{" "}
                          {projetPresente.montantRequis}$ — déjà réuni : {total}$
                        </div>
                        <div>
                          <strong>Investisseurs :</strong> {nb} sur{" "}
                          {projetPresente.investisseursMax}
                        </div>
                        <div>
                          <strong>Délai :</strong> {projetPresente.delaiMin} min à
                          partir du premier investisseur
                          {inst && inst.statut === "ouvert" && (
                            <>
                              {" — reste "}
                              {Math.max(
                                0,
                                Math.ceil(
                                  (nombreSur(inst.premierTs, 0) +
                                    nombreSur(projetPresente.delaiMin, 30) * 60000 -
                                    maintenant) /
                                    60000
                                )
                              )}
                              {" min"}
                            </>
                          )}
                        </div>
                        <div>
                          <strong>Nature :</strong>{" "}
                          {projetPresente.type === "aleatoire"
                            ? `risquée — ${projetPresente.probabilite} % de réussite`
                            : "sûre — réussit dès les conditions réunies"}
                        </div>
                        <div>
                          <strong>En cas d'échec :</strong>{" "}
                          {nombreSur(projetPresente.remboursement, 0) > 0
                            ? `${projetPresente.remboursement} % remboursés`
                            : "mise perdue"}
                        </div>
                      </div>
                      <h3 style={{ color: "#CE93D8", marginTop: "22px" }}>
                        Les places — à vous de choisir la vôtre
                      </h3>
                      {/* La mise de chaque place est fixée : on montre ce
                          qu'elle coûte, ce qu'elle rapporte, et si elle est
                          encore libre. */}
                      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
                        {placesProjet(projetPresente).map((pl) => {
                          const occupe = prisVitrine[pl.rang];
                          // La place que le bookmaker vient de désigner sur
                          // son écran : c'est de celle-là qu'il parle.
                          const designee =
                            !occupe &&
                            vitrine.placeRang !== null &&
                            vitrine.placeRang !== undefined &&
                            Number(vitrine.placeRang) === pl.rang;
                          return (
                            <div
                              key={pl.rang}
                              style={{
                                background: occupe
                                  ? "#333"
                                  : designee
                                    ? "#2E7D32"
                                    : "#1B5E20",
                                padding: "14px 18px",
                                borderRadius: "10px",
                                minWidth: "140px",
                                textAlign: "center",
                                opacity: occupe ? 0.5 : 1,
                                border: `3px solid ${
                                  designee ? "#FFD54F" : "transparent"
                                }`,
                                boxShadow: designee
                                  ? "0 0 18px rgba(255,213,79,0.55)"
                                  : "none",
                                transform: designee ? "scale(1.06)" : "none",
                                transition:
                                  "transform 180ms, box-shadow 180ms, background 180ms"
                              }}
                            >
                              <div style={{ fontSize: "0.8rem", color: "#ddd" }}>
                                {libelleRang(pl.rang)} investisseur
                              </div>
                              <div
                                style={{
                                  fontSize: "1.5rem",
                                  fontWeight: "bold",
                                  margin: "4px 0"
                                }}
                              >
                                {pl.mise}$
                              </div>
                              <div style={{ fontSize: "1.15rem", color: "#A5D6A7" }}>
                                +{pl.gain} %
                              </div>
                              <div
                                style={{
                                  fontSize: "0.75rem",
                                  color: designee ? "#FFD54F" : "#bbb",
                                  fontWeight: designee ? "bold" : "normal"
                                }}
                              >
                                {occupe
                                  ? "déjà prise"
                                  : designee
                                    ? "★ celle-ci"
                                    : "libre"}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()
              ) : vitrine.mode === "joueur" && joueurPresente ? (
                <div style={carte}>
                  <h2 style={{ color: "#81C784", marginTop: 0 }}>
                    🎯 Parier sur {joueurPresente.nom}
                  </h2>
                  {raisonRefusPari(joueurPresente) ? (
                    <p style={{ fontSize: "1.2rem" }}>
                      Aucun pari possible sur ce joueur pour le moment.
                    </p>
                  ) : (
                    <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>
                      {(configBookmaker.seuilsPari || []).map((x) => (
                        <div
                          key={x.id}
                          style={{
                            background: "#1a1a1a",
                            padding: "18px 22px",
                            borderRadius: "12px",
                            minWidth: "200px"
                          }}
                        >
                          <div style={{ fontSize: "1rem" }}>{libelleSeuil(x)}</div>
                          <div
                            style={{
                              fontSize: "2.2rem",
                              fontWeight: "bold",
                              color: "#FFC107"
                            }}
                          >
                            × {calculerCote(joueurPresente.jetonsEnJeu, x.pct, configBookmaker)}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  <p style={{ color: "#888", marginTop: "18px" }}>
                    Mise maximale : {nombreSur(configBookmaker.misePlafondPari, 100)} par pari.
                  </p>
                </div>
              ) : vitrine.mode === "course" ? (
                <div style={carte}>
                  <h2 style={{ color: "#FFC107", marginTop: 0 }}>
                    🏇 Course n°{course.numero || "-"}
                  </h2>
                  {course.active && (
                    <p style={{ fontSize: "1.3rem" }}>
                      {course.enPreparation ? (
                        <strong>Les paris sont ouverts</strong>
                      ) : (
                        <>
                          Départ dans{" "}
                          <strong>
                            {Math.max(0, Math.ceil(course.avantDepart / 60000))} min
                          </strong>{" "}
                          — paris {course.parisOuverts ? "ouverts" : "clos"}
                        </>
                      )}
                    </p>
                  )}
                  <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>
                    {chevauxCourse.map((c) => (
                      <div
                        key={c.id}
                        style={{
                          background: "#1a1a1a",
                          borderLeft: `8px solid ${c.couleur}`,
                          padding: "18px 22px",
                          borderRadius: "12px",
                          minWidth: "170px"
                        }}
                      >
                        <div style={{ fontSize: "1.6rem" }}>🏇 {c.nom}</div>
                        <div
                          style={{
                            fontSize: "2rem",
                            fontWeight: "bold",
                            color: "#FFC107"
                          }}
                        >
                          × {rapportsCourse(configBookmaker)[0] || 0}
                        </div>
                        <div style={{ color: "#999", fontSize: "0.85rem" }}>
                          s'il gagne
                        </div>
                      </div>
                    ))}
                  </div>
                  {/* Toutes les places paient, pas seulement la première :
                      la salle doit le voir avant de miser, pas le découvrir
                      à l'arrivée. */}
                  <div
                    style={{
                      marginTop: "18px",
                      display: "flex",
                      gap: "10px",
                      flexWrap: "wrap",
                      alignItems: "center"
                    }}
                  >
                    <span style={{ color: "#bbb", fontSize: "1.05rem" }}>
                      Et selon la place à l'arrivée :
                    </span>
                    {rapportsCourse(configBookmaker).map((r, i) => (
                      <span
                        key={`rapport-${i}`}
                        style={{
                          background: gagnantPour(r) ? "#1a1a1a" : "#221414",
                          border: `1px solid ${
                            gagnantPour(r) ? "#455A64" : "#5d2a2a"
                          }`,
                          borderRadius: "10px",
                          padding: "8px 14px",
                          fontSize: "1.15rem"
                        }}
                      >
                        <strong>
                          {i + 1}
                          {i === 0 ? "er" : "e"}
                        </strong>{" "}
                        <strong style={{ color: couleurRapport(r) }}>
                          ×{r}
                        </strong>
                      </span>
                    ))}
                  </div>
                  <p style={{ color: "#888", marginTop: "18px" }}>
                    Mise maximale : {nombreSur(configBookmaker.courseMisePlafond, 100)} par pari.
                  </p>
                </div>
              ) : (
                <div style={carte}>
                  <h2 style={{ marginTop: 0 }}>Bienvenue chez le bookmaker</h2>
                  <p style={{ fontSize: "1.15rem", color: "#bbb" }}>
                    Paris sur les joueurs · Courses de chevaux · Investissements
                  </p>
                  {course.active && !!soireeDebut && (
                    <p style={{ fontSize: "1.3rem" }}>
                      🏇 Prochaine course dans{" "}
                      <strong>
                        {Math.max(0, Math.ceil(course.avantDepart / 60000))} min
                      </strong>
                    </p>
                  )}
                  {projetsDuBloc.length > 0 && (
                    <>
                      <h3 style={{ color: "#CE93D8" }}>Projets ouverts</h3>
                      {projetsDuBloc.map((pr) => {
                        const inst = instanceProjet(pr.id);
                        if (inst && inst.statut !== "ouvert") return null;
                        return (
                          <div
                            key={pr.id}
                            style={{
                              background: "#1a1a1a",
                              padding: "12px 16px",
                              borderRadius: "10px",
                              marginBottom: "8px",
                              fontSize: "1.05rem"
                            }}
                          >
                            {pr.titre} — {totalInvesti(inst)} / {pr.montantRequis}$
                          </div>
                        );
                      })}
                    </>
                  )}
                </div>
              )}
            </div>
          );
        }

        if (interfaceActive === "croupier") {
          // Le croupier s'identifie d'abord : c'est ce numéro qu'on inscrit
          // sur les jetons vendus, et à qui les alertes de pari s'adressent.
          if (!croupierIdentifie) {
            return (
              <div style={{ padding: "40px", maxWidth: "420px", margin: "0 auto" }}>
                <h1 style={{ color: "#9C27B0" }}>🎲 Croupier</h1>
                <p style={{ color: "#aaa" }}>Votre numéro de croupier :</p>
                <select
                  value={saisieNumeroCroupier}
                  onChange={(e) => setSaisieNumeroCroupier(e.target.value)}
                  style={{ width: "100%", padding: "12px", fontSize: "1.1rem" }}
                >
                  <option value="">-- Choisir --</option>
                  {croupiers.map((c) => (
                    <option key={c.numero} value={c.numero}>
                      n°{c.numero} — {c.nom}
                    </option>
                  ))}
                </select>
                {/* Le jeu tenu à cette table : il s'inscrit dans l'historique
                    des joueurs servis, et décide si l'on peut parier sur eux
                    pendant qu'ils y jouent. */}
                <p style={{ color: "#aaa", marginTop: "16px" }}>
                  Le jeu de votre table :
                </p>
                <select
                  value={tableCroupier}
                  onChange={(e) => setTableCroupier(e.target.value)}
                  style={{ width: "100%", padding: "12px", fontSize: "1.1rem" }}
                >
                  <option value="">-- Choisir --</option>
                  {(jeuxCroupier || []).map((x) => (
                    <option key={x.id} value={x.nom}>
                      {x.nom}
                      {x.parisAutorises === false ? " (paris interdits)" : ""}
                    </option>
                  ))}
                </select>
                <button
                  onClick={() => {
                    if (!saisieNumeroCroupier) {
                      alert("Choisissez votre numéro.");
                      return;
                    }
                    if (!tableCroupier) {
                      alert("Choisissez le jeu de votre table.");
                      return;
                    }
                    setCroupierIdentifie(saisieNumeroCroupier);
                  }}
                  className="checkbox-btn"
                  style={{ marginTop: "14px", background: "#9C27B0" }}
                >
                  Ouvrir ma table
                </button>
                <button
                  onClick={() => setInterfaceActive("menu")}
                  className="checkbox-btn"
                  style={{ marginTop: "10px" }}
                >
                  Retour
                </button>
              </div>
            );
          }

          const jC = joueursActifs.find((j) => j.id === joueurCroupierId);
          // Les paris pris sur le joueur sélectionné : celui qui lui a vendu
          // ses jetons doit le savoir, et celui qui le sert aussi.
          const parisSurJC = jC ? parisOuvertsSur(jC.id) : [];
          const protectionJC = protectionCumulee(parisSurJC.length, configBookmaker);
          const vendeurJC = jC ? jC.croupierVendeur : null;
          const jetonsDehors = joueurs.filter(
            (j) =>
              nombreSur(j.jetonsEnJeu, 0) > 0 &&
              String(j.croupierVendeur) === String(croupierIdentifie)
          );
          // Le croupier doit voir la carte que le joueur possède, pour lui
          // proposer de l'utiliser sur cette table : le joueur est devant lui,
          // pas devant une borne.
          const detientVeinard = jC
            ? jC.deck.some((c) => c.id === "veinard")

          const aLeVeinard = jC ? !!jC.veinardActif && detientVeinard : false;
          // Le temps de garde vaut aussi à la table : le croupier ne peut pas
          // armer pour le joueur une carte qu'il vient tout juste de scanner.
          const veinardEnMain = jC
            ? jC.deck.find((c) => c.id === "veinard")
            : null;
          const attenteVeinard = resteAvantUsage(

            cartesJeu,
            configGlobale,
            maintenant,

                {aLeVeinard && (

                      background: "#00BCD4",

                  <button

                      border: "none",
                      borderRadius: "8px",

                      padding: "20px",

                  <button

                      flex: 1,
                      padding: "20px",
                      background: "#4CAF50",
                      color: "#fff",
                      border: "none",
                      borderRadius: "8px",
                      fontSize: "1.2rem",
                      fontWeight: "bold",
                      cursor: "pointer"

                  </button>
                </div>
              </div>
              {rendreModalAdmin()}
              <button
                onClick={() => setModalAdminOuvert(true)}
                style={{
                  width: "100%",
                  marginTop: "20px",
                  padding: "12px",
                  background: "#555",
                  color: "#fff",
                  border: "none",
                  borderRadius: "8px"
                }}
              >
                🔒 Retour au menu
              </button>
            </div>
          );
        }

        // 5. ÉCRAN D'AFFICHAGE
        if (interfaceActive === "affichage") {
          const courseAuTableau =
            course.active &&
            (course.phase === PHASES.TOP ||
              course.phase === PHASES.COURSE ||
              course.phase === PHASES.RESULTAT);
          const vainqueur =
            course.phase === PHASES.RESULTAT ? chevalGagnant(course.numero) : null;

          return (
            <div
              style={{
                padding: "30px",
                maxWidth: "900px",
                margin: "0 auto",
                position: "relative"
              }}
            >
              <div
                style={{
                  position: "fixed",
                  top: "10px",
                  left: "10px",
                  zIndex: 40
                }}
              >
                {boutonPleinEcran(false)}
              </div>
              {/* Décompte discret, dans un coin, seulement à l'approche. */}
              {course.active &&
                !!soireeDebut &&
                course.phase === PHASES.ANNONCE && (
                  <div
                    style={{
                      position: "fixed",
                      bottom: "12px",
                      right: "12px",
                      background: "rgba(0,0,0,0.75)",
                      border: "1px solid #FFC107",
                      color: "#FFC107",
                      padding: "6px 12px",
                      borderRadius: "16px",
                      fontSize: "0.8rem",
                      zIndex: 5
                    }}
                  >
                    🏇 Course n°{course.numero} dans{" "}
                    {Math.max(0, Math.ceil(course.avantDepart / 60000))} min

              {/* La course occupe tout l'écran : c'est le moment fort. */}
              {courseAuTableau && (
                <div
                  style={{
                    position: "fixed",
                    top: 0,
                    left: 0,
                    width: "100vw",
                    height: "100vh",
                    background: "#000",
                    zIndex: 20,
                    display: "flex",
                    flexDirection: "column",
                    justifyContent: "center",
                    alignItems: "center",
                    gap: "18px"
                  }}
                >
                  <h2 style={{ color: "#FFC107", margin: 0 }}>
                    🏇 Course n°{course.numero}

                  {course.phase === PHASES.TOP &&
                    course.avantDepart > DECOMPTE_SUR_PISTE && (
                      <>
                        <div
                          style={{
                            fontSize: "9rem",
                            fontWeight: "bold",
                            color: "#fff",

                          }}
                        >
                          {Math.max(0, Math.ceil(course.avantDepart / 1000))}

                        <div style={{ color: "#aaa", fontSize: "1.2rem" }}>

                      </>

                  {(course.phase === PHASES.COURSE ||
                    (course.phase === PHASES.TOP &&
                      course.avantDepart <= DECOMPTE_SUR_PISTE)) && (
                    <div style={{ position: "relative" }}>
                      <PisteCourse
                        numero={course.numero}
                        chevaux={chevauxCourse}
                        cfg={configBookmaker}
                        herbes={herbesDe(course.numero)}

                      />
                      {course.phase === PHASES.TOP && (
                        <div
                          style={{
                            position: "absolute",

                            pointerEvents: "none"
                          }}

                          <div
                            style={{
                              fontSize: "16rem",
                              fontWeight: "bold",
                              color: "#fff",

                              // Un liseré sombre, sinon le chiffre se perdrait
                              // sur le sable clair de la piste.
                              textShadow: "0 0 30px rgba(0,0,0,0.85)"

                          >
                            {Math.max(0, Math.ceil(course.avantDepart / 1000))}

                        </div>

                  {course.phase === PHASES.RESULTAT && vainqueur && (
                    <div
                      style={{

                            // Sur un téléphone, un nom de deux mots en

                          borderLeft: rang === 0 ? "5px solid #FFD700" : "none",
                          transition:
                            "transform 550ms cubic-bezier(.4,0,.2,1), background 400ms"
                        }}
                      >
                        <span>
                          <strong>#{(rang === undefined ? i : rang) + 1}</strong>{" "}
                          {configGlobale.topAffiche === "id" ? j.id : j.nom}
                          {(() => {
                            const bouge = bougesClassement[j.id];
                            if (!bouge || bouge.jusqua <= timeNow) return null;
                            const monte = bouge.places > 0;
                            return (
                              <span
                                style={{
                                  marginLeft: "12px",
                                  // L'écran d'affichage se regarde de loin :
                                  // une flèche discrète ne se verrait pas.
                                  fontSize: "1.05rem",
                                  fontWeight: "bold",
                                  color: monte ? "#4CAF50" : "#EF5350"
                                }}
                              >
                                {monte ? "▲" : "▼"} {Math.abs(bouge.places)}
                              </span>
                            );
                          })()}
                        </span>
                        <strong style={{ color: "#4CAF50" }}>
                          {j.solde.toLocaleString()} $
                        </strong>
                      </div>
                        );
                      })}
                  </div>
                </div>
                <div style={{ width: "300px", marginLeft: "30px" }}>
                  <div
                    style={{
                      background: "#222",
                      padding: "20px",
                      borderRadius: "12px",
                      textAlign: "center"
                    }}
                  >
                    <h3 style={{ color: "#FF9800", marginTop: 0 }}>
                      {configGlobale.phraseParadisFiscal}
                    </h3>
                    <span
                      style={{
                        fontSize: "3rem",
                        fontWeight: "bold",
                        color: "#fff"
                      }}
                    >
                      {nbParadisActifs}
                    </span>
                  </div>
                </div>
              </div>

              <div
                style={{
                  background: "#181818",
                  padding: "15px",
                  borderRadius: "8px",
                  borderLeft: "5px solid #2196F3",
                  marginTop: "30px"
                }}
              >
                <h4 style={{ color: "#2196F3", margin: "0 0 10px 0" }}>
                  Derniers Événements :
                </h4>
                {historiqueAffichage.map(
                  (h, idx) =>
                    h && (
                      <p
                        key={idx}
                        style={{
                          margin: "5px 0",
                          color: idx === 0 ? "#fff" : "#888"
                        }}
                      >
                        • {h}
                      </p>
                    )
                )}
              </div>

              {rendreModalAdmin()}
              <button
                onClick={() => setModalAdminOuvert(true)}
                style={{
                  marginTop: "40px",
                  padding: "10px 20px",
                  background: "#555",
                  color: "#fff",
                  border: "none",
                  borderRadius: "6px"
                }}
              >
                🔒 Retour au menu
              </button>
            </div>
          );
        }

        // 6. INTERFACE BANQUIER (Export CSV Excel & Validation)
        if (interfaceActive === "banquier") {
          const tousItemsBoutique = [...produits, ...penalites, ...missions];
          const itemsFiltres = tousItemsBoutique.filter((i) =>
            i.nom.toLowerCase().includes(rechercheBanquier.toLowerCase())
          );

          return (
            <div
              style={{ padding: "30px", maxWidth: "800px", margin: "0 auto" }}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: "20px"
                }}
              >
                <h1 style={{ color: "#FF9800", margin: 0 }}>
                  🏦 Guichet Banquier
                </h1>
                <button
                  onClick={exporterBaseExcel}
                  style={{
                    background: "#2196F3",
                    color: "#fff",
                    border: "none",
                    padding: "10px 15px",
                    borderRadius: "6px",
                    fontWeight: "bold",
                    cursor: "pointer"
                  }}
                >
                  📊 Export Excel (suivi)
                </button>
              </div>

              <div
                style={{
                  background: configGlobale.modeLocal ? "#d32f2f" : "#222",
                  padding: "20px",
                  borderRadius: "12px",
                  display: "flex",
                  flexDirection: "column",
                  gap: "20px",
                  border: configGlobale.modeLocal ? "3px solid #f44336" : "none"
                }}
              >
                {configGlobale.modeLocal && (
                  <h2 style={{ color: "#fff", textAlign: "center", margin: 0 }}>
                    ⚠️ MODE LOCAL (SECOURS) ACTIF ⚠️
                  </h2>
                )}

                <div>
                  <label style={{ fontWeight: "bold" }}>
                    Sélectionner le Joueur au guichet :
                  </label>
                  <select
                    value={joueurBanquierId}
                    onChange={(e) => setJoueurBanquierId(e.target.value)}
                    style={{
                      width: "100%",
                      padding: "12px",
                      background: "#333",
                      color: "#fff",
                      border: "1px solid #555",
                      borderRadius: "6px",
                      fontSize: "1.1rem",
                      marginTop: "5px"
                    }}
                  >
                    {joueurs.map((j) => (
                      <option key={j.id} value={j.id}>
                        {j.nom} (Solde: {j.solde}$)
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <input
                    type="text"
                    placeholder="🔍 Rechercher..."
                    value={rechercheBanquier}
                    onChange={(e) => setRechercheBanquier(e.target.value)}
                    style={{
                      width: "100%",
                      padding: "12px",
                      background: "#333",
                      color: "#fff",
                      border: "1px solid #555",
                      borderRadius: "6px",
                      fontSize: "1rem",
                      boxSizing: "border-box"
                    }}
                  />
                </div>

                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: "15px",
                    maxHeight: "400px",
                    overflowY: "auto"
                  }}
                >
                  {itemsFiltres.map((item, idx) => {
                    const isSelected = selectionBanquier.some(
                      (s) => s.id === item.id && s.type === item.type
                    );
                    let colorLabel = "#fff";
                    if (item.type === "mission") colorLabel = "#4CAF50";
                    if (item.type === "penalite") colorLabel = "#f44336";
                    if (item.type === "produit") colorLabel = "#FF9800";

                    return (
                      <div
                        key={idx}
                        onClick={() => toggleSelectionBanquier(item)}
                        className={`checkbox-btn ${isSelected ? "selected" : ""}`}
                      >
                        <div
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center"
                          }}
                        >
                          <span style={{ fontWeight: "bold" }}>{item.nom}</span>
                          <span
                            style={{
                              color: isSelected ? "#fff" : colorLabel,
                              fontWeight: "bold"
                            }}
                          >
                            {item.type === "mission" ? "+" : "-"}
                            {item.montant}$
                          </span>
                        </div>
                        <div
                          style={{
                            fontSize: "0.8rem",
                            color: isSelected ? "#e0e0e0" : "#aaa",
                            marginTop: "5px",
                            textTransform: "uppercase"
                          }}
                        >
                          {item.type}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button
                  onClick={validerPanierBanquier}
                  disabled={selectionBanquier.length === 0}
                  style={{
                    padding: "20px",
                    background:
                      selectionBanquier.length > 0 ? "#4CAF50" : "#555",
                    color: "#fff",
                    border: "none",
                    borderRadius: "8px",
                    fontSize: "1.2rem",
                    fontWeight: "bold",
                    cursor:
                      selectionBanquier.length > 0 ? "pointer" : "not-allowed"
                  }}
                >
                  ✅ VALIDER LE PANIER ({selectionBanquier.length})
                </button>
              </div>

              <div style={{ marginTop: "20px", textAlign: "center" }}>
                <button
                  onClick={() => setInterfaceActive("menu")}
                  style={{
                    padding: "12px 25px",
                    background: "#555",
                    color: "#fff",
                    border: "none",
                    borderRadius: "8px",
                    cursor: "pointer"
                  }}
                >
                  🔙 Retour au menu
                </button>
              </div>
            </div>
          );
        }

        return null;
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
