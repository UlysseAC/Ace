                };
              })
            );
            // Une ligne par investisseur, avec ce qu'il encaisse : « les
            // investisseurs encaissent » ne disait rien à personne.
            const nomDe = (id) =>
              (joueursActifs.find((j) => j.id === id) || {}).nom || "Un joueur";
            annoncerSalle(
              reussi
                ? [
                    `💼 « ${projet.titre} » a réussi`,
                    ...Object.keys(mouvements).map(
                      (id) => `💼 ${nomDe(id)} encaisse ${mouvements[id]}$`
                    )
                  ]
                : [
                    `💼 « ${projet.titre} » a échoué`,
                    ...Object.keys(mouvements).map(
                      (id) => `💼 ${nomDe(id)} récupère ${mouvements[id]}$`
                    )
                  ]
            );
          },
          [setInvestissements, setJoueurs, annoncerSalle, joueursActifs]
        );

        // Passe en revue les projets ouverts et solde ceux qui doivent l'être.
        const reglerInvestissementsSiBesoin = React.useCallback(() => {
          investissements
            .filter((i) => i.statut === "ouvert")
            .forEach((inst) => {
              const projet = (configBookmaker.projets || []).find(
                (pr) => String(pr.id) === String(inst.projetId)
              );
              if (!projet) return;
              const total = totalInvesti(inst);
              const requis = nombreSur(projet.montantRequis, 0);
              const nb = (inst.investisseurs || []).length;
              const max = nombreSur(projet.investisseursMax, 5);
              const echeance =
                nombreSur(inst.premierTs, 0) +
                nombreSur(projet.delaiMin, 30) * 60000;

              if (total >= requis) {
                // Conditions réunies : garanti passe, aléatoire tire au sort.
                const reussi =
                  projet.type === "aleatoire"
                    ? semer(
                        Number(String(inst.id).replace(/\D/g, "").slice(-9)) || 1
                      )() *
                        100 <
                      nombreSur(projet.probabilite, 100)
                    : true;
                reglerProjet(inst, projet, reussi);
                return;
              }
              // Plus de place et objectif non atteint : c'est perdu d'avance.
              // En simulation le délai ne compte pas : rien ne doit échouer
              // pendant qu'on met le jeu au point.
              const delaiEcoule =
                !configBookmaker.modeSimulation && maintenant >= echeance;
              if (nb >= max || delaiEcoule) {
                reglerProjet(inst, projet, false);
              }
            });
        }, [investissements, configBookmaker, maintenant, reglerProjet]);

        // ================= L'IMPÔT DE FIN DE BLOC =================
        // Les plus riches versent, les plus pauvres reçoivent, et le
        // classement ne bouge pas d'un cran. Un joueur au paradis fiscal est
        // hors du champ : ni contribuable, ni bénéficiaire.
        const prelever = React.useCallback(
          (bloc) => {
            const imposables = joueursActifs
              .filter((j) => !j.paradisActif)
              .map((j) => ({
                id: j.id,
                fortune:
                  nombreSur(j.solde, 0) + nombreSur(j.jetonsEnJeu, 0),
                solde: nombreSur(j.solde, 0)
              }));
            const { preleve, verse, total } = impotDeBloc(
              imposables,
              configBookmaker
            );
            if (total <= 0) return false;

            setJoueurs((prev) =>
              prev.map((j) => {
                const pris = preleve[j.id] || 0;
                const recu = verse[j.id] || 0;
                if (!pris && !recu) return j;
                // Le montant ne paraît nulle part en public : chacun
                // l'apprend sur sa borne, et l'avis reste tant qu'il n'a pas
                // appuyé sur « J'ai lu ».
                const ligne = pris
                  ? `Impôt de fin de bloc n°${bloc} : −${pris}$`
                  : `Redistribution du bloc n°${bloc} : +${recu}$`;
                return {
                  ...j,
                  solde: Math.max(0, j.solde - pris + recu),
                  historique: [ligne, ...j.historique],
                  avisBookmaker: [ligne, ...(j.avisBookmaker || [])]
                };
              })
            );
            // La salle voit passer la somme, jamais les noms.
            annoncerSalle([
              `🏛️ Impôt de fin de bloc — ${total}$ prélevés sur les plus ` +
                `fortunés et redistribués aux plus modestes`
            ]);
            return true;
          },
          [joueursActifs, configBookmaker, setJoueurs, annoncerSalle]
        );

        // Le prélèvement tombe au changement de bloc, une fois par bloc. Un
        // marqueur partagé retient le dernier bloc traité : si le poste du
        // bookmaker était fermé, on rattrape un bloc par passage plutôt que
        // d'assommer la table de trois prélèvements d'un coup.
        React.useEffect(() => {
          if (interfaceActive !== "bookmaker") return;
          if (posteAUnAutre) return;
          // L'impôt tombe aussi en simulation : c'est le seul moyen de le
          // répéter avant la soirée, en raccourcissant la durée d'un bloc.
          if (!soireeDebut) return;
          // Rien au premier bloc : il n'y a encore rien à redistribuer.
          if (blocInvest < 2) return;
          const suivant = Math.max(1, nombreSur(dernierBlocImpose, 0)) + 1;
          if (nombreSur(dernierBlocImpose, 0) < 1) {
            // Première fois de la soirée : on part du bloc en cours sans
            // rattraper les blocs d'avant le réglage.
            setDernierBlocImpose(blocInvest - 1);
            return;
          }
          if (suivant > blocInvest) return;
          setDernierBlocImpose(suivant);
          prelever(suivant);
        }, [
          interfaceActive,
          posteAUnAutre,
          blocInvest,
          soireeDebut,
          dernierBlocImpose
        ]);

        // Le jeton est-il pris par quelqu'un d'autre, et encore frais ?
        // On lit l'horloge du système et non celle de la partie : une pause
        // ne doit ni geler ni libérer le poste.
        const posteAUnAutre =
          !!posteTenu &&
          posteTenu.id !== ID_APPAREIL &&
          Date.now() - nombreSur(posteTenu.vuLe, 0) < PEREMPTION_POSTE_MS;

        // Tant qu'on est sur le poste, on signe le jeton à intervalle
        // régulier. On ne le prend pas s'il appartient à un autre appareil
        // encore vivant : c'est la reprise de main, à la demande, qui sert
        // dans ce cas.
        React.useEffect(() => {
          if (interfaceActive !== "bookmaker" || !bookmakerOuvert) return;
          const signer = () => {
            const t = posteTenuRef.current;
            const prisAilleurs =
              !!t &&
              t.id !== ID_APPAREIL &&
              Date.now() - nombreSur(t.vuLe, 0) < PEREMPTION_POSTE_MS;
            if (prisAilleurs) return;
            setPosteTenu({ id: ID_APPAREIL, vuLe: Date.now() });
          };
          signer();
          const bat = setInterval(signer, BATTEMENT_POSTE_MS);
          return () => {
            clearInterval(bat);
            // En quittant le poste, on rend la place tout de suite plutôt que
            // de laisser le suivant attendre la péremption.
            const t = posteTenuRef.current;
            if (t && t.id === ID_APPAREIL) setPosteTenu(null);
          };
        }, [interfaceActive, bookmakerOuvert]);

        // Le poste du bookmaker fait office d'arbitre : c'est lui, et lui
        // seul, qui solde les courses terminées et les projets échus. Si
        // chaque écran le faisait, le même gain serait payé plusieurs fois.
        React.useEffect(() => {
          if (interfaceActive !== "bookmaker") return;
          // Deuxième verrou, par sécurité : même affiché, un poste qui n'a
          // pas la main n'arbitre pas.
          if (posteAUnAutre) return;
          // On solde toutes les courses terminées, pas seulement la dernière :
          // si ce poste était fermé pendant une course, ses paris seraient
          // restés en suspens sans jamais être payés.
          const aSolder = [
            ...new Set(
              parisCourse
                .filter((x) => x.statut === "ouvert")
                .map((x) => x.numero)
            )
          ].filter(
            (n) =>
              n < course.numero ||
              (n === course.numero && course.phase === PHASES.RESULTAT)
          );
          aSolder.forEach(reglerCourse);
          reglerInvestissementsSiBesoin();
          // Un délit d'initié ne vaut que pour SA course : dès qu'elle est
          // lancée, le tuyau a servi et s'efface. Sinon le joueur garde sous
          // les yeux le nom d'un cheval qui a déjà couru — et le retrouve
          // même après une remise à zéro du compteur.
          const tuyauPerime = (t) => {
            if (!t) return false;
            if (course.numero === undefined || course.numero === null)
              return false;
            const sien = Number(t.numero);
            const encours = Number(course.numero);
            if (encours > sien) return true;
            return (
              encours === sien &&
              (course.phase === PHASES.COURSE ||
                course.phase === PHASES.RESULTAT)
            );
          };
          // La fiole d'herbes ne vaut que pour sa course. On attend qu'une
          // course ultérieure existe : la retirer plus tôt rejouerait le
          // tirage sans elle, podium compris, sous les yeux de la salle.
          const perimees =
            course.numero === undefined || course.numero === null
              ? []
              : (fioles || []).filter(
                  (f) => Number(course.numero) > Number(f.numero)
                );
          if (perimees.length) {
            const porteurs = new Set(perimees.map((f) => f.joueurId));
            const passees = new Set(perimees.map((f) => Number(f.numero)));
            setFioles((prev) =>
              (prev || []).filter((f) => !passees.has(Number(f.numero)))
            );
            setJoueurs((prev) =>
              prev.map((j) =>
                porteurs.has(j.id)
                  ? {
                      ...j,
                      deck: j.deck.filter((c) => c.id !== "herbes_medicinales"),
                      historique: [
                        "Herbes médicinales : la course est passée, la fiole est vide",
                        ...j.historique
                      ]
                    }
                  : j
              )
            );
          }

          if (joueurs.some((j) => tuyauPerime(j.tuyau)))
            setJoueurs((prev) =>
              prev.map((j) =>
                tuyauPerime(j.tuyau) ? { ...j, tuyau: null } : j
              )
            );
          // Volontairement sans les fonctions en dépendance : elles changent
          // d'identité à chaque rendu, l'horloge suffit à cadencer l'arbitrage.
        }, [interfaceActive, course.phase, course.numero, maintenant]);

        // ================= LOGIQUE IMPRIMERIE =================
        const genererNumeroUnique = () => {
          return Math.floor(100000 + Math.random() * 900000).toString();
        };

        const genererChequesPdf = () => {
          const mObj =
            missions.find((m) => m.id === Number(imprMissionId)) || missions[0];
          if (!mObj) return;
          const nouveaux = [];
          const nouveauRegistre = [...codesRegistre];

          for (let i = 0; i < Number(qteImpr); i++) {
            const codeUnique = genererNumeroUnique();
            const hashUnique =
              "CODE_" + Math.random().toString(36).substring(2, 12).toUpperCase();
            nouveaux.push({
              hash: hashUnique,
              code: codeUnique,
              nom: mObj.nom,
              montant: mObj.montant,
              img: imprImgFond
            });
            nouveauRegistre.push({
              hash: hashUnique,
              code: codeUnique,
              statut: "Valide",
              type: "Mission",
              missionId: mObj.id,
              montant: mObj.montant
            });
          }
          setChequesImprimerie(nouveaux);
          setCodesRegistre(nouveauRegistre);
        };

        // ================= LOGIQUE SCANNER & DEFAUSSE =================
        const scannerCodeSimule = (type, objetDonnee) => {
          if (!joueurActuel) return;
          // Le mode simulation existe pour tout essayer : il lève les
          // verrous qui protègent la vraie soirée. Un bouton cliqué doit
          // poser la carte dans le deck, point.
          if (!configBookmaker.modeSimulation) {
            if (configGlobale.modeScanneur === "disabled") {
              alert(
                "La distribution des cartes à la borne est masquée.\n\n" +
                  "L'organisateur la remet dans l'Admin, « Distribution des " +
                  "cartes à la borne ». En mode simulation, elle est de toute " +
                  "façon toujours ouverte."
              );
              return;
            }
            if (configGlobale.modeLocal && type === "carte") {
              alert(
                "Mode Local activé : le scan des cartes est bloqué.\n\n" +
                  "L'organisateur le décoche dans l'Admin. En mode simulation, " +
                  "les cartes se distribuent quand même."
              );
              return;
            }
            if (type === "carte" && bloqueParJetons(joueurActuel)) {
              alert(MESSAGE_JETONS_EN_JEU);
              return;
            }
          }

          const hashSimule =
            "CODE_" +
            type.toUpperCase() +
            "_" +
            Math.random().toString(36).substring(2, 8);

          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id === joueurActuel.id) {
                let soldeNv = j.solde;
                let missionsNv = j.totalMissions;
                let deckNv = [...j.deck];
                let histNv = [...j.historique];
                let codesNv = [...j.codesUtilises, hashSimule];
                let listMissionsFaites = [...j.missionsFaites];
                let fontaineNv = !!j.fontaineActive;

                if (type === "mission") {
                  // La Fontaine de Jouvence, si elle est armée : elle majore
                  // cette mission-ci, puis elle est consommée.
                  const fontaine =
                    j.fontaineActive && deckNv.some((c) => c.id === "fontaine_jouvence");
                  const base = nombreSur(objetDonnee.montant, 0);
                  const pct = fontaine
                    ? Math.max(0, nombreSur(configGlobale.bonusFontainePct, 20))
                    : 0;
                  const bonus = Math.round((base * pct) / 100);
                  soldeNv += base + bonus;
                  missionsNv += base + bonus;
                  histNv.unshift(
                    fontaine
                      ? `Mission validée [${objetDonnee.nom}] : +${base}$ ` +
                          `et +${bonus}$ de Fontaine de Jouvence`
                      : `Mission validée [${objetDonnee.nom}] : +${base}$`
                  );
                  if (fontaine) {
                    deckNv = deckNv.filter((c) => c.id !== "fontaine_jouvence");
                    fontaineNv = false;
                  }
                  listMissionsFaites.push(objetDonnee.id);
                } else if (type === "carte") {
                  // L'heure du ramassage : c'est d'elle que part le temps de
                  // garde avant de pouvoir jouer la carte.
                  deckNv.push({ ...objetDonnee, recuLe: Date.now() });
                  histNv.unshift(`Carte récupérée : ${objetDonnee.nom}`);
                }

                return {
                  ...j,
                  solde: soldeNv,
                  totalMissions: missionsNv,
                  deck: deckNv,
                  historique: histNv,
                  codesUtilises: codesNv,
                  missionsFaites: listMissionsFaites,
                  fontaineActive: fontaineNv
                };
              }
              return j;
            })
          );

          alert(
            type === "mission"
              ? `Mission validée ! +${objetDonnee.montant}$`
              : `Carte "${objetDonnee.nom}" ajoutée dans votre deck !`
          );
          setSousMenuBanque("scanner_choix");
        };

        // ================= VALIDATION DU CODE =================
        const validerCode = (code) => {
          if (!joueurActuel) return;
          if (!code.trim()) {
            alert("Veuillez entrer un code");
            return;
          }

          // Chercher le code dans le registre (par code numérique ou hash)
          const codeValide = codesRegistre.find(
            (q) => q.code === code.trim() || q.hash.substring(0, 12) === code.trim().toUpperCase()
          );

          if (!codeValide) {
            alert("Code invalide ou inexistant");
            return;
          }

          // Un chèque s'encaisse une fois, et une seule, pour toute la
          // table. La liste des codes du joueur ne suffisait pas : elle
          // laissait chacun encaisser le même papier, et une photo du chèque
          // valait autant de fois qu'il y a de joueurs.
          if (codeValide.statut === "Encaissé") {
            alert(
              "Ce chèque a déjà été encaissé" +
                (codeValide.parNom ? ` par ${codeValide.parNom}` : "") +
                (codeValide.leQuand ? `, à ${codeValide.leQuand}` : "") +
                "."
            );
            return;
          }
          // Une partie enregistrée avant ce changement n'a que les listes des
          // joueurs : on les respecte encore, pour ne pas rendre d'un coup
          // deux fois encaissables des chèques déjà passés.
          if (
            joueurs.some((j) => (j.codesUtilises || []).includes(codeValide.hash))
          ) {
            alert("Ce chèque a déjà été encaissé.");
            return;
          }

          // Appliquer le code selon son type
          if (codeValide.type === "Mission") {
            const mission = missions.find((m) => m.id === codeValide.missionId);
            if (!mission) {
              alert("Mission introuvable");
              return;
            }
            scannerCodeSimule("mission", mission);
            // Le registre garde la trace : qui, et quand.
            setCodesRegistre((prev) =>
              prev.map((q) =>
                q.hash === codeValide.hash
                  ? {
                      ...q,
                      statut: "Encaissé",
                      parNom: joueurActuel.nom,
                      leQuand: new Date().toLocaleTimeString()
                    }
                  : q
              )
            );
          }

          setCodeManuel("");
        };

        // Une carte reçue ne se jette plus : elle se joue, ou elle reste
        // en main jusqu'au bout de la soirée. Se débarrasser d'une carte
        // gênante — le Veinard, qui interdit les paris sur son porteur —
        // était une échappatoire, pas un coup.

        // ================= LOGIQUE CROUPIER =================
        const totalCroupier =
          croupierStack.reduce((a, b) => a + b, 0) +
          Number(saisieCroupierManuelle || 0);

        // Deux temps distincts à la table :
        //  - l'achat de jetons n'est qu'une conversion, le joueur n'a encore
        //    rien gagné ni perdu : aucune carte ne s'y applique ;
        //  - le retour des jetons révèle le résultat, et c'est là que
        //    Le Veinard adoucit la perte ou gonfle le gain.
        const actionCroupierCalcul = (typeOp) => {
          const jC = joueurs.find((j) => j.id === joueurCroupierId);
          if (!jC) return;
          const montant = totalCroupier;

          if (montant <= 0) {
            alert("Veuillez saisir un montant.");
            return;
          }

          // La carte n'agit que si le joueur l'a lui-meme activee.
          const aLeVeinard =
            !!jC.veinardActif && jC.deck.some((c) => c.id === "veinard");
          const jetonsAvant = jC.jetonsEnJeu || 0;

          if (typeOp === "retrait") {
            if (montant > jC.solde) {
              alert("Montant insuffisant !");
              return;
            }
            if (montant > configGlobale.limiteRetraitCroupier) {
              alert(configGlobale.phraseLimiteCroupier);
              return;
            }
            setJoueurs((prev) =>
              prev.map((j) =>
                j.id === jC.id
                  ? {
                      ...j,
                      solde: Math.max(0, j.solde - montant),
                      totalJeux: j.totalJeux - montant,
                      jetonsEnJeu: jetonsAvant + montant,
                      // On retient qui a vendu : c'est ce croupier qu'il
                      // faudra prévenir si un pari est pris sur ce joueur.
                      croupierVendeur: croupierIdentifie || j.croupierVendeur || null,
                      // Le jeu auquel il est assis : c'est lui qui décide si
                      // la salle peut parier sur son résultat.
                      jeuEnCours: tableCroupier || null,
                      historique: [
                        `Croupier ${croupierIdentifie ? "n°" + croupierIdentifie + " " : ""}[${tableCroupier}] : achat de ${montant}$ de jetons`,
                        ...j.historique
                      ]
                    }
                  : j
              )
            );
            setCroupierStack([]);
            setSaisieCroupierManuelle("");
            return;
          }

          // Retour des jetons : le résultat de la partie est la différence
          // entre ce que le joueur rapporte et ce qu'il avait pris.
          const resultat = montant - jetonsAvant;
          const pctReel = jetonsAvant > 0 ? (resultat / jetonsAvant) * 100 : 0;

          // ---- Paris pris sur ce joueur ----
          // Le pari se juge sur le résultat brut, avant toute bonification :
          // la protection ci-dessous change ce que le joueur empoche, pas
          // l'issue du pari.
          const parisSurLui = parisOuvertsSur(jC.id);
          const protection = protectionCumulee(
            parisSurLui.length,
            configBookmaker
          );

          // Les deux bonifications sont comptées à part. Le total seul ne
          // dirait pas si la carte a joué : c'est pourtant lui qui décidait
          // de la consommer.
          let bonusVeinard = 0;
          if (aLeVeinard && resultat < 0) {
            bonusVeinard = Math.round(
              (-resultat * configGlobale.bonusVeinardPertes) / 100
            );
          } else if (aLeVeinard && resultat > 0) {
            bonusVeinard = Math.round(
              (resultat * configGlobale.bonusVeinardGain) / 100
            );
          }
          // Un joueur visé par un pari ne peut pas détenir de Veinard : les
          // deux effets ne se rencontrent jamais. On les additionne quand
          // même, pour que le crédit reste juste si la règle changeait.
          let bonusProtection = 0;
          if (parisSurLui.length > 0 && resultat < 0) {
            bonusProtection = Math.round((-resultat * protection.perte) / 100);
          } else if (parisSurLui.length > 0 && resultat > 0) {
            bonusProtection = Math.round((resultat * protection.gain) / 100);
          }
          const bonus = bonusVeinard + bonusProtection;
          const credite = montant + bonus;

          /*
           * La carte n'a joué que si elle a réellement bonifié quelque chose.
           *
           * Rendre exactement le nombre de jetons qu'on avait pris — ni gain
           * ni perte — ne lui donne rien à faire : elle reste en main, et
           * armée. Elle était bien conservée jusqu'ici, mais on la désarmait
           * au passage, sans le dire : le joueur repartait avec une carte
           * qu'il croyait prête et qui ne l'était plus.
           *
           * On regarde la bonification du Veinard seule, et non le total :
           * avec un pourcentage réglé à zéro, la protection d'un pari
           * pouvait à elle seule faire croire que la carte avait servi.
           */
          const veinardAJoue = aLeVeinard && bonusVeinard > 0;

          // Un pari est gagné si le seuil est atteint dans le sens visé.
          const pariGagne = (pari) =>
            pari.sens === "gain"
              ? pctReel >= nombreSur(pari.pct, 0)
              : pctReel <= -nombreSur(pari.pct, 0);

          const gainsParParieur = {};
          const lignesParieur = {};
          const pertesParParieur = {};
          const annoncesSalle = [];
          parisSurLui.forEach((pari) => {
            const gagne = pariGagne(pari);
            const gain = gagne ? Math.round(nombreSur(pari.mise, 0) * nombreSur(pari.cote, 1)) : 0;
            if (gain > 0) {
              gainsParParieur[pari.parieurId] =
                (gainsParParieur[pari.parieurId] || 0) + gain;
            } else {
              pertesParParieur[pari.parieurId] =
                (pertesParParieur[pari.parieurId] || 0) + nombreSur(pari.mise, 0);
            }
            const sens =
              pari.sens === "gain" ? `+${pari.pct} %` : `−${pari.pct} %`;
            lignesParieur[pari.parieurId] = [
              gagne
                ? `Pari gagné sur ${jC.nom} (${sens}) : +${gain}$`
                : `Pari perdu sur ${jC.nom} (${sens}) : −${pari.mise}$`,
              ...(lignesParieur[pari.parieurId] || [])
            ];
            if (gagne) {
              const parieur = joueurs.find((j) => j.id === pari.parieurId);
              annoncesSalle.push(
                `🎯 ${(parieur || {}).nom || "Un joueur"} remporte ${gain}$ sur son pari sur ${jC.nom}`
              );
            }
          });

          if (parisSurLui.length > 0) {
            const ids = new Set(parisSurLui.map((p) => p.id));
            setParisJoueurs((prev) =>
              prev.map((p) =>
                ids.has(p.id)
                  ? {
                      ...p,
                      statut: pariGagne(p) ? "gagne" : "perdu",
                      pctReel: Math.round(pctReel * 10) / 10,
                      regleTs: Date.now()
                    }
                  : p
              )
            );
          }

          if (bonus > 0) {
            const origine =
              parisSurLui.length > 0
                ? `Protection (${parisSurLui.length} pari${parisSurLui.length > 1 ? "s" : ""})`
                : "Effet [Le Veinard]";
            alert(
              resultat < 0
                ? `${origine} : perte de ${-resultat}$ réduite à ${-resultat - bonus}$. Crédit : ${credite}$`
                : `${origine} : gain de ${resultat}$ porté à ${resultat + bonus}$. Crédit : ${credite}$`
            );
          } else if (aLeVeinard) {
            // Le croupier doit pouvoir le dire au joueur : sa carte n'a pas
            // été gâchée.
            alert(
              "Partie à l'équilibre : [Le Veinard] n'avait rien à bonifier.\n\n" +
                "Il reste en main, toujours armé pour la prochaine table."
            );
          }

          setJoueurs((prev) =>
            prev.map((j) => {
              // Les parieurs encaissent leur gain au passage.
              if (j.id !== jC.id) {
                const gain = gainsParParieur[j.id] || 0;
                const perdu = pertesParParieur[j.id] || 0;
                const couvert = rembourserAssurance(j, perdu);
                const lignes = couvert
                  ? [couvert.ligne, ...(lignesParieur[j.id] || [])]
                  : lignesParieur[j.id];
                if (!gain && !lignes && !couvert) return j;
                return {
                  ...j,
                  solde: j.solde + gain + (couvert ? couvert.montant : 0),
                  assuranceActive: couvert ? false : j.assuranceActive,
                  historique: [...(lignes || []), ...j.historique],
                  // Avis à lire à sa prochaine connexion : le parieur n'était
                  // pas là au moment du dénouement.
                  avisBookmaker: [...(lignes || []), ...(j.avisBookmaker || [])]
                };
              }
              const bilan =
                resultat === 0
                  ? "à l'équilibre"
                  : resultat > 0
                    ? `gain de ${resultat + bonus}$`
                    : `perte de ${-resultat - bonus}$`;
              const nvHist = [
                `Croupier [${tableCroupier}] : retour de ${montant}$ de jetons, ${bilan}`,
                ...j.historique
              ];
              // La carte n'est consommée que si elle a réellement joué.
              if (veinardAJoue) nvHist.unshift("Carte [Le Veinard] consommée");
              else if (aLeVeinard)
                nvHist.unshift(
                  "Carte [Le Veinard] : rien à bonifier, elle reste armée"
                );
              return {
                ...j,
                solde: Math.max(0, j.solde + credite),
                totalJeux: j.totalJeux + credite,
                jetonsEnJeu: 0,
                croupierVendeur: null,
                jeuEnCours: null,
                // Désarmée seulement si elle a servi : sinon elle reste
                // prête, sans qu'on ait à la réarmer.
                veinardActif: veinardAJoue ? false : j.veinardActif,
                deck: veinardAJoue
                  ? j.deck.filter((c) => c.id !== "veinard")
                  : j.deck,
                historique: nvHist
              };
            })
          );

          annoncerSalle(annoncesSalle);

          setCroupierStack([]);
          setSaisieCroupierManuelle("");
        };

        // ================= LOGIQUE BANQUIER (CHECKBOXES & MODE LOCAL) =================
        const toggleSelectionBanquier = (item) => {
          if (
            selectionBanquier.find(
              (i) => i.id === item.id && i.type === item.type
            )
          ) {
            setSelectionBanquier(
              selectionBanquier.filter(
                (i) => !(i.id === item.id && i.type === item.type)
              )
            );
          } else {
            setSelectionBanquier([...selectionBanquier, item]);
          }
        };

        const validerPanierBanquier = () => {
          if (selectionBanquier.length === 0) return;
          const jB = joueurs.find((j) => j.id === joueurBanquierId);
          if (!jB) return;

          let coutTotal = 0,
            gainsTotal = 0,
            penalitesTotal = 0;
          const details = [],
            missionsN = [],
            produitsN = [],
            penalitesN = [];

          selectionBanquier.forEach((item) => {
            if (item.type === "produit") {
              coutTotal += item.montant;
              details.push(`Achat ${item.nom}`);
              produitsN.push(item.id);
            }
            if (item.type === "penalite") {
              penalitesTotal += item.montant;
              coutTotal += item.montant;
              details.push(`Pénalité ${item.nom}`);
              penalitesN.push(item.id);
            }
            if (item.type === "mission") {
              gainsTotal += item.montant;
              details.push(`Mission ${item.nom}`);
              missionsN.push(item.id);
            }
          });

          if (jB.solde + gainsTotal < coutTotal) {
            alert("Solde insuffisant pour régler l'ensemble du panier !");
            return;
          }

          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id === jB.id) {
                return {
                  ...j,
                  solde: j.solde + gainsTotal - coutTotal,
                  totalMissions: j.totalMissions + gainsTotal,
                  achatsBoutique:
                    j.achatsBoutique + (coutTotal - penalitesTotal),
                  nbPenalites: j.nbPenalites + (penalitesTotal > 0 ? 1 : 0),
                  totalPenalites: (j.totalPenalites || 0) + penalitesTotal,
                  missionsFaites: [...j.missionsFaites, ...missionsN],
                  produitsAchetes: [...j.produitsAchetes, ...produitsN],
                  penalitesSubies: [...j.penalitesSubies, ...penalitesN],
                  historique: [
                    `Guichet : ${details.join(", ")}`,
                    ...j.historique
                  ]
                };
              }
              return j;
            })
          );

          alert("Panier validé avec succès !");
          setSelectionBanquier([]);
        };

        // ================= LOGIQUE CONTRÔLE FISCAL (ANIMATION GLOBALE & BANQUE) =================
        // Joue l'animation du dé, sans toucher aux comptes. Tous les appareils
        // l'exécutent en recevant l'événement diffusé, pour que la salle voie
        // le même tirage au même moment.
        const jouerAnimation = React.useCallback((ev) => {
          if (ev.id) {
            tiragesJoues.current = [ev.id, ...tiragesJoues.current].slice(0, 20);
          }
          // Les faces défilent avec leur couleur. Un tirage diffusé par une
          // version précédente n'envoyait que les pourcentages : on retombe
          // alors sur la couleur du résultat, faute de mieux.
          const brutes = ev.faces && ev.faces.length ? ev.faces : [ev.facePct];
          const faces = brutes.map((f) =>
            typeof f === "object" && f !== null
              ? { pct: f.pct, couleur: COULEURS_FACE[f.type] || ev.couleur }
              : { pct: f, couleur: ev.couleur }
          );
          const auHasard = () => faces[Math.floor(Math.random() * faces.length)];

          // On part sur une face au hasard : afficher tout de suite le
          // résultat reviendrait à l'annoncer avant que le dé ne s'arrête.
          const depart = auHasard();
          setInfosAnimation({
            phraseAction: ev.phraseAction,
            face: `${depart.pct}%`,
            couleur: depart.couleur,
            phraseResultat: ev.phraseResultat,
            noteFace: ev.noteFace || ""
          });
          setAnimationActive(true);
          setEstEnRoulementFiscal(true);

          let compteur = 0;
          const intervalle = setInterval(() => {
            const tirage = auHasard();
            setInfosAnimation((prev) => ({
              ...prev,
              face: `${tirage.pct}%`,
              couleur: tirage.couleur
            }));
            compteur += 80;

            if (compteur >= ev.secRoulement * 1000) {
              clearInterval(intervalle);
              // Le dé se fige enfin sur le vrai résultat, couleur comprise.
              setInfosAnimation((prev) => ({
                ...prev,
                face: `${ev.facePct}%`,
                couleur: ev.couleur
              }));
              setEstEnRoulementFiscal(false);
              setTimeout(
                () => setAnimationActive(false),
                ev.secArret * 1000 + 1000
              );
            }
          }, 80);
        }, []);

        // Écoute les tirages lancés depuis les autres appareils.
        React.useEffect(() => {
          if (!Sync.actif) return;
          // Un tirage déjà en base ne doit pas rejouer à chaque connexion.
          let dernierVu = Date.now();
          return Sync.ecouter("evenement", (ev) => {
            if (!ev || !ev.ts || ev.ts <= dernierVu) return;
            dernierVu = ev.ts;
            // Le lanceur a déjà joué ce tirage sans attendre la base.
            if (ev.id && tiragesJoues.current.includes(ev.id)) return;
            jouerAnimation(ev);
          });
        }, [jouerAnimation]);

        const lancerControleFiscal = () => {
          // Le contrôle fiscal est une activation de carte : elle tombe sous
          // la même règle que les autres quand le joueur est à table.
          if (bloqueParJetons(joueurActuel)) {
            alert(MESSAGE_JETONS_EN_JEU);
            return;
          }
          // Et il est suspendu autour de la course : la salle doit avoir les
          // yeux sur l'hippodrome, pas sur deux animations concurrentes.
          if (secondesBlocageFiscal > 0) {
            alert(
              `Une course de chevaux est imminente ou en cours : le contrôle fiscal est impossible pendant encore ${secondesBlocageFiscal} secondes.`
            );
            return;
          }
          if (!cibleFiscaleSelectionnee) {
            alert("Choisissez une cible.");
            return;
          }
          const jL = joueurActuel;
          const jC = joueursActifs.find(
            (j) => j.id === cibleFiscaleSelectionnee
          );
          const deConfig = desConfig.find(
            (d) => d.id === Number(deFiscalSelectionne)
          );
          if (!jL || !jC || !deConfig) return;

          // Un champ Admin vide ou non numérique donnerait NaN, et la condition
          // d'arrêt de l'intervalle ne serait jamais vraie : le dé tournerait
          // sans fin. On retombe sur les valeurs par défaut dans ce cas.
          const dureeSure = (valeur, secours) => {
            const n = Number(valeur);
            return Number.isFinite(n) && n >= 0 ? n : secours;
          };
          const secRoulement = dureeSure(configGlobale.dureeRoulement, 3);
          const secArret = dureeSure(configGlobale.dureeArret, 2);

          setSousMenuBanque("animation_attente");
          const faceTiree =
            deConfig.faces[Math.floor(Math.random() * deConfig.faces.length)];
          let texteResultat = "";
          let valeurReelleAttaquant = 0;
          let valeurReelleCible = 0;
          let donsDistribues = [];

          if (faceTiree.type === "Rouge") {
            const val = Math.round(jL.solde * (faceTiree.pct / 100));
            valeurReelleAttaquant = -val;
            valeurReelleCible = val;
            texteResultat = `Échec de l'attaque ! L'attaquant perd ${val}$ transférés à la cible.`;
          } else if (faceTiree.type === "Vert") {
            const val = Math.round(jC.solde * (faceTiree.pct / 100));
            valeurReelleCible = -val;
            valeurReelleAttaquant = val;
            texteResultat = `Attaque réussie ! La cible perd ${val}$ saisis par l'attaquant.`;
          } else if (faceTiree.type === "Don") {
            const valL = Math.round(jL.solde * (faceTiree.pct / 100));
            const valC = Math.round(jC.solde * (faceTiree.pct / 100));
            const cagnotte = valL + valC;
            valeurReelleAttaquant = -valL;
            valeurReelleCible = -valC;

            // On classe sur les soldes d'APRÈS la saisie : l'attaquant et sa
            // cible viennent de perdre de l'argent, et peuvent très bien être
            // parmi les derniers — auquel cas ils touchent leur part comme
            // les autres.
            const apresSaisie = joueursActifs.map((j) => ({
              id: j.id,
              nom: j.nom,
              solde: Math.max(
                0,
                j.solde +
                  (j.id === jL.id ? -valL : 0) +
                  (j.id === jC.id ? -valC : 0)
              )
            }));
            const parts = repartirSolidarite(cagnotte, apresSaisie);
            donsDistribues = Object.keys(parts).map((id) => ({
              id,
              montant: parts[id]
            }));
            // Aucun nom : la salle voit passer la somme, pas les
            // bénéficiaires. Chacun d'eux l'apprend sur sa borne, en privé.
            texteResultat = `Solidarité ! ${cagnotte}$ saisis et redistribués aux plus démunis.`;
          }

          const phraseInitiale = configGlobale.phraseAttaqueCible
            .replace("{LANCEUR}", jL.nom)
            .replace("{DE}", deConfig.nom)
            .replace("{CIBLE}", jC.nom);
          const evenement = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            phraseAction: phraseInitiale,
            facePct: faceTiree.pct,
            couleur: COULEURS_FACE[faceTiree.type],
            phraseResultat: texteResultat,
            // La note de la face tirée : la salle entend le résultat, le
            // joueur lit la règle qui vient de s'appliquer.
            noteFace: texteFace(faceTiree),
            faces: deConfig.faces.map((f) => ({ pct: f.pct, type: f.type })),
            secRoulement,
            secArret
          };
          // Le lanceur joue son animation tout de suite, sans attendre que la
          // base la lui renvoie : sur un réseau capricieux cet aller-retour
          // peut tarder, ou ne jamais revenir, et il resterait devant un écran
          // vide. Les autres appareils la reçoivent par la diffusion, et
          // l'identifiant empêche qu'elle rejoue ici au retour de l'écho.
          jouerAnimation(evenement);
          if (Sync.actif) Sync.diffuser(evenement);

          // Seul l'appareil lanceur touche aux comptes, sinon les huit
          // appareils appliqueraient chacun le même transfert.
          setTimeout(
                () => {
                  setJoueurs((prev) =>
                    prev.map((item) => {
                      let nSolde = item.solde;
                      let nHist = [...item.historique];
                      let nAvis = [...(item.avisBookmaker || [])];
                      let nVole = item.argentVole || 0;
                      let nDeck = item.deck;

                      if (item.id === jL.id) {
                        nSolde += valeurReelleAttaquant;
                        if (valeurReelleAttaquant > 0)
                          nVole += valeurReelleAttaquant;
                        nHist.unshift(
                          `Contrôle lancé : ${valeurReelleAttaquant}$`
                        );
                        // La carte est consommée par le tirage.
                        nDeck = nDeck.filter((c) => c.id !== "controle_fiscal");
                      }
                      if (item.id === jC.id) {
                        nSolde += valeurReelleCible;
                        nHist.unshift(`Subi Contrôle : ${valeurReelleCible}$`);
                      }
                      const partDon = donsDistribues.find(
                        (d) => d.id === item.id
                      );
                      if (partDon) {
                        nSolde += partDon.montant;
                        const ligne = `Don de solidarité reçu : +${partDon.montant}$`;
                        nHist.unshift(ligne);
                        // Le montant n'apparaît nulle part en public : le
                        // bénéficiaire l'apprend sur sa borne, et l'avis
                        // reste tant qu'il n'a pas appuyé sur « J'ai lu ».
                        nAvis.unshift(ligne);
                      }
                      return {
                        ...item,
                        solde: Math.max(0, nSolde),
                        historique: nHist,
                        avisBookmaker: nAvis,
                        argentVole: nVole,
                        deck: nDeck
                      };
                    })
                  );

                  const histEntry = `${jL.nom} vs ${jC.nom} [${deConfig.nom}] -> Face ${faceTiree.type} (${faceTiree.pct}%) : ${texteResultat}`;
                  setHistoriqueFiscal((prev) => [
                    {
                      lanceur: jL.nom,
                      cible: jC.nom,
                      de: deConfig.nom,
                      details: histEntry,
                      date: new Date().toLocaleTimeString()
                    },
                    ...prev
                  ]);
                  setHistoriqueAffichage((prev) =>
                    [
                      histEntry,
                      prev[0] === configGlobale.phraseAucunHistorique
                        ? null
                        : prev[0]
                    ].filter(Boolean)
                  );

                  setSousMenuBanque("accueil");
                },
            (secRoulement + secArret) * 1000 + 1000
          );
        };

        // Fenêtre de code administrateur, partagée par les écrans installés
        // sur un appareil dédié : on ne doit pas pouvoir en sortir vers
        // l'Admin sans le code.
        const rendreModalAdmin = () =>
          modalAdminOuvert ? (
            <div
              style={{
                position: "fixed",
                top: 0,
                left: 0,
                width: "100vw",
                height: "100vh",
                background: "rgba(0,0,0,0.9)",
                display: "flex",
                justifyContent: "center",
                alignItems: "center",
                zIndex: 2000
              }}
            >
              <div
                style={{
                  background: "#222",
                  padding: "30px",
                  borderRadius: "12px",
                  textAlign: "center",
                  minWidth: "280px"
                }}
              >
                <h3 style={{ marginTop: 0 }}>🔒 Code Administrateur</h3>
                <input
                  type="password"
                  value={saisieCodeAdmin}
                  autoFocus
                  onChange={(e) => {
                    setSaisieCodeAdmin(e.target.value);
                    setErreurCodeAdmin("");
                  }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") validerCodeAdmin();
                  }}
                  style={{
                    padding: "10px",
                    width: "80%",
                    background: "#333",
                    color: "#fff",
                    border: "1px solid #555",
                    borderRadius: "4px"
                  }}
                />
                {/* Message dans la page : une alerte du navigateur peut être
                    bloquée, et l'erreur passerait alors inaperçue. */}
                <p
                  style={{
                    color: "#f44336",
                    minHeight: "1.4em",
                    margin: "8px 0 12px 0",
                    fontSize: "0.9rem"
                  }}
                >
                  {erreurCodeAdmin}
                </p>
                <div style={{ display: "flex", gap: "10px" }}>
                  <button
                    onClick={validerCodeAdmin}
                    style={{
                      flex: 1,
                      padding: "10px",
                      background: "#4CAF50",
                      color: "#fff",
                      border: "none",
                      borderRadius: "4px",
                      cursor: "pointer"
                    }}
                  >
                    Valider
                  </button>
                  <button
                    onClick={() => {
                      setModalAdminOuvert(false);
                      setSaisieCodeAdmin("");
                      setErreurCodeAdmin("");
                    }}
                    style={{
                      flex: 1,
                      padding: "10px",
                      background: "#555",
                      color: "#fff",
                      border: "none",
                      borderRadius: "4px",
                      cursor: "pointer"
                    }}
                  >
                    Annuler
                  </button>
                </div>
              </div>
            </div>
          ) : null;

        // ========================================================
        // ================= RENDU DES INTERFACES =================
        // ========================================================

        if (interfaceActive === "menu") {
          return (
            <div
              style={{
                textAlign: "center",
                padding: "40px",
                maxWidth: "400px",
                margin: "0 auto"
              }}
            >
              <div
                style={{
                  position: "fixed",
                  top: "10px",
                  right: "10px",
                  padding: "8px 12px",
                  borderRadius: "20px",
                  fontSize: "12px",
                  fontWeight: "bold",
                  background: supabaseConnected ? "#4CAF50" : "#ff6b6b",
                  color: "white"
                }}
              >
                {supabaseConnected ? "🟢 Supabase OK" : "🔴 Mode Offline"}
              </div>
              <h1>🎰 Casino RP - Menu</h1>
              {/* Trois familles : ce qui pilote la soirée, ce qui tourne
                  tout seul sur un écran, et ce qui se tient derrière un
                  comptoir. */}
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: "22px",
                  textAlign: "left"
                }}
              >
                {[
                  {
                    titre: "Organisation",
                    entrees: [
                      { cle: "admin", libelle: "🛠️ Admin & Config", couleur: "#333" }
                    ]
                  },
                  {
                    titre: "Écrans autonomes",
                    entrees: [
                      {
                        cle: "banque",
                        libelle: "📱 Banque Automatisée",
                        couleur: "#4CAF50"
                      },
                      {
                        cle: "affichage",
                        libelle: "📺 Écran d'affichage",
                        couleur: "#2196F3"
                      }
                    ]
                  },
                  {
                    titre: "Rôles tenus par quelqu'un",
                    entrees: [
                      { cle: "croupier", libelle: "🎲 Croupier", couleur: "#9C27B0" },
                      {
                        cle: "banquier",
                        libelle: "🏦 Banquier & Boutique",
                        couleur: "#FF9800"
                      },
                      {
                        cle: "bookmakerAccueil",
                        libelle: "🎩 Bookmaker",
                        couleur: "#00838F"
                      }
                    ]
                  }
                ].map((groupe) => (
                  <div key={groupe.titre}>
                    <div
                      style={{
                        color: "#888",
                        fontSize: "0.75rem",
                        letterSpacing: "1.5px",
                        textTransform: "uppercase",
                        marginBottom: "8px",
                        borderBottom: "1px solid #333",
                        paddingBottom: "4px"
                      }}
                    >
                      {groupe.titre}
                    </div>
                    <div
                      style={{
                        display: "flex",
                        flexDirection: "column",
                        gap: "10px"
                      }}
                    >
                      {groupe.entrees.map((e) => (
                        <button
                          key={e.cle}
                          onClick={() => setInterfaceActive(e.cle)}
                          className="checkbox-btn"
                          style={{ background: e.couleur }}
                        >
                          {e.libelle}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        // --- 2. INTERFACE ADMIN ---
        if (interfaceActive === "admin") {
          return (
            <div
              style={{ padding: "30px", maxWidth: "900px", margin: "0 auto" }}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  flexWrap: "wrap",
                  gap: "10px"
                }}
              >
                <h1 style={{ color: "#FF9800", margin: 0 }}>
                  🛠️ Interface Admin
                </h1>
                <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                  <button
                    onClick={() => setInterfaceActive("base")}
                    style={{
                      padding: "10px 18px",
                      background: "#2196F3",
                      color: "#fff",
                      border: "none",
                      borderRadius: "6px",
                      fontWeight: "bold",
                      cursor: "pointer"
                    }}
                  >
                    🗄️ Voir la base de données
                  </button>
                  <button
                    onClick={() => setInterfaceActive("adminCartes")}
                    style={{
                      padding: "10px 18px",
                      background: "#6A1B9A",
                      color: "#fff",
                      border: "none",
                      borderRadius: "6px",
                      fontWeight: "bold",
                      cursor: "pointer"
                    }}
                  >
                    🃏 Réglages Cartes
                  </button>
                  <button
                    onClick={() => setInterfaceActive("adminBookmaker")}
                    style={{
                      padding: "10px 18px",
                      background: "#00838F",
                      color: "#fff",
                      border: "none",
                      borderRadius: "6px",
                      fontWeight: "bold",
                      cursor: "pointer"
                    }}
                  >
                    🎩 Réglages Bookmaker
                  </button>
                  <button
                    onClick={() => {
                      const actif = !configBookmaker.modeSimulation;
                      // Une table de quatre ne dit rien de ce que donnera
                      // l'impôt ou le classement à vingt-cinq.
                      if (
                        actif &&
                        window.confirm(
                          "Passer en simulation.\n\n" +
                            "OK : remplacer la table par 25 joueurs de test, " +
                            "soldes tirés entre 0 et 1000$.\n" +
                            "Annuler : garder les joueurs actuels."
                        )
                      ) {
                        setJoueurs(tableDEssai());
                      }
                      setConfigBookmaker({
                        ...configBookmaker,
                        modeSimulation: actif
                      });

          // rendu est recréé à chaque frappe, l'input serait remonté et le

          const nbChevaux = (configBookmaker.chevaux || []).length || 1;
          const coteEquitable = nbChevaux;
          const coteActuelle = rapportsCourse(configBookmaker)[0] || 0;
          const marge = Math.round((1 - coteActuelle / coteEquitable) * 100);

                  🎩 Réglages Bookmaker

                <button

              <div style={cadre}>
                <h3 style={{ marginTop: 0, color: "#4DD0E1" }}>Accès</h3>
                <label style={{ display: "block", fontSize: "0.85rem" }}>

                  <label>Le joueur</label>
                  <select
                    value={bkCourseJoueurId}

                  >
                    <option value="">-- Choisir --</option>
                    {joueurs.map((j) => (
                      <option key={j.id} value={j.id}>
                        {j.nom} ({j.solde}$)

                  {/* Le barème sous les yeux du bookmaker au moment de

                    style={{

                  <label>

                  <input

                  <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>

                      onClick={() => {

                    <button
