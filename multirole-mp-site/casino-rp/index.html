  <body>
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [interfaceActive, setInterfaceActive] = React.useState("menu");

        // --- TABLE 4 : CONFIGURATION GLOBALE ---
        const [configGlobale, setConfigGlobale] = useEtatPartage("configGlobale", {
          codeAdmin: "26",
          limitTop: 3,
          dureeParadisFiscalMin: 15,

          phraseParadisFiscal: "Nombre d'habitants d'un paradis fiscal :",
          phraseAttaqueCible:

          phraseAucunHistorique: "Aucun historique pour le moment.",

        // --- TABLE 2 : MISSIONS, PRODUITS & PÉNALITÉS ---
        const [missions, setMissions] = useEtatPartage("missions", [
          { id: 1, nom: "Mission Braquage", montant: 1000, type: "mission" },
          { id: 2, nom: "Mission Livraison", montant: 500, type: "mission" }
        ]);
        const [produits, setProduits] = useEtatPartage("produits", [
          { id: 1, nom: "VIP Pass", montant: 2000, type: "produit" },
          { id: 2, nom: "Boisson Luxe", montant: 150, type: "produit" }
        ]);
        const [penalites, setPenalites] = useEtatPartage("penalites", [
          { id: 1, nom: "Infraction Règle", montant: 300, type: "penalite" }
        ]);
        const [cartesJeu, setCartesJeu] = useEtatPartage("cartesJeu", [
          {
            id: "veinard",
            nom: "Le Veinard",
            definition:
              "Usage unique : quand vous rendez vos jetons au croupier, réduit votre perte de 50% ou augmente votre gain de 5%.",
            phraseAnim: "La chance sourit !"
          },
          {
            id: "paradis_fiscal",
            nom: "Paradis Fiscal",
            definition: "Masque votre position du classement.",
            phraseAnim: "Disparition dans les îles..."
          },
          {
            id: "controle_fiscal",
            nom: "Contrôle Fiscal",
            definition: "Saisit des fonds selon le lancer de dé.",
            phraseAnim: "Le fisc frappe à la porte !"
          }
        ]);

        // --- TABLE 6 : CONFIGURATION DES 3 DÉS (6 FACES CHACUN) ---
        const [desConfig, setDesConfig] = useEtatPartage("desConfig", [
          {
            id: 1,
            nom: "Dé Prudent",
            faces: [
              { type: "Rouge", pct: 10 },
              { type: "Vert", pct: 15 },
              { type: "Don", pct: 5 },
              { type: "Vert", pct: 10 },
              { type: "Rouge", pct: 5 },
              { type: "Vert", pct: 20 }
            ]
          },
          {
            id: 2,
            nom: "Dé Agressif",
            faces: [
              { type: "Rouge", pct: 50 },
              { type: "Rouge", pct: 30 },
              { type: "Vert", pct: 10 },
              { type: "Rouge", pct: 40 },
              { type: "Don", pct: 20 },
              { type: "Rouge", pct: 60 }
            ]
          },
          {
            id: 3,
            nom: "Dé Solidaire",
            faces: [
              { type: "Don", pct: 30 },
              { type: "Don", pct: 40 },
              { type: "Vert", pct: 10 },
              { type: "Rouge", pct: 10 },
              { type: "Don", pct: 50 },
              { type: "Don", pct: 25 }
            ]
          }
        ]);

        // --- TABLE 1 : COMPTE DES JOUEURS ---
        const [joueurs, setJoueurs] = useEtatPartage("joueurs", [
          {
            id: "steph",
            code: "1234",
            nom: "Steph",
            solde: 5000,
            totalMissions: 2000,
            totalJeux: 3000,
            nbPenalites: 0,
            totalPenalites: 0,
            jetonsEnJeu: 0,
            veinardActif: false,
            achatsBoutique: 0,
            argentVole: 0,
            argentGagneCarte: 0,
            paradisFiscal: false,
            finParadis: 0,
            deck: [],
            historique: [],
            qrCodesUtilises: [],
            missionsFaites: [],
            produitsAchetes: [],
            penalitesSubies: []
          },
          {
            id: "1",
            code: "1111",
            nom: "Alex",
            solde: 5400,
            totalMissions: 1000,
            totalJeux: 4400,
            nbPenalites: 0,
            totalPenalites: 0,
            jetonsEnJeu: 0,
            veinardActif: false,
            achatsBoutique: 0,
            argentVole: 0,
            argentGagneCarte: 0,
            paradisFiscal: false,
            finParadis: 0,
            deck: [],
            historique: [],
            qrCodesUtilises: [],
            missionsFaites: [],
            produitsAchetes: [],
            penalitesSubies: []
          },
          {
            id: "2",
            code: "2222",
            nom: "Sarah",
            solde: 3850,
            totalMissions: 1500,
            totalJeux: 2350,
            nbPenalites: 0,
            totalPenalites: 0,
            jetonsEnJeu: 0,
            veinardActif: false,
            achatsBoutique: 0,
            argentVole: 0,
            argentGagneCarte: 0,
            paradisFiscal: false,
            finParadis: 0,
            deck: [],
            historique: [],
            qrCodesUtilises: [],
            missionsFaites: [],
            produitsAchetes: [],
            penalitesSubies: []
          },
          {
            id: "3",
            code: "3333",
            nom: "Marc",
            solde: 2100,
            totalMissions: 800,
            totalJeux: 1300,
            nbPenalites: 0,
            totalPenalites: 0,
            jetonsEnJeu: 0,
            veinardActif: false,
            achatsBoutique: 0,
            argentVole: 0,
            argentGagneCarte: 0,
            paradisFiscal: false,
            finParadis: 0,
            deck: [],
            historique: [],
            qrCodesUtilises: [],
            missionsFaites: [],
            produitsAchetes: [],
            penalitesSubies: []
          }
        ]);

        // --- TABLE 3 : REGISTRE DES QR CODES ---
        const [qrCodesRegistre, setQrCodesRegistre] = useEtatPartage("qrCodesRegistre", []);
        // --- TABLE 5 : HISTORIQUE CONTRÔLES FISCAUX ---
        const [historiqueFiscal, setHistoriqueFiscal] = useEtatPartage("historiqueFiscal", []);

        // États Banque Joueur
        const [idSaisi, setIdSaisi] = React.useState("");
        const [codeSaisi, setCodeSaisi] = React.useState("");
        const [joueurConnecteId, setJoueurConnecteId] = React.useState(null);
        const [sousMenuBanque, setSousMenuBanque] = React.useState("accueil");
        const [modalAdminOuvert, setModalAdminOuvert] = React.useState(false);
        const [saisieCodeAdmin, setSaisieCodeAdmin] = React.useState("");

        // États Activation Contrôle Fiscal (Banque)
        const [cibleFiscaleSelectionnee, setCibleFiscaleSelectionnee] =
          React.useState("");
        const [deFiscalSelectionne, setDeFiscalSelectionne] = React.useState(1);

        // États Croupier
        const [tableCroupier, setTableCroupier] = React.useState("Roulette");
        const [joueurCroupierId, setJoueurCroupierId] = React.useState("steph");
        const [saisieCroupierManuelle, setSaisieCroupierManuelle] =
          React.useState("");
        const [croupierStack, setCroupierStack] = React.useState([]);

        // États Banquier & Boutique
        const [joueurASupprimer, setJoueurASupprimer] = React.useState(null);
        const [joueurBanquierId, setJoueurBanquierId] = React.useState("steph");
        const [rechercheBanquier, setRechercheBanquier] = React.useState("");
        const [selectionBanquier, setSelectionBanquier] = React.useState([]);

        // États Affichage Public & Animation Globale
        const [animationActive, setAnimationActive] = React.useState(false);
        const [infosAnimation, setInfosAnimation] = React.useState({
          phraseAction: "",
          face: "",
          couleur: "#555",
          phraseResultat: ""
        });
        const [estEnRoulementFiscal, setEstEnRoulementFiscal] =
          React.useState(true);
        const [historiqueAffichage, setHistoriqueAffichage] = useEtatPartage("historiqueAffichage", [
          configGlobale.phraseAucunHistorique
        ]);

        // États Imprimerie (PDF)
        const [imprMissionId, setImprMissionId] = React.useState(1);
        const [imprImgFond, setImprImgFond] = React.useState("");
        const [qteImpr, setQteImpr] = React.useState(5);
        const [chequesImprimerie, setChequesImprimerie] = React.useState([]);

        // Calculs globaux & Check Statuts
        const timeNow = Date.now();
        const joueursActifs = joueurs.map((j) => ({
          ...j,
          paradisActif: j.paradisFiscal && j.finParadis > timeNow
        }));
        const joueursVisibles = joueursActifs.filter((j) => !j.paradisActif);
        const classementActuel = [...joueursVisibles].sort(
          (a, b) => b.solde - a.solde
        );
        const classementAffiche = classementActuel.slice(
          0,
          configGlobale.limitTop
        );
        const nbParadisActifs = joueursActifs.filter(
          (j) => j.paradisActif
        ).length;
        const joueurActuel = joueursActifs.find(
          (j) => j.id === joueurConnecteId
        );

        // ================= LOGIQUE EXPORT CSV (STYLE EXCEL) =================
        // Reproduit la feuille de suivi : une ligne par élément, une colonne
        // par joueur, une case à cocher à l'intersection. Les cases déjà
        // validées dans le jeu arrivent cochées, et les totaux se recalculent
        // dès qu'on en coche une de plus.
        const exporterBaseExcel = () => {
          if (typeof XLSX === "undefined") {
            alert(
              "La librairie tableur n'est pas chargée (vendor/xlsx.js).\n" +
                "L'export Excel est indisponible sur cet aperçu."
            );
            return;
          }
          const lignes = [];
          const joueursExport = joueursActifs;
          const COL0 = 0; // libellés
          const COL_MONTANT = 1; // montant de l'élément
          const COL_J0 = 2; // première colonne joueur

          const ligne = (libelle, montant, valeurs) => {
            const l = [libelle, montant];
            valeurs.forEach((v) => l.push(v));
            lignes.push(l);
            return lignes.length; // numéro de ligne (1-indexé)
          };

          const colonne = (i) => XLSX.utils.encode_col(COL_J0 + i);

          ligne("Numéro", "", joueursExport.map((j) => j.id));
          ligne("Participants", "Montant:", joueursExport.map((j) => j.nom));
          const ligneSolde = ligne(
            "Compte en banque",
            "",
            joueursExport.map((j) => j.solde)
          );
          ligne("Jeu", "", joueursExport.map((j) => j.totalJeux));
          ligne("Missions", "", joueursExport.map((j) => j.totalMissions));
          ligne("Achats boutique", "", joueursExport.map((j) => j.achatsBoutique));
          ligne("", "", []);

          // Les trois catégories, chacune avec ses cases à cocher
          const sections = [
            ["MISSIONS (à cocher = crédit)", missions, "missionsFaites"],
            ["PRODUITS (à cocher = débit)", produits, "produitsAchetes"],
            ["PÉNALITÉS (à cocher = débit)", penalites, "penalitesSubies"]
          ];
          const plages = [];

          sections.forEach(([titre, elements, champ]) => {
            ligne(titre, "", []);
            const premiere = lignes.length + 1;
            elements.forEach((el) => {
              ligne(
                el.nom,
                el.montant,
                joueursExport.map((j) => (j[champ] || []).includes(el.id))
              );
            });
            const derniere = lignes.length;
            if (derniere >= premiere) plages.push([premiere, derniere]);
            ligne("", "", []);
          });

          // Ce que les cases déjà cochées représentent : ces éléments ont
          // déjà été portés au compte du joueur dans le jeu. Sans cette
          // soustraction, le total les compterait une seconde fois.
          const dejaApplique = (j) => {
            const somme = (elements, champ, signe) =>
              elements.reduce(
                (t, el) =>
                  (j[champ] || []).includes(el.id) ? t + signe * el.montant : t,
                0
              );
            return (
              somme(missions, "missionsFaites", 1) +
              somme(produits, "produitsAchetes", -1) +
              somme(penalites, "penalitesSubies", -1)
            );
          };

          const ligneDeja = ligne(
            "Déjà porté au compte",
            "",
            joueursExport.map(dejaApplique)
          );

          // Total : tout ce qui est coché, moins ce qui l'était déjà. Au
          // moment de l'export il vaut donc zéro, et il grandit à mesure que
          // de nouvelles cases sont cochées.
          const [mis, pro, pen] = plages;
          const totalPour = (i) => {
            const c = colonne(i);
            const M = XLSX.utils.encode_col(COL_MONTANT);
            const bloc = (p, signe) =>
              p
                ? `${signe}SUMPRODUCT(--${c}${p[0]}:${c}${p[1]},${M}${p[0]}:${M}${p[1]})`
                : "";
            const coche = (bloc(mis, "") + bloc(pro, "-") + bloc(pen, "-"))
              .replace(/^\+/, "");
            return `${coche}-${c}${ligneDeja}`;
          };

          const ligneTotal = lignes.length + 1;
          const l = ["TOTAL À APPLIQUER (nouvelles coches)", ""];
          joueursExport.forEach((_, i) => l.push({ f: totalPour(i) }));
          lignes.push(l);

          const l2 = ["Solde après application", ""];
          joueursExport.forEach((_, i) => {
            const c = colonne(i);
            l2.push({ f: `${c}${ligneSolde}+${c}${ligneTotal}` });
          });
          lignes.push(l2);

          const feuille = XLSX.utils.aoa_to_sheet(lignes);
          feuille["!cols"] = [{ wch: 34 }, { wch: 10 }].concat(
            joueursExport.map(() => ({ wch: 11 }))
          );

          const classeur = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(classeur, feuille, "Suivi");
          const horodatage = new Date()
            .toISOString()
            .slice(0, 16)
            .replace(/[:T]/g, "-");
          XLSX.writeFile(classeur, `casino-rp-suivi-${horodatage}.xlsx`);
        };

        // Ferme la session du joueur et efface toute trace de sa saisie :
        // la borne suivante ne doit rien conserver de lui.
        const fermerSessionJoueur = React.useCallback(() => {
          setJoueurConnecteId(null);
          setSousMenuBanque("accueil");
          setIdSaisi("");
          setCodeSaisi("");
        }, []);

        // ================= DÉCONNEXION AUTOMATIQUE =================
        // Les 3 bornes sont partagées par tous les joueurs : un joueur qui
        // s'éloigne sans se déconnecter laisserait son compte ouvert au
        // suivant. On revient donc à l'écran de connexion après un silence.
        React.useEffect(() => {
          if (!joueurConnecteId) return;
          const delai =
            (Number(configGlobale.dureeInactiviteSec) > 0
              ? Number(configGlobale.dureeInactiviteSec)
              : 120) * 1000;

          let minuteur;
          const relancer = () => {
            clearTimeout(minuteur);
            minuteur = setTimeout(fermerSessionJoueur, delai);
          };

          const evenements = ["pointerdown", "keydown", "wheel", "touchstart"];
          evenements.forEach((e) =>
            window.addEventListener(e, relancer, { passive: true })
          );
          relancer();

          return () => {
            clearTimeout(minuteur);
            evenements.forEach((e) => window.removeEventListener(e, relancer));
          };
        }, [joueurConnecteId, configGlobale.dureeInactiviteSec, fermerSessionJoueur]);

        // ================= SAUVEGARDE & RESTAURATION =================
        // Filet de sécurité indépendant de Firebase : la partie entière peut
        // être exportée dans un fichier, et rechargée depuis n'importe quel
        // appareil. Une copie automatique est gardée sur chaque appareil.

        const CLE_SAUVEGARDE_LOCALE = "casino-rp-sauvegarde";

        const donneesPartie = () => ({
          version: 1,
          date: new Date().toISOString(),
          configGlobale,
          missions,
          produits,
          penalites,
          cartesJeu,
          desConfig,
          joueurs,
          qrCodesRegistre,
          historiqueFiscal,
          historiqueAffichage
        });

        // Copie automatique sur l'appareil, toutes les 30 secondes. Chaque
        // appareil garde ainsi de quoi relancer la partie si la base devient
        // inaccessible.
        const [dateSauvegardeLocale, setDateSauvegardeLocale] =
          React.useState(null);

        const refDonnees = React.useRef(donneesPartie);
        refDonnees.current = donneesPartie;

        React.useEffect(() => {
          const enregistrer = () => {
            try {
              const donnees = refDonnees.current();
              localStorage.setItem(
                CLE_SAUVEGARDE_LOCALE,
                JSON.stringify(donnees)
              );
              setDateSauvegardeLocale(donnees.date);
            } catch (e) {
              // Stockage plein ou navigation privée : la sauvegarde manuelle
              // reste disponible, on ne bloque pas la partie pour autant.
            }
          };
          enregistrer();
          const minuteur = setInterval(enregistrer, 30000);
          return () => clearInterval(minuteur);
        }, []);

        React.useEffect(() => {
          try {
            const brut = localStorage.getItem(CLE_SAUVEGARDE_LOCALE);
            if (brut) setDateSauvegardeLocale(JSON.parse(brut).date);
          } catch (e) {}
        }, []);

        const telechargerSauvegarde = () => {
          const contenu = JSON.stringify(donneesPartie(), null, 2);
          const horodatage = new Date()
            .toISOString()
            .slice(0, 16)
            .replace(/[:T]/g, "-");
          const lien = document.createElement("a");
          lien.href = URL.createObjectURL(
            new Blob([contenu], { type: "application/json" })
          );
          lien.download = `casino-rp-${horodatage}.json`;
          document.body.appendChild(lien);
          lien.click();
          document.body.removeChild(lien);
          URL.revokeObjectURL(lien.href);
        };

        const appliquerSauvegarde = (donnees) => {
          // Les setters passent par useEtatPartage : en mode synchronisé, la
          // restauration se propage d'elle-même à tous les appareils.
          if (donnees.configGlobale) setConfigGlobale(donnees.configGlobale);
          if (donnees.missions) setMissions(donnees.missions);
          if (donnees.produits) setProduits(donnees.produits);
          if (donnees.penalites) setPenalites(donnees.penalites);
          if (donnees.cartesJeu) setCartesJeu(donnees.cartesJeu);
          if (donnees.desConfig) setDesConfig(donnees.desConfig);
          if (donnees.joueurs) setJoueurs(donnees.joueurs);
          if (donnees.qrCodesRegistre)
            setQrCodesRegistre(donnees.qrCodesRegistre);
          if (donnees.historiqueFiscal)
            setHistoriqueFiscal(donnees.historiqueFiscal);
          if (donnees.historiqueAffichage)
            setHistoriqueAffichage(donnees.historiqueAffichage);
        };

        // La confirmation s'affiche dans la page : une fenêtre du navigateur
        // peut être bloquée, et la restauration serait alors annulée sans que
        // rien ne l'indique.
        const [restaurationEnAttente, setRestaurationEnAttente] =
          React.useState(null);

        const restaurerDepuisFichier = (fichier) => {
          if (!fichier) return;
          const lecteur = new FileReader();
          lecteur.onload = () => {
            try {
              const donnees = JSON.parse(lecteur.result);
              if (!donnees.joueurs) {
                setRestaurationEnAttente({
                  erreur: "Ce fichier ne contient pas de partie."
                });
                return;
              }
              setRestaurationEnAttente({
                donnees,
                source: "le fichier " + fichier.name,
                quand: donnees.date
                  ? new Date(donnees.date).toLocaleString()
                  : "date inconnue"
              });
            } catch (e) {
              setRestaurationEnAttente({
                erreur: "Fichier illisible : " + e.message
              });
            }
          };
          lecteur.readAsText(fichier);
        };

        const restaurerDepuisAppareil = () => {
          try {
            const brut = localStorage.getItem(CLE_SAUVEGARDE_LOCALE);
            if (!brut) {
              setRestaurationEnAttente({
                erreur: "Aucune copie automatique sur cet appareil."
              });
              return;
            }
            const donnees = JSON.parse(brut);
            setRestaurationEnAttente({
              donnees,
              source: "la copie automatique de cet appareil",
              quand: new Date(donnees.date).toLocaleString()
            });
          } catch (e) {
            setRestaurationEnAttente({
              erreur: "Copie automatique illisible : " + e.message
            });
          }
        };

        // ================= LOGIQUE IMPRIMERIE =================
        const genererChequesPdf = () => {
          const mObj =
            missions.find((m) => m.id === Number(imprMissionId)) || missions[0];
          if (!mObj) return;
          const nouveaux = [];
          const nouveauRegistre = [...qrCodesRegistre];

          for (let i = 0; i < Number(qteImpr); i++) {
            const hashUnique =
              "QR_" + Math.random().toString(36).substring(2, 12).toUpperCase();
            nouveaux.push({
              hash: hashUnique,
              nom: mObj.nom,
              montant: mObj.montant,
              img: imprImgFond
            });
            nouveauRegistre.push({
              hash: hashUnique,
              statut: "Valide",
              type: "Mission"
            });
          }
          setChequesImprimerie(nouveaux);
          setQrCodesRegistre(nouveauRegistre);
        };

        // ================= LOGIQUE SCANNER QR & DEFAUSSE =================
        const scannerQrCodeSimule = (type, objetDonnee) => {
          if (!joueurActuel) return;
          if (configGlobale.modeLocal && type === "carte") {
            alert(
              "Mode Local activé : Le scan des cartes physiques est temporairement bloqué !"
            );
            return;
          }

          const hashSimule =
            "QR_" +
            type.toUpperCase() +
            "_" +
            Math.random().toString(36).substring(2, 8);

          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id === joueurActuel.id) {
                let soldeNv = j.solde;
                let missionsNv = j.totalMissions;
                let deckNv = [...j.deck];
                let histNv = [...j.historique];
                let qrsNv = [...j.qrCodesUtilises, hashSimule];
                let listMissionsFaites = [...j.missionsFaites];

                if (type === "mission") {
                  soldeNv += objetDonnee.montant;
                  missionsNv += objetDonnee.montant;
                  histNv.unshift(
                    `Mission validée [${objetDonnee.nom}] : +${objetDonnee.montant}$`
                  );
                  listMissionsFaites.push(objetDonnee.id);
                } else if (type === "carte") {
                  deckNv.push(objetDonnee);
                  histNv.unshift(`Carte récupérée : ${objetDonnee.nom}`);
                }

                return {
                  ...j,
                  solde: soldeNv,
                  totalMissions: missionsNv,
                  deck: deckNv,
                  historique: histNv,
                  qrCodesUtilises: qrsNv,
                  missionsFaites: listMissionsFaites
                };
              }
              return j;
            })
          );

          alert(
            type === "mission"
              ? `Mission validée ! +${objetDonnee.montant}$`
              : `Carte "${objetDonnee.nom}" ajoutée dans votre deck !`
          );
          setSousMenuBanque("scanner_choix");
        };

        const defausserCarte = (carteId) => {
          setJoueurs((prev) =>
            prev.map((j) =>
              j.id === joueurActuel.id
                ? {
                    ...j,
                    deck: j.deck.filter((c) => c.id !== carteId),
                    veinardActif:
                      carteId === "veinard" ? false : j.veinardActif,
                    historique: [`Carte défaussée`, ...j.historique]
                  }
                : j
            )
          );
          alert("Carte défaussée avec succès.");
        };

        // ================= LOGIQUE CROUPIER =================
        const totalCroupier =
          croupierStack.reduce((a, b) => a + b, 0) +
          Number(saisieCroupierManuelle || 0);

        // Deux temps distincts à la table :
        //  - l'achat de jetons n'est qu'une conversion, le joueur n'a encore
        //    rien gagné ni perdu : aucune carte ne s'y applique ;
        //  - le retour des jetons révèle le résultat, et c'est là que
        //    Le Veinard adoucit la perte ou gonfle le gain.
        const actionCroupierCalcul = (typeOp) => {
          const jC = joueurs.find((j) => j.id === joueurCroupierId);
          if (!jC) return;
          const montant = totalCroupier;

          if (montant <= 0) {
            alert("Veuillez saisir un montant.");
            return;
          }

          // La carte n'agit que si le joueur l'a lui-meme activee.
          const aLeVeinard =
            !!jC.veinardActif && jC.deck.some((c) => c.id === "veinard");
          const jetonsAvant = jC.jetonsEnJeu || 0;

          if (typeOp === "retrait") {
            if (montant > jC.solde) {
              alert("Montant insuffisant !");
              return;
            }
            if (montant > configGlobale.limiteRetraitCroupier) {
              alert(configGlobale.phraseLimiteCroupier);
              return;
            }
            setJoueurs((prev) =>
              prev.map((j) =>
                j.id === jC.id
                  ? {
                      ...j,
                      solde: Math.max(0, j.solde - montant),
                      totalJeux: j.totalJeux - montant,
                      jetonsEnJeu: jetonsAvant + montant,
                      historique: [
                        `Croupier [${tableCroupier}] : achat de ${montant}$ de jetons`,
                        ...j.historique
                      ]
                    }
                  : j
              )
            );
            setCroupierStack([]);
            setSaisieCroupierManuelle("");
            return;
          }

          // Retour des jetons : le résultat de la partie est la différence
          // entre ce que le joueur rapporte et ce qu'il avait pris.
          const resultat = montant - jetonsAvant;
          let bonus = 0;
          if (aLeVeinard && resultat < 0) {
            bonus = Math.round(
              (-resultat * configGlobale.bonusVeinardPertes) / 100
            );
          } else if (aLeVeinard && resultat > 0) {
            bonus = Math.round(
              (resultat * configGlobale.bonusVeinardGain) / 100
            );
          }
          const credite = montant + bonus;

          if (bonus > 0) {
            alert(
              resultat < 0
                ? `Effet [Le Veinard] : perte de ${-resultat}$ réduite à ${-resultat - bonus}$. Crédit : ${credite}$`
                : `Effet [Le Veinard] : gain de ${resultat}$ porté à ${resultat + bonus}$. Crédit : ${credite}$`
            );
          }

          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id !== jC.id) return j;
              const bilan =
                resultat === 0
                  ? "à l'équilibre"
                  : resultat > 0
                    ? `gain de ${resultat + bonus}$`
                    : `perte de ${-resultat - bonus}$`;
              const nvHist = [
                `Croupier [${tableCroupier}] : retour de ${montant}$ de jetons, ${bilan}`,
                ...j.historique
              ];
              // La carte n'est consommée que si elle a réellement joué.
              if (bonus > 0) nvHist.unshift("Carte [Le Veinard] consommée");
              return {
                ...j,
                solde: Math.max(0, j.solde + credite),
                totalJeux: j.totalJeux + credite,
                jetonsEnJeu: 0,
            veinardActif: false,
                deck:
                  bonus > 0
                    ? j.deck.filter((c) => c.id !== "veinard")
                    : j.deck,
                historique: nvHist
              };
            })
          );

          setCroupierStack([]);
          setSaisieCroupierManuelle("");
        };

        // ================= LOGIQUE BANQUIER (CHECKBOXES & MODE LOCAL) =================
        const toggleSelectionBanquier = (item) => {
          if (
            selectionBanquier.find(
              (i) => i.id === item.id && i.type === item.type
            )
          ) {
            setSelectionBanquier(
              selectionBanquier.filter(
                (i) => !(i.id === item.id && i.type === item.type)
              )
            );
          } else {
            setSelectionBanquier([...selectionBanquier, item]);
          }
        };

        const validerPanierBanquier = () => {
          if (selectionBanquier.length === 0) return;
          const jB = joueurs.find((j) => j.id === joueurBanquierId);
          if (!jB) return;

          let coutTotal = 0,
            gainsTotal = 0,
            penalitesTotal = 0;
          const details = [],
            missionsN = [],
            produitsN = [],
            penalitesN = [];

          selectionBanquier.forEach((item) => {
            if (item.type === "produit") {
              coutTotal += item.montant;
              details.push(`Achat ${item.nom}`);
              produitsN.push(item.id);
            }
            if (item.type === "penalite") {
              penalitesTotal += item.montant;
              coutTotal += item.montant;
              details.push(`Pénalité ${item.nom}`);
              penalitesN.push(item.id);
            }
            if (item.type === "mission") {
              gainsTotal += item.montant;
              details.push(`Mission ${item.nom}`);
              missionsN.push(item.id);
            }
          });

          if (jB.solde + gainsTotal < coutTotal) {
            alert("Solde insuffisant pour régler l'ensemble du panier !");
            return;
          }

          setJoueurs((prev) =>
            prev.map((j) => {
              if (j.id === jB.id) {
                return {
                  ...j,
                  solde: j.solde + gainsTotal - coutTotal,
                  totalMissions: j.totalMissions + gainsTotal,
                  achatsBoutique:
                    j.achatsBoutique + (coutTotal - penalitesTotal),
                  nbPenalites: j.nbPenalites + (penalitesTotal > 0 ? 1 : 0),
                  totalPenalites: (j.totalPenalites || 0) + penalitesTotal,
                  missionsFaites: [...j.missionsFaites, ...missionsN],
                  produitsAchetes: [...j.produitsAchetes, ...produitsN],
                  penalitesSubies: [...j.penalitesSubies, ...penalitesN],
                  historique: [
                    `Guichet : ${details.join(", ")}`,
                    ...j.historique
                  ]
                };
              }
              return j;
            })
          );

          alert("Panier validé avec succès !");
          setSelectionBanquier([]);
        };

        // ================= LOGIQUE CONTRÔLE FISCAL (ANIMATION GLOBALE & BANQUE) =================
        // Joue l'animation du dé, sans toucher aux comptes. Tous les appareils
        // l'exécutent en recevant l'événement diffusé, pour que la salle voie
        // le même tirage au même moment.
        const jouerAnimation = React.useCallback((ev) => {
          const faces = ev.faces && ev.faces.length ? ev.faces : [ev.facePct];
          setInfosAnimation({
            phraseAction: ev.phraseAction,
            face: `${ev.facePct}%`,
            couleur: ev.couleur,
            phraseResultat: ev.phraseResultat
          });
          setAnimationActive(true);
          setEstEnRoulementFiscal(true);

          let compteur = 0;
          const intervalle = setInterval(() => {
            setInfosAnimation((prev) => ({
              ...prev,
              face: `${faces[Math.floor(Math.random() * faces.length)]}%`
            }));
            compteur += 80;

            if (compteur >= ev.secRoulement * 1000) {
              clearInterval(intervalle);
              setInfosAnimation((prev) => ({ ...prev, face: `${ev.facePct}%` }));
              setEstEnRoulementFiscal(false);
              setTimeout(
                () => setAnimationActive(false),
                ev.secArret * 1000 + 1000
              );
            }
          }, 80);
        }, []);

        // Écoute les tirages lancés depuis les autres appareils.
        React.useEffect(() => {
          if (!Sync.actif) return;
          // Un tirage déjà en base ne doit pas rejouer à chaque connexion.
          let dernierVu = Date.now();
          return Sync.ecouter("evenement", (ev) => {
            if (!ev || !ev.ts || ev.ts <= dernierVu) return;
            dernierVu = ev.ts;
            jouerAnimation(ev);
          });
        }, [jouerAnimation]);

        const lancerControleFiscal = () => {
          if (!cibleFiscaleSelectionnee) {
            alert("Choisissez une cible.");
            return;
          }
          const jL = joueurActuel;
          const jC = joueursActifs.find(
            (j) => j.id === cibleFiscaleSelectionnee
          );
          const deConfig = desConfig.find(
            (d) => d.id === Number(deFiscalSelectionne)
          );
          if (!jL || !jC || !deConfig) return;

          // Un champ Admin vide ou non numérique donnerait NaN, et la condition
          // d'arrêt de l'intervalle ne serait jamais vraie : le dé tournerait
          // sans fin. On retombe sur les valeurs par défaut dans ce cas.
          const dureeSure = (valeur, secours) => {
            const n = Number(valeur);
            return Number.isFinite(n) && n >= 0 ? n : secours;
          };
          const secRoulement = dureeSure(configGlobale.dureeRoulement, 3);
          const secArret = dureeSure(configGlobale.dureeArret, 2);

          setSousMenuBanque("animation_attente");
          const faceTiree =
            deConfig.faces[Math.floor(Math.random() * deConfig.faces.length)];
          const couleurs = {
            Rouge: "#f44336",
            Vert: "#4CAF50",
            Don: "#2196F3",
            Zéro: "#9C27B0"
          };

          let texteResultat = "";
          let valeurReelleAttaquant = 0;
          let valeurReelleCible = 0;
          let donsDistribues = [];

          if (faceTiree.type === "Rouge") {
            const val = Math.round(jL.solde * (faceTiree.pct / 100));
            valeurReelleAttaquant = -val;
            valeurReelleCible = val;
            texteResultat = `Échec de l'attaque ! L'attaquant perd ${val}$ transférés à la cible.`;
          } else if (faceTiree.type === "Vert") {
            const val = Math.round(jC.solde * (faceTiree.pct / 100));
            valeurReelleCible = -val;
            valeurReelleAttaquant = val;
            texteResultat = `Attaque réussie ! La cible perd ${val}$ saisis par l'attaquant.`;
          } else if (faceTiree.type === "Don") {
            const valL = Math.round(jL.solde * (faceTiree.pct / 100));
            const valC = Math.round(jC.solde * (faceTiree.pct / 100));
            const cagnotte = valL + valC;
            valeurReelleAttaquant = -valL;
            valeurReelleCible = -valC;

            const minSolde = Math.min(...joueursActifs.map((j) => j.solde));
            const pauvres = joueursActifs.filter((j) => j.solde === minSolde);
            const part = Math.round(cagnotte / pauvres.length);
            donsDistribues = pauvres.map((p) => ({ id: p.id, montant: part }));
            texteResultat = `Solidarité ! ${cagnotte}$ saisis et redistribués aux plus démunis.`;
          }

          const phraseInitiale = configGlobale.phraseAttaqueCible
            .replace("{LANCEUR}", jL.nom)
            .replace("{DE}", deConfig.nom)
            .replace("{CIBLE}", jC.nom);
          const evenement = {
            phraseAction: phraseInitiale,
            facePct: faceTiree.pct,
            couleur: couleurs[faceTiree.type],
            phraseResultat: texteResultat,
            faces: deConfig.faces.map((f) => f.pct),
            secRoulement,
            secArret
          };
          // Hors ligne, aucun appareil ne recevra la diffusion : on joue ici.
          if (Sync.actif) Sync.diffuser(evenement);
          else jouerAnimation(evenement);

          // Seul l'appareil lanceur touche aux comptes, sinon les huit
          // appareils appliqueraient chacun le même transfert.
          setTimeout(
                () => {
                  setJoueurs((prev) =>
                    prev.map((item) => {
                      let nSolde = item.solde;
                      let nHist = [...item.historique];
                      let nVole = item.argentVole || 0;
                      let nDeck = item.deck;

                      if (item.id === jL.id) {
                        nSolde += valeurReelleAttaquant;
                        if (valeurReelleAttaquant > 0)
                          nVole += valeurReelleAttaquant;
                        nHist.unshift(
                          `Contrôle lancé : ${valeurReelleAttaquant}$`
                        );
                        // La carte est consommée par le tirage.
                        nDeck = nDeck.filter((c) => c.id !== "controle_fiscal");
                      }
                      if (item.id === jC.id) {
                        nSolde += valeurReelleCible;
                        nHist.unshift(`Subi Contrôle : ${valeurReelleCible}$`);
                      }
                      const partDon = donsDistribues.find(
                        (d) => d.id === item.id
                      );
                      if (partDon) {
                        nSolde += partDon.montant;
                        nHist.unshift(
                          `Don de solidarité reçu : +${partDon.montant}$`
                        );
                      }
                      return {
                        ...item,
                        solde: Math.max(0, nSolde),
                        historique: nHist,
                        argentVole: nVole,
                        deck: nDeck
                      };
                    })
                  );

                  const histEntry = `${jL.nom} vs ${jC.nom} [${deConfig.nom}] -> Face ${faceTiree.type} (${faceTiree.pct}%) : ${texteResultat}`;
                  setHistoriqueFiscal((prev) => [
                    {
                      lanceur: jL.nom,
                      cible: jC.nom,
                      de: deConfig.nom,
                      details: histEntry,
                      date: new Date().toLocaleTimeString()
                    },
                    ...prev
                  ]);
                  setHistoriqueAffichage((prev) =>
                    [
                      histEntry,
                      prev[0] === configGlobale.phraseAucunHistorique
                        ? null
                        : prev[0]
                    ].filter(Boolean)
                  );

                  setSousMenuBanque("accueil");
                },
            (secRoulement + secArret) * 1000 + 1000
          );
        };

        // ========================================================
        // ================= RENDU DES INTERFACES =================
        // ========================================================

        if (interfaceActive === "menu") {
          return (
            <div
              style={{
                textAlign: "center",
                padding: "40px",
                maxWidth: "400px",
                margin: "0 auto"
              }}
            >
              <h1>🎰 Casino RP - Menu</h1>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: "15px"
                }}
              >
                <button
                  onClick={() => setInterfaceActive("admin")}
                  className="checkbox-btn"
                  style={{ background: "#333" }}
                >
                  🛠️ Admin & Config
                </button>
                <button
                  onClick={() => setInterfaceActive("affichage")}
                  className="checkbox-btn"
                  style={{ background: "#2196F3" }}
                >
                  📺 Écran d'affichage
                </button>
                <button
                  onClick={() => setInterfaceActive("banque")}
                  className="checkbox-btn"
                  style={{ background: "#4CAF50" }}
                >
                  📱 Banque Automatisée
                </button>
                <button
                  onClick={() => setInterfaceActive("croupier")}
                  className="checkbox-btn"
                  style={{ background: "#9C27B0" }}
                >
                  🎲 Croupier
                </button>
                <button
                  onClick={() => setInterfaceActive("banquier")}
                  className="checkbox-btn"
                  style={{ background: "#FF9800" }}
                >
                  🏦 Banquier & Boutique
                </button>
              </div>
            </div>
          );
        }

        // --- 2. INTERFACE ADMIN ---
        if (interfaceActive === "admin") {
          return (
            <div
              style={{ padding: "30px", maxWidth: "900px", margin: "0 auto" }}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  flexWrap: "wrap",
                  gap: "10px"
                }}
              >
                <h1 style={{ color: "#FF9800", margin: 0 }}>
                  🛠️ Interface Admin
                </h1>
                <button
                  onClick={() => setInterfaceActive("base")}
                  style={{
                    padding: "10px 18px",
                    background: "#2196F3",
                    color: "#fff",
                    border: "none",
                    borderRadius: "6px",
                    fontWeight: "bold",
                    cursor: "pointer"
                  }}
                >
                  🗄️ Voir la base de données
                </button>
              </div>

              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: "20px"
                }}
              >
                {/* Table 4 */}
                <div
                  style={{
                    background: "#222",
                    padding: "20px",
                    borderRadius: "12px"
                  }}
                >
                  <h3 style={{ color: "#4CAF50", margin: "0 0 15px 0" }}>
                    Table 4 : Configuration Globale
                  </h3>
                  <div
                    style={{
                      display: "grid",
                      gridTemplateColumns: "1fr 1fr",
                      gap: "10px"
                    }}
                  >
                    <label>
                      Code Admin :{" "}
                      <input
                        type="text"
                        value={configGlobale.codeAdmin}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            codeAdmin: e.target.value
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                    <label>
                      Taille du Top :{" "}
                      <input
                        type="number"
                        value={configGlobale.limitTop}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            limitTop: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                    <label>
                      Durée Paradis Fiscal (Min) :{" "}
                      <input
                        type="number"
                        value={configGlobale.dureeParadisFiscalMin}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            dureeParadisFiscalMin: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                    <label>
                      Limite Retrait Croupier :{" "}
                      <input
                        type="number"
                        value={configGlobale.limiteRetraitCroupier}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            limiteRetraitCroupier: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>

                    {/* AJOUT DES RÉGLAGES DE TEMPS POUR LE DÉ */}
                    <label>
                      Durée roulement dé (s) :{" "}
                      <input
                        type="number"
                        value={configGlobale.dureeRoulement}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            dureeRoulement: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                    <label>
                      Durée arrêt image (s) :{" "}
                      <input
                        type="number"
                        value={configGlobale.dureeArret}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            dureeArret: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>

                    <label>
                      Déconnexion borne après (s) :{" "}
                      <input
                        type="number"
                        value={configGlobale.dureeInactiviteSec}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            dureeInactiviteSec: Number(e.target.value)
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>

                    <label style={{ gridColumn: "span 2" }}>
                      Phrase Limite Croupier :{" "}
                      <input
                        type="text"
                        value={configGlobale.phraseLimiteCroupier}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            phraseLimiteCroupier: e.target.value
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                  </div>

                  <div
                    style={{
                      marginTop: "15px",
                      padding: "10px",
                      background: configGlobale.modeLocal
                        ? "#d32f2f"
                        : "#4CAF50",
                      borderRadius: "6px"
                    }}
                  >
                    <label
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: "10px",
                        cursor: "pointer",
                        fontWeight: "bold"
                      }}
                    >
                      <input
                        type="checkbox"
                        checked={configGlobale.modeLocal}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            modeLocal: e.target.checked
                          })
                        }
                        style={{ width: "20px", height: "20px" }}
                      />
                      MODE LOCAL (Bloque le scan des cartes physiques / Secours)
                    </label>
                  </div>
                  <div style={{ marginTop: "15px" }}>
                    <label>
                      Phrase Affichage Contrôle :{" "}
                      <input
                        type="text"
                        value={configGlobale.phraseAttaqueCible}
                        onChange={(e) =>
                          setConfigGlobale({
                            ...configGlobale,
                            phraseAttaqueCible: e.target.value
                          })
                        }
                        style={{ width: "100%", padding: "5px" }}
                      />
                    </label>
                  </div>
                </div>

                {/* Table 6 : Les 3 Dés */}
                <div
                  style={{
                    background: "#222",
                    padding: "20px",
                    borderRadius: "12px"
                  }}
                >
                  <h3 style={{ color: "#2196F3", margin: "0 0 15px 0" }}>
                    Table 6 : Éditeur des 3 Dés (6 faces par dé)
                  </h3>
                  {desConfig.map((de, dIndex) => (
                    <div
                      key={de.id}
                      style={{
                        marginBottom: "15px",
                        padding: "10px",
                        border: "1px solid #555",
                        borderRadius: "8px"
                      }}
                    >
                      <input
                        type="text"
                        value={de.nom}
                        onChange={(e) => {
                          let nD = [...desConfig];
                          nD[dIndex].nom = e.target.value;
                          setDesConfig(nD);
                        }}
                        style={{
                          fontWeight: "bold",
                          background: "transparent",
                          color: "#2196F3",

                )}

                <div>
                  <label style={{ fontWeight: "bold" }}>
                    Sélectionner le Joueur au guichet :
                  </label>
                  <select
                    value={joueurBanquierId}
                    onChange={(e) => setJoueurBanquierId(e.target.value)}
                    style={{
                      width: "100%",
                      padding: "12px",
                      background: "#333",
                      color: "#fff",
                      border: "1px solid #555",
                      borderRadius: "6px",
                      fontSize: "1.1rem",
                      marginTop: "5px"
                    }}
                  >
                    {joueurs.map((j) => (
                      <option key={j.id} value={j.id}>
                        {j.nom} (Solde: {j.solde}$)
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <input
                    type="text"
                    placeholder="🔍 Rechercher..."
                    value={rechercheBanquier}
                    onChange={(e) => setRechercheBanquier(e.target.value)}
                    style={{
                      width: "100%",
                      padding: "12px",
                      background: "#333",
                      color: "#fff",
                      border: "1px solid #555",
                      borderRadius: "6px",
                      fontSize: "1rem",
                      boxSizing: "border-box"
                    }}
                  />
                </div>

                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: "15px",
                    maxHeight: "400px",
                    overflowY: "auto"
                  }}
                >
                  {itemsFiltres.map((item, idx) => {
                    const isSelected = selectionBanquier.some(
                      (s) => s.id === item.id && s.type === item.type
                    );
                    let colorLabel = "#fff";
                    if (item.type === "mission") colorLabel = "#4CAF50";
                    if (item.type === "penalite") colorLabel = "#f44336";
                    if (item.type === "produit") colorLabel = "#FF9800";

                    return (
                      <div
                        key={idx}
                        onClick={() => toggleSelectionBanquier(item)}
                        className={`checkbox-btn ${isSelected ? "selected" : ""}`}
                      >
                        <div
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "center"
                          }}
                        >
                          <span style={{ fontWeight: "bold" }}>{item.nom}</span>
                          <span
                            style={{
                              color: isSelected ? "#fff" : colorLabel,
                              fontWeight: "bold"
                            }}
                          >
                            {item.type === "mission" ? "+" : "-"}
                            {item.montant}$
                          </span>
                        </div>
                        <div
                          style={{
                            fontSize: "0.8rem",
                            color: isSelected ? "#e0e0e0" : "#aaa",
                            marginTop: "5px",
                            textTransform: "uppercase"
                          }}
                        >
                          {item.type}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button
                  onClick={validerPanierBanquier}
                  disabled={selectionBanquier.length === 0}
                  style={{
                    padding: "20px",
                    background:
                      selectionBanquier.length > 0 ? "#4CAF50" : "#555",
                    color: "#fff",
                    border: "none",
                    borderRadius: "8px",
                    fontSize: "1.2rem",
                    fontWeight: "bold",
                    cursor:
                      selectionBanquier.length > 0 ? "pointer" : "not-allowed"
                  }}
                >
                  ✅ VALIDER LE PANIER ({selectionBanquier.length})
                </button>
              </div>

              <div style={{ marginTop: "20px", textAlign: "center" }}>
                <button
                  onClick={() => setInterfaceActive("menu")}
                  style={{
                    padding: "12px 25px",
                    background: "#555",
                    color: "#fff",
                    border: "none",
                    borderRadius: "8px",
                    cursor: "pointer"
                  }}
                >
                  🔙 Retour au menu
                </button>
              </div>
            </div>
          );
        }

        return null;
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
